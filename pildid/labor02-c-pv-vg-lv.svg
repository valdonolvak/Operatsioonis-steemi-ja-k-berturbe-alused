<text x="16" y="360" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="13" fill="#4ec94e" xml:space="preserve">kasutaja@deb-srv:~$</text>
<text x="172.6" y="360" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" xml:space="preserve">sudo lvs</text>
<text x="16" y="379" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="13" fill="#d4d4d4" xml:space="preserve">  LV           VG        Attr       LSize Pool Origin Data%  Meta%  Move Log Cpy%Sync Convert</text>
