{"q": "Kuidas kontrollib CA DV-sertifikaadi (domain validated) korral, et taotleja omab domeeni?", "o": ["Taotleja saadab passi koopia", "Taotleja paneb serverisse kindla faili (ACME HTTP-01) või DNS-i kindla kirje (DNS-01)", "CA helistab ettevõtte juhile", "Kontrolli ei tehta"], "c": 1, "e": "DV kontrollib ainult domeeni üle valitsemist. Nii saab tasuta sertifikaadi ka õngitsusleht minu-pank-turvakontroll.com. OV ja EV kontrollivad lisaks organisatsiooni."},
{"q": "Mis juhtus 2011. aastal Hollandi CA-ga DigiNotar?", "o": ["Selle juurvõti murti kvantarvutiga", "CA-sse murti sisse ja ründajad väljastasid võltssertifikaadi muu hulgas domeenile *.google.com", "See unustas sertifikaate uuendada", "See hakkas väljastama ainult EV-sertifikaate"], "c": 1, "e": "Võltssertifikaadiga kuulati Iraanis pealt sadade tuhandete kasutajate Gmaili-ühendusi. Brauserid eemaldasid DigiNotari usaldushoidlatest ja ettevõte läks pankrotti."},

{"q": "Mis on TLS-is sertifikaadi tühistamine (revocation) ja millal seda vaja on?", "o": ["Sertifikaadi uuendamine iga kuu", "Sertifikaadi kehtetuks tunnistamine enne aja lõppu, nt privaatvõtme lekke korral (CRL, OCSP)", "Sertifikaadi kustutamine brauseri vahemälust", "Domeeni müümine"], "c": 1, "e": "Kui serveri privaatvõti lekib, saab ründaja end serverina esitada kuni sertifikaadi aegumiseni. Tühistamine katkestab selle. Lühike kehtivusaeg vähendab tühistamise vajadust."},
{"q": "Miks vajab TLS 1.3 käepigistus ainult ühte edasi-tagasi sõnumit (TLS 1.2 vajas kahte)?", "o": ["TLS 1.3 ei kasuta krüpteerimist", "Brauser saadab oma ajutise võtmejagamise kohe esimeses sõnumis (ClientHello)", "TLS 1.3 jätab sertifikaadi saatmata", "TLS 1.3 kasutab ainult sümmeetrilist krüptograafiat"], "c": 1, "e": "Pärast ServerHellot on mõlemal pool sama jagatud saladus (Diffie–Hellman). Seepärast liigub juba serveri sertifikaat krüpteeritult."},
{"q": "Mida tõestab TLS 1.3 sõnum CertificateVerify?", "o": ["Et sertifikaat on kantud CT-logisse", "Et serveril on sertifikaadi privaatvõti: server allkirjastab sellega kogu senise käepigistuse", "Et klient teab parooli", "Et ühendus on kiire"], "c": 1, "e": "Sertifikaat on avalik ja igaüks saab selle kopeerida. Ilma CertificateVerify'ta võiks ründaja saata kellegi teise sertifikaadi. Allkirja saab aga teha ainult privaatvõtme omanik."},

{"q": "Mida näeb pealtkuulaja TLS 1.3 ühenduses?", "o": ["Kogu sisu, sest TLS 1.3 krüpteerib ainult paroole", "Domeeninime (SNI) ClientHellos, kuid mitte serveri sertifikaati ega lehe sisu", "Ainult serveri sertifikaati", "Mitte midagi, isegi IP-aadresse mitte"], "c": 1, "e": "TLS 1.3 krüpteerib ka sertifikaadi. Domeeninimi on ClientHellos siiski näha ning selle peitmiseks on loodud ECH (Encrypted Client Hello). IP-aadressid ja liikluse maht on alati nähtavad."},

{"q": "Mida näitab lukuikoon brauseri aadressiribal?", "o": ["Et leht on aus ja kontrollitud", "Et ühendus on krüpteeritud ja serveril on selle domeeni sertifikaat", "Et leht ei sisalda pahavara", "Et organisatsioon on äriregistris"], "c": 1, "e": "Õngitsusleht saab DV-sertifikaadi samamoodi nagu päris pank. Kontrolli alati aadressi."},
{"q": "Miks on Eesti ID-kaardil kaks eraldi võtmepaari ja PIN-koodi?", "o": ["Üks on varukoopia juhuks, kui teine kaob", "Et pahatahtlik veebileht ei saaks „autentimise“ sildi all lasta allkirjastada lepingu räsi", "Et kaart töötaks kahes riigis", "PIN1 on lühem ja kiirem"], "c": 1, "e": "Autentimisel allkirjastab kaart serveri juhusliku väljakutse PIN1-ga, allkirjastamisel dokumendi räsi PIN2-ga. Kui võti oleks sama, ei saaks kaart neid kahte eristada."},
{"q": "Milleks on ID-kaardi PIN2?", "o": ["Avab kaardi füüsiliselt", "Logib arvutisse", "Muudab PIN1", "Kinnitab digiallkirja andmise privaatvõtmega"], "c": 3, "e": "PIN ei ole võti, vaid luba kiibile võtit kasutada. Privaatvõti genereeriti kiibis ja seda ei saa välja lugeda. Kolm vale katset lukustavad PIN-i. PIN2-ga antud kvalifitseeritud digiallkiri on eIDAS-i järgi võrdne omakäelise allkirjaga."}

const $=id=>document.getElementById(id);
let order=[],state=[],cur=0,shuffled=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(indexes){
  order=indexes;cur=0;
  state=order.map(()=>({picked:null,ok:null}));
  shuffled=order.map(i=>shuffle(KYSIMUSED[i].o.map((t,k)=>({t,k}))));
  $('tot').textContent=order.length;
  renderBar();render();
}
function renderBar(){
  const bar=$('bar');bar.innerHTML='';
  order.forEach((_,n)=>{const s=document.createElement('button');s.className='seg'+(state[n].ok===true?' ok':state[n].ok===false?' bad':'')+(n===cur?' cur':'');
    s.title='Küsimus '+(n+1);s.setAttribute('aria-label','Küsimus '+(n+1));s.onclick=()=>{cur=n;render();renderBar()};bar.appendChild(s)});
  $('okc').textContent=state.filter(s=>s.ok===true).length;
  $('badc').textContent=state.filter(s=>s.ok===false).length;
}
function render(){
  if(cur>=order.length)return renderEnd();
  $('pos').textContent=cur+1;
  const Q=KYSIMUSED[order[cur]],st=state[cur],opts=shuffled[cur],L='ABCD';
  let h='<p class="qnum">Küsimus '+(cur+1)+'</p><p class="qtext">'+Q.q+'</p>';
  opts.forEach((o,n)=>{
    let cls='opt';
    if(st.picked!==null){if(o.k===Q.c)cls+=' ok';else if(n===st.picked)cls+=' bad';else cls+=' dim'}
    h+='<button class="'+cls+'" data-n="'+n+'"'+(st.picked!==null?' disabled':'')+'><span class="k">'+L[n]+'</span><span>'+o.t+'</span></button>';
  });
  if(st.picked!==null){
    h+='<div class="fb '+(st.ok?'ok':'bad')+'"><strong>'+(st.ok?'Õige!':'Vale. Õige vastus: '+L[opts.findIndex(o=>o.k===Q.c)])+'</strong>'+Q.e+'</div>';
  }
  const answered=state.filter(s=>s.picked!==null).length;
  h+='<div class="actions"><button class="btn" id="prev"'+(cur===0?' disabled':'')+'>← Eelmine</button>';
  h+='<span class="hint">'+(st.picked===null?'Vali üks vastus':'')+'</span>';
  h+='<button class="btn primary" id="next"'+(st.picked===null?' disabled':'')+'>'+(answered===order.length?'Vaata tulemust':'Järgmine →')+'</button></div>';
  $('card').innerHTML=h;
  $('card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  $('prev').onclick=()=>{cur--;render();renderBar()};
  $('next').onclick=next;
}
function pick(n){
  const st=state[cur];if(st.picked!==null)return;
  st.picked=n;st.ok=shuffled[cur][n].k===KYSIMUSED[order[cur]].c;
  render();renderBar();$('next').focus();
}
function next(){
  if(state.every(s=>s.picked!==null)){cur=order.length;renderBar();return render()}
  let n=cur+1;while(n<order.length&&state[n].picked!==null)n++;
  if(n>=order.length)n=state.findIndex(s=>s.picked===null);
  cur=n;render();renderBar();
}
function renderEnd(){
  $('pos').textContent=order.length;
  const ok=state.filter(s=>s.ok).length,tot=order.length,pct=Math.round(ok/tot*100);
  const grade=pct>=90?'Suurepärane! Peatüki põhimõisted on selged.':pct>=70?'Hea tulemus. Vaata valesti vastatud küsimused üle.':pct>=50?'Arvestatav, aga loe vastavad alapeatükid uuesti läbi.':'Loe peatükk uuesti läbi ja proovi siis veel kord.';
  const wrong=order.map((q,n)=>({q,n})).filter(x=>state[x.n].ok===false);
  let h='<p class="qnum">Tulemus</p><p class="big">'+ok+' / '+tot+'</p><p class="grade">'+pct+'% · '+grade+'</p>';
  if(wrong.length){
    h+='<p class="qnum" style="margin-top:1rem">Valesti vastatud</p><ul class="review">';
    wrong.forEach(x=>{const Q=KYSIMUSED[x.q];h+='<li>'+Q.q+'<br><span class="ans">Õige: '+Q.o[Q.c]+'</span></li>'});
    h+='</ul>';
  }
  h+='<div class="actions"><button class="btn" id="again">Alusta uuesti</button>'+(wrong.length?'<button class="btn primary" id="retry">Korda valesid ('+wrong.length+')</button>':'')+'</div>';
  $('card').innerHTML=h;
  $('again').onclick=()=>start(KYSIMUSED.map((_,i)=>i));
  if(wrong.length)$('retry').onclick=()=>start(wrong.map(x=>x.q));
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(cur<order.length&&state[cur].picked===null&&['1','2','3','4'].includes(e.key))pick(+e.key-1);
  else if(e.key==='Enter'&&cur<order.length&&state[cur].picked!==null){e.preventDefault();next()}
});
start(KYSIMUSED.map((_,i)=>i));
</script>
</body>
