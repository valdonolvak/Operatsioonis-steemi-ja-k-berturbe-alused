<title>Peatükk 6 – test: register ja konfiguratsioonihaldur</title>
<style>
:root{--bg:#fff;--card:#f6f5f1;--text:#1f1f1d;--muted:#6b6a65;--border:#d6d4cc;--accent:#185fa5;--accent-bg:#e6f1fb;
--ok:#3b6d11;--ok-bg:#eaf3de;--ok-line:#639922;--bad:#a32d2d;--bad-bg:#fcebeb;--bad-line:#e24b4a;--todo:#e4e2da;
--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--card:#262624;--text:#ecebe6;--muted:#a3a29c;--border:#44443f;--accent:#85b7eb;--accent-bg:#0c447c;
--ok:#c0dd97;--ok-bg:#27500a;--ok-line:#97c459;--bad:#f7c1c1;--bad-bg:#791f1f;--bad-line:#f09595;--todo:#3a3a37}}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);max-width:760px;margin:2rem auto;padding:0 1rem;line-height:1.6}
h1{font-size:22px;font-weight:500;margin:0 0 .25rem}
.sub{color:var(--muted);font-size:14px;margin:0 0 1.5rem}
nav a{color:var(--accent);font-size:14px}
code{font-family:var(--mono);font-size:.9em;background:var(--card);padding:0 4px;border-radius:4px}
.bar{display:flex;gap:3px;margin:0 0 .5rem}
.seg{flex:1;height:8px;border-radius:2px;background:var(--todo);border:0;padding:0;cursor:pointer}
.seg.ok{background:var(--ok-line)}.seg.bad{background:var(--bad-line)}.seg.cur{outline:2px solid var(--accent);outline-offset:1px}
.stats{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:0 0 1.5rem}
.stats b{color:var(--text);font-weight:500}
.card{background:var(--card);border-radius:12px;padding:1.25rem 1.5rem}
.qnum{font-size:13px;color:var(--muted);margin:0 0 .25rem}
.qtext{font-size:18px;font-weight:500;margin:0 0 1rem;line-height:1.5}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.7rem 1rem;margin:0 0 8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.opt.ok .k,.opt.bad .k{border-color:currentColor;color:inherit}

.fb{margin:1rem 0 0;padding:.75rem 1rem;border-left:3px solid;border-radius:0;background:var(--bg);font-size:15px}
.fb.ok{border-color:var(--ok-line)}.fb.bad{border-color:var(--bad-line)}
.fb strong{display:block;margin-bottom:2px}
.fb.ok strong{color:var(--ok)}.fb.bad strong{color:var(--bad)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:8px;flex-wrap:wrap}
button.btn{font:inherit;font-size:15px;padding:.5rem 1.1rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.btn.primary{color:#042c53}}
button.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted)}

.review .ans{color:var(--ok);font-size:14px}

<body>
<nav><a href="https://github.com/valdonolvak/Operatsioonis-steemi-ja-k-berturbe-alused/blob/main/peatykid/06-register.md">← Peatükk 6</a> · <a href="06-register.html">Interaktiivne leht</a></nav>
<h1>Test: register ja konfiguratsioonihaldur</h1>
<p class="sub">Vali vastus ja näed kohe, kas see oli õige ning miks. Klaviatuuriga: <code>1</code>–<code>4</code> valib, <code>Enter</code> viib edasi.</p>

<div class="bar" id="bar" aria-label="Edenemine"></div>
<div class="stats"><span>Küsimus <b id="pos">1</b> / <b id="tot">0</b></span><span>Õigeid <b id="okc">0</b> · Valesid <b id="badc">0</b></span></div>

<div class="card" id="card" aria-live="polite"></div>

<script>
/* Küsimused: q = küsimus (HTML), o = vastusevariandid, c = õige variandi indeks (0-põhine), e = selgitus */
const KYSIMUSED=[
{"q": "Mis on Windowsi register?", "o": ["Hierarhiline andmebaas, kus Windows ja rakendused hoiavad oma seadistust", "Logifail, kuhu kirjutatakse vead", "Kaust, kus asuvad programmid", "Protsessori sisemine mälu"], "c": 0, "e": "Register koosneb võtmetest ja väärtustest. Kettal asub see failides, mida nimetatakse tarudeks."},
{"q": "Mis vahe on registri võtmel ja väärtusel?", "o": ["Vahet pole", "Väärtus on nagu kaust, võti nagu fail", "Võti on nagu kaust (sisaldab alamvõtmeid ja väärtusi), väärtus on nagu fail (nimi, tüüp, andmed)", "Võti on alati arv, väärtus alati tekst"], "c": 2, "e": "Näiteks võti HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run sisaldab väärtusi, mille andmeteks on käivitatavate programmide teed."},
{"q": "Mis tüüpi väärtus on 32-bitine arv?", "o": ["REG_SZ", "REG_BINARY", "REG_MULTI_SZ", "REG_DWORD"], "c": 3, "e": "REG_DWORD on 32-bitine ja REG_QWORD 64-bitine arv. Sisse-välja lülitid, nagu NoControlPanel = 1, on tavaliselt REG_DWORD."},
{"q": "Milline tüüp sobib väärtusele %SystemRoot%\\System32\\spoolsv.exe?", "o": ["REG_EXPAND_SZ", "REG_SZ", "REG_DWORD", "REG_BINARY"], "c": 0, "e": "REG_EXPAND_SZ sisaldab keskkonnamuutujaid, mis asendatakse lugemisel, näiteks %SystemRoot% → C:\\Windows."},
{"q": "Mida sisaldab REG_MULTI_SZ?", "o": ["Ühte arvu", "Tekstide loendit", "Binaarandmeid", "Viidet teisele võtmele"], "c": 1, "e": "Näiteks teenuse DependOnService väärtus on loend teenustest, millest see sõltub."},
{"q": "Millises juurvõtmes on teenuste seadistus?", "o": ["HKCU", "HKCR", "HKLM", "HKCC"], "c": 2, "e": "Teenused ja draiverid asuvad võtmes HKLM\\SYSTEM\\CurrentControlSet\\Services."},
{"q": "Mida sisaldab HKEY_CURRENT_USER?", "o": ["Kõigi kasutajate seadistust", "Sisseloginud kasutaja seadistust; see on viide HKEY_USERS alamvõtmele", "Riistvaraprofiili", "Failitüüpe"], "c": 1, "e": "HKCU ja HKU\\<kasutaja SID> on sama taru (NTUSER.DAT). HKCU on lihtsalt otsetee."},
{"q": "Mida sisaldab HKEY_CLASSES_ROOT?", "o": ["Failitüüpe ja COM-klasse", "Kasutajakontosid", "Teenuseid", "Võrguseadeid"], "c": 0, "e": "HKCR on liitvaade võtmetest HKLM\\SOFTWARE\\Classes ja HKCU\\Software\\Classes. Näiteks siit leiab Windows, et .txt-faili avab Notepad."},
{"q": "Mis on taru (hive)?", "o": ["Registri juurvõti", "Registriredaktori aken", "Kettal asuv fail, mis sisaldab osa registrist", "Registri varukoopia pilves"], "c": 2, "e": "Näiteks C:\\Windows\\System32\\config\\SYSTEM, SOFTWARE, SAM ja SECURITY ning kasutaja NTUSER.DAT."},
{"q": "Milline fail sisaldab kasutaja registritaru?", "o": ["SAM", "SYSTEM", "pagefile.sys", "NTUSER.DAT"], "c": 3, "e": "NTUSER.DAT asub kasutaja profiilikaustas (nt C:\\Users\\mari) ja laaditakse sisselogimisel HKEY_USERS alla."},
{"q": "Millises tarus on kohalike kasutajakontode parooliräsid?", "o": ["SAM", "SOFTWARE", "NTUSER.DAT", "SYSTEM"], "c": 0, "e": "SAM (Security Account Manager) on ründajatele väärtuslik. Selle sisu näeb vaikimisi ainult SYSTEM-konto."},
{"q": "Kus asuvad taru-failid SYSTEM, SOFTWARE, SAM ja SECURITY?", "o": ["C:\\Windows\\Temp", "C:\\Windows\\System32\\config", "C:\\Program Files", "C:\\Users\\Public"], "c": 1, "e": "Neid faile ei saa töötava Windowsi ajal tavalise kopeerimisega lugeda, sest konfiguratsioonihaldur hoiab neid avatuna."},
{"q": "Mis on konfiguratsioonihalduri (Cm) ülesanded?", "o": ["Ainult registriredaktori kuvamine", "Ainult rühmapoliitika loomine", "Tarude laadimine käivitamisel, registri lugemine ja kirjutamine, õiguste kontroll ja muudatuste turvaline kettale jõudmine", "Programmide paigaldamine"], "c": 2, "e": "Konfiguratsioonihaldur on käivitava süsteemi osa tuumas. Igal registrivõtmel on oma ACL nagu failil."},
{"q": "Miks kasutab konfiguratsioonihaldur logifaile (.LOG1, .LOG2)?", "o": ["Et salvestada kasutaja tegevusi", "Et register ei läheks voolukatkestuse korral katki: muudatus kirjutatakse esmalt logisse ja siis tarusse", "Et register töötaks kiiremini", "Et saata registri muudatused Microsoftile"], "c": 1, "e": "Kui vool kaob pärast logisse kirjutamist, taastatakse taru logi järgi. Kui varem, jääb tarusse vana, kuid terviklik seis."},
{"q": "Vana rakendus üritab tavakasutaja õigustes kirjutada HKLM\\SOFTWARE alla. Mis juhtub?", "o": ["Arvuti taaskäivitub", "Kirjutis õnnestub ja muudab kõigi kasutajate seadistust", "Rakendus saab administraatoriõigused", "Windows suunab kirjutise kasutaja privaatsesse koopiasse (registri virtualiseerimine)"], "c": 3, "e": "Nii töötavad vanad rakendused edasi ega muuda kõigi kasutajate seadistust. Microsoft Store’i (MSIX) rakendused saavad oma isoleeritud registrivaate."},
{"q": "Miks on Run-võtmed turvalisuse seisukohalt olulised?", "o": ["Seal olevad programmid käivituvad automaatselt ja pahavara kasutab neid püsivuse (persistence) saavutamiseks", "Seal hoitakse paroole", "Need kiirendavad arvutit", "Need on ainult administraatorile nähtavad"], "c": 0, "e": "HKLM Run-võtmes olevad programmid käivituvad kõigile kasutajatele ja HKCU Run-võtmes olevad ainult sellele kasutajale. Autoruns näitab need ja palju muid automaatkäivituskohti."},
{"q": "Autorunsis on kirje HKCU\\…\\Run → Updater = C:\\Users\\mari\\AppData\\Roaming\\upd\\svc.exe. Mida see, et kirje on HKCU-s, näitab?", "o": ["Kirje lisas Microsoft", "Ründajal olid kindlasti administraatoriõigused", "Kirje lisati kasutaja õigustega; administraatoriõigusi polnud vaja", "Kirje on ohutu"], "c": 2, "e": "Kasutaja saab oma HKCU-sse alati kirjutada. HKLM Run-võtme muutmiseks on vaja administraatoriõigusi."},
{"q": "Millised tunnused viitavad Autorunsis kõige rohkem pahavarale?", "o": ["Väljaandja Microsoft Corporation ja (Verified)", "Fail kaustas C:\\Program Files", "VirusTotal 0/72", "Allkiri (Not verified), fail Temp- või AppData-kaustas ja mitu VirusTotali tuvastust"], "c": 3, "e": "Pahavara matkib sageli süsteemi nimesid (nt svchost.exe), kuid asub vales kohas ja on allkirjastamata."},
{"q": "Mida tähendab teenuse registrivõtmes väärtus Start = 4?", "o": ["Teenus on keelatud", "Teenus käivitub automaatselt", "Teenus käivitub käsitsi", "Teenus käivitub alglaadimisel"], "c": 0, "e": "0 = alglaadimisel (draiverid), 1 = süsteemi käivitamisel, 2 = automaatne, 3 = käsitsi, 4 = keelatud."},
{"q": "Mis juhtub, kui administraator lülitab GPO-s sisse poliitika „Prohibit access to Control Panel and PC settings“?", "o": ["Juhtpaneel kustutatakse kettalt", "Windows kirjutab HKCU\\…\\Policies\\Explorer alla NoControlPanel = 1 ja Explorer peidab juhtpaneeli", "Kasutaja konto lukustatakse", "Midagi ei muutu enne taaskäivitust"], "c": 1, "e": "Rühmapoliitika on mugav ja auditeeritav viis registri muutmiseks."},
{"q": "Kus asuvad rühmapoliitika seadistused registris?", "o": ["HKCR\\Policies", "HKLM\\SYSTEM\\Services", "HKLM\\SOFTWARE\\Policies ja HKCU\\SOFTWARE\\Policies", "NTUSER.DAT.LOG1"], "c": 2, "e": "Osa vanemaid poliitikaid kirjutatakse ka ...\\CurrentVersion\\Policies alla. Sinna kirjutavad nii GPO kui ka Intune’i CSP-d."},
{"q": "Miks ei muudeta suures keskkonnas registrit käsitsi?", "o": ["Käsitsi muutmine on keelatud seadusega", "Käsitsi muudatus on vigaderohke, raskesti korratav ja auditeeritav; selle asemel kasutatakse GPO-d, Intune’i, DSC-d ja turvabaasjooni", "Registrit ei saa üldse muuta", "regedit töötab ainult serverites"], "c": 1, "e": "Tsentraalne haldus tagab, et kõik arvutid saavad sama seadistuse ja muudatus on dokumenteeritud."},
{"q": "Mis on CSP (Configuration Service Provider)?", "o": ["Liides, mille kaudu Microsoft Intune seadistab Windowsit pilvest", "Registritaru tüüp", "Viirusetõrje", "Kõvaketta kontroller"], "c": 0, "e": "Intune saadab seadmele seadistuse, mille CSP-d kirjutavad registrisse või teistesse süsteemi osadesse."},
{"q": "Milline PowerShelli käsk loob väärtuse Proov (DWORD = 1) võtmesse HKCU:\\Software\\Opetus?", "o": ["Get-ItemProperty -Path HKCU:\\Software\\Opetus", "Remove-Item HKCU:\\Software\\Opetus", "New-ItemProperty -Path HKCU:\\Software\\Opetus -Name Proov -Value 1 -PropertyType DWord", "Set-Location HKCU:\\Software\\Opetus"], "c": 2, "e": "Võtme loob New-Item, väärtuse New-ItemProperty, lugemiseks on Get-ItemProperty ja kustutamiseks Remove-Item või Remove-ItemProperty."},
{"q": "Millise Sysinternalsi tööriistaga näeb, millisesse registrivõtmesse programm parajasti kirjutab?", "o": ["Autoruns", "WinObj", "Process Explorer", "Process Monitor"], "c": 3, "e": "Process Monitoris saab filtreerida Operation is RegSetValue ja näha iga registrikirjutust reaalajas. Autoruns näitab automaatkäivituskohti."}
];

const $=id=>document.getElementById(id);
let order=[],state=[],cur=0,shuffled=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(indexes){
  order=indexes;cur=0;
  state=order.map(()=>({picked:null,ok:null}));
  shuffled=order.map(i=>shuffle(KYSIMUSED[i].o.map((t,k)=>({t,k}))));
  $('tot').textContent=order.length;
  renderBar();render();
}
function renderBar(){
  const bar=$('bar');bar.innerHTML='';
  order.forEach((_,n)=>{const s=document.createElement('button');s.className='seg'+(state[n].ok===true?' ok':state[n].ok===false?' bad':'')+(n===cur?' cur':'');
    s.title='Küsimus '+(n+1);s.setAttribute('aria-label','Küsimus '+(n+1));s.onclick=()=>{cur=n;render();renderBar()};bar.appendChild(s)});
  $('okc').textContent=state.filter(s=>s.ok===true).length;
  $('badc').textContent=state.filter(s=>s.ok===false).length;
}
function render(){
  if(cur>=order.length)return renderEnd();
  $('pos').textContent=cur+1;
  const Q=KYSIMUSED[order[cur]],st=state[cur],opts=shuffled[cur],L='ABCD';
  let h='<p class="qnum">Küsimus '+(cur+1)+'</p><p class="qtext">'+Q.q+'</p>';
  opts.forEach((o,n)=>{
    let cls='opt';
    if(st.picked!==null){if(o.k===Q.c)cls+=' ok';else if(n===st.picked)cls+=' bad';else cls+=' dim'}
    h+='<button class="'+cls+'" data-n="'+n+'"'+(st.picked!==null?' disabled':'')+'><span class="k">'+L[n]+'</span><span>'+o.t+'</span></button>';
  });
  if(st.picked!==null){
    h+='<div class="fb '+(st.ok?'ok':'bad')+'"><strong>'+(st.ok?'Õige!':'Vale. Õige vastus: '+L[opts.findIndex(o=>o.k===Q.c)])+'</strong>'+Q.e+'</div>';
  }
  const answered=state.filter(s=>s.picked!==null).length;
  h+='<div class="actions"><button class="btn" id="prev"'+(cur===0?' disabled':'')+'>← Eelmine</button>';
  h+='<span class="hint">'+(st.picked===null?'Vali üks vastus':'')+'</span>';
  h+='<button class="btn primary" id="next"'+(st.picked===null?' disabled':'')+'>'+(answered===order.length?'Vaata tulemust':'Järgmine →')+'</button></div>';
  $('card').innerHTML=h;
  $('card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  $('prev').onclick=()=>{cur--;render();renderBar()};
  $('next').onclick=next;
}
function pick(n){
  const st=state[cur];if(st.picked!==null)return;
  st.picked=n;st.ok=shuffled[cur][n].k===KYSIMUSED[order[cur]].c;
  render();renderBar();$('next').focus();
}
function next(){
  if(state.every(s=>s.picked!==null)){cur=order.length;renderBar();return render()}
  let n=cur+1;while(n<order.length&&state[n].picked!==null)n++;
  if(n>=order.length)n=state.findIndex(s=>s.picked===null);
  cur=n;render();renderBar();
}
function renderEnd(){
  $('pos').textContent=order.length;
  const ok=state.filter(s=>s.ok).length,tot=order.length,pct=Math.round(ok/tot*100);
  const grade=pct>=90?'Suurepärane! Peatüki põhimõisted on selged.':pct>=70?'Hea tulemus. Vaata valesti vastatud küsimused üle.':pct>=50?'Arvestatav, aga loe vastavad alapeatükid uuesti läbi.':'Loe peatükk uuesti läbi ja proovi siis veel kord.';
  const wrong=order.map((q,n)=>({q,n})).filter(x=>state[x.n].ok===false);
  let h='<p class="qnum">Tulemus</p><p class="big">'+ok+' / '+tot+'</p><p class="grade">'+pct+'% · '+grade+'</p>';
  if(wrong.length){
    h+='<p class="qnum" style="margin-top:1rem">Valesti vastatud</p><ul class="review">';
    wrong.forEach(x=>{const Q=KYSIMUSED[x.q];h+='<li>'+Q.q+'<br><span class="ans">Õige: '+Q.o[Q.c]+'</span></li>'});
    h+='</ul>';
  }
  h+='<div class="actions"><button class="btn" id="again">Alusta uuesti</button>'+(wrong.length?'<button class="btn primary" id="retry">Korda valesid ('+wrong.length+')</button>':'')+'</div>';
  $('card').innerHTML=h;
  $('again').onclick=()=>start(KYSIMUSED.map((_,i)=>i));
  if(wrong.length)$('retry').onclick=()=>start(wrong.map(x=>x.q));
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(cur<order.length&&state[cur].picked===null&&['1','2','3','4'].includes(e.key))pick(+e.key-1);
  else if(e.key==='Enter'&&cur<order.length&&state[cur].picked!==null){e.preventDefault();next()}
});
start(KYSIMUSED.map((_,i)=>i));
</script>
