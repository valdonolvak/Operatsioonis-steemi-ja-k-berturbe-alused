<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peatükk 16 – test: salvestushaldus</title>
<style>
:root{--bg:#fff;--card:#f6f5f1;--text:#1f1f1d;--muted:#6b6a65;--border:#d6d4cc;--accent:#185fa5;--accent-bg:#e6f1fb;
--ok:#3b6d11;--ok-bg:#eaf3de;--ok-line:#639922;--bad:#a32d2d;--bad-bg:#fcebeb;--bad-line:#e24b4a;--todo:#e4e2da;
--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--card:#262624;--text:#ecebe6;--muted:#a3a29c;--border:#44443f;--accent:#85b7eb;--accent-bg:#0c447c;
--ok:#c0dd97;--ok-bg:#27500a;--ok-line:#97c459;--bad:#f7c1c1;--bad-bg:#791f1f;--bad-line:#f09595;--todo:#3a3a37}}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);max-width:760px;margin:2rem auto;padding:0 1rem;line-height:1.6}
h1{font-size:22px;font-weight:500;margin:0 0 .25rem}
.sub{color:var(--muted);font-size:14px;margin:0 0 1.5rem}
nav a{color:var(--accent);font-size:14px}
code{font-family:var(--mono);font-size:.9em;background:var(--card);padding:0 4px;border-radius:4px}
.bar{display:flex;gap:3px;margin:0 0 .5rem}
.seg{flex:1;height:8px;border-radius:2px;background:var(--todo);border:0;padding:0;cursor:pointer}
.seg.ok{background:var(--ok-line)}.seg.bad{background:var(--bad-line)}.seg.cur{outline:2px solid var(--accent);outline-offset:1px}
.stats{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:0 0 1.5rem}
.stats b{color:var(--text);font-weight:500}
.card{background:var(--card);border-radius:12px;padding:1.25rem 1.5rem}
.qnum{font-size:13px;color:var(--muted);margin:0 0 .25rem}
.qtext{font-size:18px;font-weight:500;margin:0 0 1rem;line-height:1.5}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.7rem 1rem;margin:0 0 8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.opt.ok .k,.opt.bad .k{border-color:currentColor;color:inherit}
.opt.dim{opacity:.55}
.fb{margin:1rem 0 0;padding:.75rem 1rem;border-left:3px solid;border-radius:0;background:var(--bg);font-size:15px}
.fb.ok{border-color:var(--ok-line)}.fb.bad{border-color:var(--bad-line)}
.fb strong{display:block;margin-bottom:2px}
.fb.ok strong{color:var(--ok)}.fb.bad strong{color:var(--bad)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:8px;flex-wrap:wrap}
button.btn{font:inherit;font-size:15px;padding:.5rem 1.1rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.btn.primary{color:#042c53}}
button.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.big{font-size:40px;font-weight:500;margin:0}
.grade{font-size:18px;margin:.25rem 0 1rem}
.review{margin:1rem 0 0;padding:0;list-style:none}
.review li{padding:.6rem 0;border-top:1px solid var(--border);font-size:15px}
.review .ans{color:var(--ok);font-size:14px}
</style>
</head>
<body>
<nav><a href="https://github.com/valdonolvak/Operatsioonis-steemi-ja-k-berturbe-alused/blob/main/peatykid/16-salvestushaldus.md">← Peatükk 16</a> · <a href="16-salvestushaldus.html">Interaktiivne õpileht</a></nav>
<h1>Test: salvestushaldus</h1>
<p class="sub">Vali vastus ja näed kohe, kas see oli õige ning miks. Klaviatuuriga: <code>1</code>–<code>4</code> valib, <code>Enter</code> viib edasi.</p>

<div class="bar" id="bar" aria-label="Edenemine"></div>
<div class="stats"><span>Küsimus <b id="pos">1</b> / <b id="tot">0</b></span><span>Õigeid <b id="okc">0</b> · Valesid <b id="badc">0</b></span></div>

<div class="card" id="card" aria-live="polite"></div>

<script>
/* Küsimused: q = küsimus (HTML), o = vastusevariandid, c = õige variandi indeks (0-põhine), e = selgitus */
const KYSIMUSED=[
{"q": "Miks on HDD juhuslikul lugemisel palju aeglasem kui SSD?", "o": ["HDD kasutab aeglasemat kaablit", "HDD peab andmed enne lugemist dekrüpteerima", "Lugemispea peab liikuma õigele rajale ja ootama, kuni õige koht pea alt läbi pöörleb", "HDD-l on vähem mälu"], "c": 2, "e": "Otsinguaeg + pöördeviide on kokku ~12 ms; SSD-l liikuvaid osi pole."},
{"q": "Umbes mitu juhuslikku lugemist sekundis (IOPS) teeb tavaline 7200 p/min HDD?", "o": ["~1", "~100", "~10 000", "~500 000"], "c": 1, "e": "~12 ms lugemise kohta tähendab umbes 80–120 lugemist sekundis. NVMe SSD teeb sadu tuhandeid."},
{"q": "Mis on SSD kulumise ühtlustamine (wear leveling)?", "o": ["Kontroller jaotab kirjutused kõigile mälurakkudele, et ükski ei kuluks enneaegselt", "Ketta defragmentimine", "Andmete krüpteerimine", "Ketta jahutamine"], "c": 0, "e": "Välkmälu rakku saab kirjutada piiratud arv kordi; vastupidavust näidatakse TBW-na."},
{"q": "Mis on MBR-ketta maksimaalne suurus?", "o": ["16 TB", "256 TB", "Piiramatu", "2 TB"], "c": 3, "e": "MBR salvestab suuruse 32-bitise sektorite arvuna: 2^32 × 512 baiti = 2 TB."},
{"q": "Miks on GPT töökindlam kui MBR?", "o": ["GPT kasutab vähem ruumi", "GPT-l pole partitsioone", "GPT-l on päisest koopia ketta lõpus ja kontrollsumma", "GPT on krüpteeritud"], "c": 2, "e": "Kui ketta algus rikneb, saab partitsioonitabeli taastada ketta lõpust."},
{"q": "Milleks on EFI süsteemipartitsioon?", "o": ["Seal on varukoopiad", "Sealt laadib UEFI püsivara Windowsi alglaaduri", "Seal on kasutajate failid", "See on lehefail"], "c": 1, "e": "EFI-partitsioon on FAT32, sest UEFI oskab lugeda seda failisüsteemi. Kui see kustutada, Windows ei käivitu."},
{"q": "Millise käsuga saab MBR-ketta teisendada GPT-ks ilma andmeid kaotamata?", "o": ["mbr2gpt /convert", "format C: /gpt", "chkdsk /gpt", "diskpart clean"], "c": 0, "e": "Pärast teisendamist tuleb püsivaras lülituda UEFI-režiimile."},
{"q": "Milline RAID-tase ei talu ühtegi ketta riket?", "o": ["RAID 1", "RAID 5", "RAID 6", "RAID 0"], "c": 3, "e": "RAID 0 jagab andmed ketaste vahel ilma peegelduse ja paarsuseta – ühe ketta rike hävitab kõik."},
{"q": "Neli 4 TB ketast on RAID 5-s. Kui suur on kasutatav maht?", "o": ["8 TB", "4 TB", "12 TB", "16 TB"], "c": 2, "e": "RAID 5 kasutab ühe ketta jagu ruumi paarsusele: (4 − 1) × 4 TB."},
{"q": "Neli 4 TB ketast on RAID 6-s. Kui suur on kasutatav maht?", "o": ["4 TB", "8 TB", "12 TB", "16 TB"], "c": 1, "e": "RAID 6 kasutab kahe ketta jagu ruumi paarsusele (p ja q) ja talub kahe ketta riket."},
{"q": "Millise tehtega arvutatakse RAID 5 paarsus?", "o": ["XOR", "AND", "Liitmine", "Korrutamine"], "c": 0, "e": "XOR-i omadus: kui teada kõiki osi peale ühe, saab puuduva välja arvutada."},
{"q": "RAID 5-s on A1 = 1100 ja paarsus Ap = 1010. Ketas 2 läks rikki. Mis on A2?", "o": ["1010", "1100", "0000", "0110"], "c": 3, "e": "A2 = A1 XOR Ap = 1100 XOR 1010 = 0110."},
{"q": "Miks soovitatakse suurte ketaste puhul RAID 6 või RAID 10, mitte RAID 5?", "o": ["RAID 5 on aeglasem lugemisel", "RAID 5 vajab rohkem kettaid", "Taastamine kestab tunde või päevi ja selle ajal võib rikki minna teine ketas", "RAID 5 ei toeta suuri kettaid"], "c": 2, "e": "RAID 5 talub ainult ühte riket; taastamise ajal varu pole."},
{"q": "Millal on RAID 10 massiivi andmed kadunud?", "o": ["Mitte kunagi", "Kui ühe peeglipaari mõlemad kettad lähevad rikki", "Kui üks ketas läheb rikki", "Kui kaks ketast eri paarides lähevad rikki"], "c": 1, "e": "Iga paar on peegel; eri paaride rikked on talutavad."},
{"q": "Miks ei ole RAID varukoopia?", "o": ["Kustutamine või lunavara muudab andmeid kohe kõigil ketastel", "RAID on liiga aeglane", "RAID ei salvesta andmeid kettale", "RAID töötab ainult SSD-dega"], "c": 0, "e": "RAID kaitseb riistvara rikke eest, mitte inimese vea ega pahavara eest."},
{"q": "Mis eristab Storage Spaces’it klassikalisest RAID-ist?", "o": ["See töötab ainult Linuxis", "See ei kaitse ühegi rikke eest", "See vajab riistvaralist kontrollerit", "Kogumis võivad olla eri suurusega kettad ja kettaid saab hiljem lisada"], "c": 3, "e": "Lisaks toetab see õhukest eraldust ja SSD/HDD kihte."},
{"q": "Mille eest kaitseb BitLocker?", "o": ["Lunavara eest töötavas arvutis", "Kogemata kustutamise eest", "Varastatud seadme või ketta andmete lugemise eest", "Ketta riistvararikke eest"], "c": 2, "e": "Töötavas, sisselogitud arvutis on andmed avatud ka pahavarale."},
{"q": "Millal küsib BitLocker taastevõtit?", "o": ["Kui ketas saab täis", "Kui käivitusahel on muutunud ja TPM keeldub võtit andmast", "Igal käivitusel", "Kui kasutaja logib välja"], "c": 1, "e": "Näiteks BIOS-i uuendus, emaplaadi vahetus või ketas teises arvutis."},
{"q": "Mida teha enne BIOS-i uuendamist BitLockeriga arvutis?", "o": ["Peatada BitLocker ajutiselt (Suspend-BitLocker)", "Lülitada BitLocker jäädavalt välja ja ketas dekrüpteerida", "Kustutada taastevõti", "Vormindada ketas"], "c": 0, "e": "Pärast taaskäivitust lülitub kaitse automaatselt uuesti sisse."},
{"q": "Miks on BitLockeri taastevõtme salvestamine (Entra ID, AD) kriitiline?", "o": ["Ilma selleta ei saa BitLockerit sisse lülitada", "See kiirendab arvutit", "See asendab parooli", "Ilma selleta võivad andmed riistvara muutuse järel kaduda ka omanikule"], "c": 3, "e": "Taastevõti on ainus viis ketas avada, kui TPM võtit ei anna."},
{"q": "Mis vahe on NAS-il ja SAN-il?", "o": ["SAN töötab ainult traadita võrgus", "Vahet pole", "NAS jagab faile, SAN jagab plokke (arvuti näeb ketast)", "NAS on alati kiirem"], "c": 2, "e": "SAN-i kasutavad virtualiseerimisklastrid ja andmebaasid (iSCSI, Fibre Channel)."},
{"q": "Jagamise õigus on „Täielik juurdepääs“, NTFS-i õigus „Lugemine“. Mida saab kasutaja võrgu kaudu teha?", "o": ["Ainult kustutada", "Ainult lugeda", "Kõike", "Mitte midagi"], "c": 1, "e": "Võrgu kaudu kehtib jagamise ja NTFS-i õigustest rangem."},
{"q": "Mida tähendab 3-2-1-1-0 reeglis teine „1“?", "o": ["Üks koopia on võrguühenduseta või muutumatu", "Üks koopia väljaspool asutust", "Üks täisvarundus päevas", "Üks administraator"], "c": 0, "e": "Lunavara ei pääse ligi lahtiühendatud või muutumatule koopiale."},
{"q": "Milline varundus kopeerib muutused alates viimasest täisvarundusest?", "o": ["Inkrementaalne", "Täisvarundus", "Peegeldus", "Diferentsiaalne"], "c": 3, "e": "Inkrementaalne kopeerib muutused eelmisest varundusest; diferentsiaalne kasvab kuni järgmise täisvarunduseni."},
{"q": "Mida tähendab RPO?", "o": ["Varukoopiate arv", "Ketta kiirus", "Kui palju andmeid võib õnnetuse korral kaduda", "Kui kiiresti peab töö taastuma"], "c": 2, "e": "Kui varundatakse kord ööpäevas, võib kaduda kuni ööpäeva töö. RTO on taastumise aeg."}
];

const $=id=>document.getElementById(id);
let order=[],state=[],cur=0,shuffled=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(indexes){
  order=indexes;cur=0;
  state=order.map(()=>({picked:null,ok:null}));
  shuffled=order.map(i=>shuffle(KYSIMUSED[i].o.map((t,k)=>({t,k}))));
  $('tot').textContent=order.length;
  renderBar();render();
}
function renderBar(){
  const bar=$('bar');bar.innerHTML='';
  order.forEach((_,n)=>{const s=document.createElement('button');s.className='seg'+(state[n].ok===true?' ok':state[n].ok===false?' bad':'')+(n===cur?' cur':'');
    s.title='Küsimus '+(n+1);s.setAttribute('aria-label','Küsimus '+(n+1));s.onclick=()=>{cur=n;render();renderBar()};bar.appendChild(s)});
  $('okc').textContent=state.filter(s=>s.ok===true).length;
  $('badc').textContent=state.filter(s=>s.ok===false).length;
}
function render(){
  if(cur>=order.length)return renderEnd();
  $('pos').textContent=cur+1;
  const Q=KYSIMUSED[order[cur]],st=state[cur],opts=shuffled[cur],L='ABCD';
  let h='<p class="qnum">Küsimus '+(cur+1)+'</p><p class="qtext">'+Q.q+'</p>';
  opts.forEach((o,n)=>{
    let cls='opt';
    if(st.picked!==null){if(o.k===Q.c)cls+=' ok';else if(n===st.picked)cls+=' bad';else cls+=' dim'}
    h+='<button class="'+cls+'" data-n="'+n+'"'+(st.picked!==null?' disabled':'')+'><span class="k">'+L[n]+'</span><span>'+o.t+'</span></button>';
  });
  if(st.picked!==null){
    h+='<div class="fb '+(st.ok?'ok':'bad')+'"><strong>'+(st.ok?'Õige!':'Vale. Õige vastus: '+L[opts.findIndex(o=>o.k===Q.c)])+'</strong>'+Q.e+'</div>';
  }
  const answered=state.filter(s=>s.picked!==null).length;
  h+='<div class="actions"><button class="btn" id="prev"'+(cur===0?' disabled':'')+'>← Eelmine</button>';
  h+='<span class="hint">'+(st.picked===null?'Vali üks vastus':'')+'</span>';
  h+='<button class="btn primary" id="next"'+(st.picked===null?' disabled':'')+'>'+(answered===order.length?'Vaata tulemust':'Järgmine →')+'</button></div>';
  $('card').innerHTML=h;
  $('card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  $('prev').onclick=()=>{cur--;render();renderBar()};
  $('next').onclick=next;
}
function pick(n){
  const st=state[cur];if(st.picked!==null)return;
  st.picked=n;st.ok=shuffled[cur][n].k===KYSIMUSED[order[cur]].c;
  render();renderBar();$('next').focus();
}
function next(){
  if(state.every(s=>s.picked!==null)){cur=order.length;renderBar();return render()}
  let n=cur+1;while(n<order.length&&state[n].picked!==null)n++;
  if(n>=order.length)n=state.findIndex(s=>s.picked===null);
  cur=n;render();renderBar();
}
function renderEnd(){
  $('pos').textContent=order.length;
  const ok=state.filter(s=>s.ok).length,tot=order.length,pct=Math.round(ok/tot*100);
  const grade=pct>=90?'Suurepärane! Peatüki põhimõisted on selged.':pct>=70?'Hea tulemus. Vaata valesti vastatud küsimused üle.':pct>=50?'Arvestatav, aga loe vastavad alapeatükid uuesti läbi.':'Loe peatükk uuesti läbi ja proovi siis veel kord.';
  const wrong=order.map((q,n)=>({q,n})).filter(x=>state[x.n].ok===false);
  let h='<p class="qnum">Tulemus</p><p class="big">'+ok+' / '+tot+'</p><p class="grade">'+pct+'% · '+grade+'</p>';
  if(wrong.length){
    h+='<p class="qnum" style="margin-top:1rem">Valesti vastatud</p><ul class="review">';
    wrong.forEach(x=>{const Q=KYSIMUSED[x.q];h+='<li>'+Q.q+'<br><span class="ans">Õige: '+Q.o[Q.c]+'</span></li>'});
    h+='</ul>';
  }
  h+='<div class="actions"><button class="btn" id="again">Alusta uuesti</button>'+(wrong.length?'<button class="btn primary" id="retry">Korda valesid ('+wrong.length+')</button>':'')+'</div>';
  $('card').innerHTML=h;
  $('again').onclick=()=>start(KYSIMUSED.map((_,i)=>i));
  if(wrong.length)$('retry').onclick=()=>start(wrong.map(x=>x.q));
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(cur<order.length&&state[cur].picked===null&&['1','2','3','4'].includes(e.key))pick(+e.key-1);
  else if(e.key==='Enter'&&cur<order.length&&state[cur].picked!==null){e.preventDefault();next()}
});
start(KYSIMUSED.map((_,i)=>i));
</script>
