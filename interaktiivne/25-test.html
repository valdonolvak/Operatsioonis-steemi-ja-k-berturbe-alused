<script>
/* Küsimused: q = küsimus (HTML), o = vastusevariandid, c = õige variandi indeks (0-põhine), e = selgitus */
const KYSIMUSED=[
{"q": "Mis on krüptograafias võti?", "o": ["Algne loetav sõnum", "Krüpteeritud, ilma võtmeta loetamatu kuju", "Salajane väärtus, mis määrab algoritmi täpse tulemuse", "Šifrite murdmise teadus"], "c": 2, "e": "Algoritm ütleb, kuidas krüpteeritakse, ja võti, milline on täpne tulemus. Ülejäänud variandid on avatekst, šifritekst ja krüptoanalüüs."},

{"q": "Mida väidab Kerckhoffsi printsiip?", "o": ["Algoritm peab olema salajane", "Võti peab olema lühike", "Süsteem peab olema turvaline ka siis, kui kõik peale võtme on avalik", "Šifrit ei tohi kunagi muuta"], "c": 2, "e": "Kerckhoffs sõnastas selle 1883. aastal. Shannon ütles sama lühemalt: „vaenlane tunneb süsteemi“. Saladus on ainult võti."},
{"q": "Miks ei ole salajane, „omatehtud“ algoritm hea turvalahendus?", "o": ["Salajane algoritm on alati aeglasem", "Algoritm lekib varem või hiljem ja seda on analüüsinud vaid autor; võtit on aga lihtne vahetada", "Salajast algoritmi ei saa arvutis käivitada", "Salajane algoritm nõuab pikemat võtit"], "c": 1, "e": "Algoritm on igas seadmes ja tarkvarakoopias. Kui see lekib, tuleb kogu süsteem välja vahetada. MIFARE Classicu Crypto-1, DVD-de CSS ja GSM-i A5/1 murti pärast seda, kui algoritm avalikuks tuli. Avalikku algoritmi on aastaid analüüsinud tuhanded teadlased."},
{"q": "Spartalaste skütale korral jäävad tähed samaks, muutub ainult nende järjekord. Mis tüüpi šiffer see on?", "o": ["Transpositsioon", "Asendusšiffer", "Ühekordne plokk", "Rootorišiffer"], "c": 0, "e": "Transpositsioon muudab tähtede järjekorda, asendus aga tähti endid. Skütale võti oli pulga jämedus: lugeda sai ainult sama jämedusega pulga abil."},
{"q": "Krüpteeri Caesari šifriga (nihe k = 3) sõna KOOL. Mis on šifritekst?", "o": ["NRRO", "LPPM", "HLLI", "NQQO"], "c": 0, "e": "Iga täht nihkub tähestikus kolm kohta edasi: K → N, O → R, O → R, L → O. Valem on C = (P + k) mod 26. LPPM on nihe 1 ja HLLI nihe 3 vastassuunas."},
{"q": "Mitu võimalikku võtit on Caesari šifril 26-tähelises ladina tähestikus?", "o": ["2", "25", "1000", "2¹²⁸"], "c": 1, "e": "Nihkeid on 26, kuid nihe 0 ei muuda midagi, seega jääb 25 võtit. Ründaja proovib need kõik läbi ja näeb kohe, milline tulemus on loetav."},
{"q": "Milline meetod murrab lihtsa asendusšifri?", "o": ["Sagedusanalüüs", "DNS-päring", "Räsimine", "Digiallkiri"], "c": 0, "e": "Sagedusanalüüsi kirjeldas al-Kindi juba 9. sajandil. Kõige sagedasem šifriteksti täht vastab tõenäoliselt keele kõige sagedasemale tähele, eesti keeles a-le või e-le."},
{"q": "Asendusšifril on 26! ≈ 4 × 10²⁶ võimalikku võtit. Miks see sagedusanalüüsi vastu ei aita?", "o": ["Arvutid on liiga kiired", "Asendus muudab tähtede kuju, kuid mitte nende sagedust", "Võtmeid on tegelikult ainult 25", "Sagedusanalüüs proovib kõik võtmed läbi"], "c": 1, "e": "Sagedusanalüüs ei proovi võtmeid, vaid kasutab ära avateksti struktuuri, mis šifritekstis säilib. Õppetund: suur võtmeruum on vajalik, kuid mitte piisav."},
{"q": "Miks ei tööta lihtne sagedusanalüüs Vigenère’i šifri vastu?", "o": ["Vigenère kasutab ainult numbreid", "Sama täht krüpteerub erinevalt sõltuvalt sellest, milline võtmetäht selle all on", "Vigenère’i šifritekst on avatekstist pikem", "Vigenère’il ei ole võtit"], "c": 1, "e": "Sõnas HOMMIKUL muutus üks M X-iks ja teine W-ks. Samas muutusid M ja I mõlemad W-ks. Tähtede sagedused segunevad ja lihtne sagedusanalüüs enam ei tööta."},
{"q": "Kasiski meetodiga leidsid Vigenère’i šifritekstist kordused, mille vahekaugused on 12, 20 ja 32. Mis on tõenäoliselt võtme pikkus?", "o": ["2", "4", "8", "12"], "c": 1, "e": "Korduste vahekaugused on võtme pikkuse kordsed. Arvude 12, 20 ja 32 suurim ühistegur on 4. Seejärel jagatakse šifritekst neljaks osaks (iga neljas täht) ja igaüks murtakse nagu Caesar."},
{"q": "Arvuta 01100001 ⊕ 00001111.", "o": ["01101110", "01100000", "01101111", "10011110"], "c": 0, "e": "XOR annab 1 seal, kus bitid erinevad, ja 0 seal, kus need on samad. Kui teed tulemusega 01101110 sama tehte uuesti, saad tagasi 01100001: (P ⊕ K) ⊕ K = P. Seepärast on krüpteerimine ja dekrüpteerimine sama tehe."},
{"q": "Millal on ühekordne plokk täiuslikult turvaline?", "o": ["Kui võti on vähemalt 128 bitti", "Kui võti on tõeliselt juhuslik, sõnumiga sama pikk ja seda kasutatakse ainult üks kord", "Kui sõnum on lühem kui 100 tähte", "Kui kasutatakse XOR-i asemel liitmist"], "c": 1, "e": "Shannon tõestas 1949. aastal, et siis ei anna šifritekst avateksti kohta mingit infot. Praktikas on ühekordne plokk harv, sest sõnumiga sama pikk võti tuleb saajale turvaliselt toimetada."},
{"q": "Kaks sõnumit on krüpteeritud sama ühekordse ploki võtmega. Mis juhtub, kui ründaja teeb šifritekstidega XOR-i?", "o": ["Ta saab võtme", "Ta saab C₁ ⊕ C₂ = P₁ ⊕ P₂ ehk võti kaob arvutusest", "Ta ei saa midagi teada", "Tulemus on alati nullid"], "c": 1, "e": "Kahe avateksti XOR-ist saab need sageli mõlemad taastada, eriti kui ühe sisu on arvatav. Nii murdis USA projekt Venona osa Nõukogude Liidu sõnumitest, sest võtmelehti oli trükitud mitu korda."},
{"q": "Milline Enigma omadus, mille põhjustas reflektor, oli murdjatele kõige kasulikum?", "o": ["Masinal oli ainult kolm rootorit", "Ükski täht ei krüpteerunud iseendaks", "Pistikupaneel vahetas 10 tähepaari", "Masin töötas elektriga"], "c": 1, "e": "Reflektor tegi masina mugavaks, sest sama seadistus krüpteeris ja dekrüpteeris. Kuna aga ükski täht ei krüpteerunud iseendaks, sai vihjet šifriteksti peal libistades kohe välistada asendid, kus mõni täht oleks iseendaga kohakuti."},
{"q": "Miks krüpteerus Enigmas sama täht iga kord erinevalt?", "o": ["Operaator vahetas iga tähe järel rootorid", "Parem rootor pöördus iga klahvivajutusega ühe sammu ja asendustabel muutus", "Pistikupaneel ühendati iga tähe järel ümber", "Masin valis tähe juhuslikult"], "c": 1, "e": "Rootorid liikusid nagu auto läbisõidumõõdiku numbrid. Tulemus sarnanes väga pika võtmega Vigenère’iga: kui vajutad viis korda A-d, saad viis erinevat tähte."},
{"q": "Mis oli Bletchley Parkis vihje (crib)?", "o": ["Pommi juhtmestiku skeem", "Avateksti osa, mis sõnumis tõenäoliselt esines, nt WETTERVORHERSAGE", "Saksa operaatori parool", "Päevavõtme esimene täht"], "c": 1, "e": "Saksa sõnumites korduti iga päev samu fraase: ilmateade, „erilisi sündmusi pole“, „HEIL HITLER“. Pomm kasutas vihjet, et kontrollida tuhandeid seadistusi tunnis."},
{"q": "Milleks ehitas Tommy Flowers 1944. aastal Colossuse?", "o": ["Enigma sõnumite krüpteerimiseks", "Lorenzi masinaga krüpteeritud sõnumite murdmiseks", "Ilmaennustuste arvutamiseks", "Raadiosignaalide segamiseks"], "c": 1, "e": "Lorenzi masin tegi XOR-i pseudojuhusliku võtmevooga. Colossus oli üks esimesi programmeeritavaid elektroonilisi arvuteid. Arvutiteadus ja krüptoanalüüs on algusest peale koos arenenud."},
{"q": "Mida tähendab Shannoni mõiste hajutus (diffusion)?", "o": ["Võti jagatakse mitme inimese vahel", "Ühe avateksti biti muutmine muudab ligikaudu pooli šifriteksti bitte", "Šifritekst saadetakse mitme kanali kaudu", "Võti on võimalikult lühike"], "c": 1, "e": "Hajutus peidab avateksti mustrid. Segadus (confusion) muudab võtme ja šifriteksti seose keeruliseks. Caesar ei hajuta üldse, sest üks täht mõjutab ainult üht tähte. AES teeb mõlemat mitu ringi järjest."},
{"q": "Millega peaks Pythonis looma parooli või krüptograafilise võtme?", "o": ["Mooduliga random", "Mooduliga secrets", "Kellaajaga time.time()", "Funktsiooniga hash()"], "c": 1, "e": "secrets kasutab krüptograafiliselt turvalist generaatorit (CSPRNG). random on mõeldud simulatsioonideks ja mängudeks: selle sisemise oleku saab väljundi põhjal taastada ja järgmised väärtused ette arvata."},
{"q": "Mis oli Debiani OpenSSL-i vea (2008) tagajärg?", "o": ["RSA-algoritm osutus murtavaks", "Võtmed sõltusid peaaegu ainult protsessi numbrist, seega oli igat tüüpi võtmeid vaid kuni 32 768", "Kõik võtmed muutusid 56-bitiseks", "Serverid ei saanud enam käivituda"], "c": 1, "e": "Arendaja eemaldas kaks rida, mis lisasid entroopiat. Algoritm ja võtme pikkus olid korras, aga juhuslikkus puudus. Ründaja genereeris kõik võimalikud võtmed läbi ja leidis õige minutitega."},
{"q": "Mis on Base64?", "o": ["Sümmeetriline šiffer", "Räsifunktsioon", "Asümmeetriline šiffer", "Kodeering, mitte krüpteerimine"], "c": 3, "e": "Base64-l puudub võti: igaüks saab selle tagasi muuta, nt echo 'a2Fzc2kxMjM=' | base64 -d annab kassi123. Parool kuulub saladuste hoidlasse, mitte seadistusfaili."},
{"q": "Mille poolest erineb steganograafia krüptograafiast?", "o": ["Steganograafia peidab sõnumi olemasolu, krüptograafia sõnumi sisu", "Steganograafia on krüptograafia vanem nimi", "Steganograafia kasutab alati XOR-i", "Steganograafia ei vaja kandjat"], "c": 0, "e": "Steganograafia peidab sõnumi näiteks tõmmisfaili pikslitesse. Neid võib kombineerida: krüpteeritud sõnum peidetakse tõmmisesse. Kodeerimine (Base64) ei peida kumbagi."},
{"q": "Mida tähendab lukk brauseri aadressiribal?", "o": ["Sait on aus ja kontrollitud", "Ühendus serveriga on krüpteeritud", "Sait ei sisalda pahavara", "Sinu parool on turvaliselt salvestatud"], "c": 1, "e": "Õngitsusleht saab TLS-sertifikaadi samamoodi nagu päris pank. Krüptograafia kaitseb ühendust, kuid ei kaitse inimese petmise, nakatunud seadme ega halva võtmehalduse eest."},
{"q": "Milline krüptograafia ehitusplokk sobib suurte andmemahtude kiireks krüpteerimiseks?", "o": ["Sümmeetriline krüpteerimine (AES, ChaCha20)", "Räsifunktsioon (SHA-256)", "Asümmeetriline krüptograafia (RSA)", "Base64"], "c": 0, "e": "Sümmeetriline krüpteerimine on kiire, aga mõlemal poolel peab olema sama võti. HTTPS-is lepitakse asümmeetrilise krüptograafiaga kokku ühises võtmes ja andmed liiguvad AES-i või ChaCha20-ga."}
];

const $=id=>document.getElementById(id);
let order=[],state=[],cur=0,shuffled=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(indexes){
  order=indexes;cur=0;
  state=order.map(()=>({picked:null,ok:null}));
  shuffled=order.map(i=>shuffle(KYSIMUSED[i].o.map((t,k)=>({t,k}))));
  $('tot').textContent=order.length;
  renderBar();render();
}
function renderBar(){
  const bar=$('bar');bar.innerHTML='';
  order.forEach((_,n)=>{const s=document.createElement('button');s.className='seg'+(state[n].ok===true?' ok':state[n].ok===false?' bad':'')+(n===cur?' cur':'');
    s.title='Küsimus '+(n+1);s.setAttribute('aria-label','Küsimus '+(n+1));s.onclick=()=>{cur=n;render();renderBar()};bar.appendChild(s)});
  $('okc').textContent=state.filter(s=>s.ok===true).length;
  $('badc').textContent=state.filter(s=>s.ok===false).length;
}
function render(){
  if(cur>=order.length)return renderEnd();
  $('pos').textContent=cur+1;
  const Q=KYSIMUSED[order[cur]],st=state[cur],opts=shuffled[cur],L='ABCD';
  let h='<p class="qnum">Küsimus '+(cur+1)+'</p><p class="qtext">'+Q.q+'</p>';
  opts.forEach((o,n)=>{
    let cls='opt';
    if(st.picked!==null){if(o.k===Q.c)cls+=' ok';else if(n===st.picked)cls+=' bad';else cls+=' dim'}
    h+='<button class="'+cls+'" data-n="'+n+'"'+(st.picked!==null?' disabled':'')+'><span class="k">'+L[n]+'</span><span>'+o.t+'</span></button>';
  });
  if(st.picked!==null){
    h+='<div class="fb '+(st.ok?'ok':'bad')+'"><strong>'+(st.ok?'Õige!':'Vale. Õige vastus: '+L[opts.findIndex(o=>o.k===Q.c)])+'</strong>'+Q.e+'</div>';
  }
  const answered=state.filter(s=>s.picked!==null).length;
  h+='<div class="actions"><button class="btn" id="prev"'+(cur===0?' disabled':'')+'>← Eelmine</button>';
  h+='<span class="hint">'+(st.picked===null?'Vali üks vastus':'')+'</span>';
  h+='<button class="btn primary" id="next"'+(st.picked===null?' disabled':'')+'>'+(answered===order.length?'Vaata tulemust':'Järgmine →')+'</button></div>';
  $('card').innerHTML=h;
  $('card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  $('prev').onclick=()=>{cur--;render();renderBar()};
  $('next').onclick=next;
}
function pick(n){
  const st=state[cur];if(st.picked!==null)return;
  st.picked=n;st.ok=shuffled[cur][n].k===KYSIMUSED[order[cur]].c;
  render();renderBar();$('next').focus();
}
function next(){
  if(state.every(s=>s.picked!==null)){cur=order.length;renderBar();return render()}
  let n=cur+1;while(n<order.length&&state[n].picked!==null)n++;
  if(n>=order.length)n=state.findIndex(s=>s.picked===null);
  cur=n;render();renderBar();
}
function renderEnd(){
  $('pos').textContent=order.length;
  const ok=state.filter(s=>s.ok).length,tot=order.length,pct=Math.round(ok/tot*100);
  const grade=pct>=90?'Suurepärane! Peatüki põhimõisted on selged.':pct>=70?'Hea tulemus. Vaata valesti vastatud küsimused üle.':pct>=50?'Arvestatav, aga loe vastavad alapeatükid uuesti läbi.':'Loe peatükk uuesti läbi ja proovi siis veel kord.';
  const wrong=order.map((q,n)=>({q,n})).filter(x=>state[x.n].ok===false);
  let h='<p class="qnum">Tulemus</p><p class="big">'+ok+' / '+tot+'</p><p class="grade">'+pct+'% · '+grade+'</p>';
  if(wrong.length){
    h+='<p class="qnum" style="margin-top:1rem">Valesti vastatud</p><ul class="review">';
    wrong.forEach(x=>{const Q=KYSIMUSED[x.q];h+='<li>'+Q.q+'<br><span class="ans">Õige: '+Q.o[Q.c]+'</span></li>'});
    h+='</ul>';
  }
  h+='<div class="actions"><button class="btn" id="again">Alusta uuesti</button>'+(wrong.length?'<button class="btn primary" id="retry">Korda valesid ('+wrong.length+')</button>':'')+'</div>';
  $('card').innerHTML=h;
  $('again').onclick=()=>start(KYSIMUSED.map((_,i)=>i));
  if(wrong.length)$('retry').onclick=()=>start(wrong.map(x=>x.q));
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(cur<order.length&&state[cur].picked===null&&['1','2','3','4'].includes(e.key))pick(+e.key-1);
  else if(e.key==='Enter'&&cur<order.length&&state[cur].picked!==null){e.preventDefault();next()}
});
start(KYSIMUSED.map((_,i)=>i));
</script>
