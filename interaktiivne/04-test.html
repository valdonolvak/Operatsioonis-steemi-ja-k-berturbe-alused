<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peatükk 4 – test: Windowsi arhitektuur</title>
<style>
:root{--bg:#fff;--card:#f6f5f1;--text:#1f1f1d;--muted:#6b6a65;--border:#d6d4cc;--accent:#185fa5;--accent-bg:#e6f1fb;
--ok:#3b6d11;--ok-bg:#eaf3de;--ok-line:#639922;--bad:#a32d2d;--bad-bg:#fcebeb;--bad-line:#e24b4a;--todo:#e4e2da;
--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--card:#262624;--text:#ecebe6;--muted:#a3a29c;--border:#44443f;--accent:#85b7eb;--accent-bg:#0c447c;
--ok:#c0dd97;--ok-bg:#27500a;--ok-line:#97c459;--bad:#f7c1c1;--bad-bg:#791f1f;--bad-line:#f09595;--todo:#3a3a37}}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);max-width:760px;margin:2rem auto;padding:0 1rem;line-height:1.6}
h1{font-size:22px;font-weight:500;margin:0 0 .25rem}
.sub{color:var(--muted);font-size:14px;margin:0 0 1.5rem}
nav a{color:var(--accent);font-size:14px}
code{font-family:var(--mono);font-size:.9em;background:var(--card);padding:0 4px;border-radius:4px}
.bar{display:flex;gap:3px;margin:0 0 .5rem}
.seg{flex:1;height:8px;border-radius:2px;background:var(--todo);border:0;padding:0;cursor:pointer}
.seg.ok{background:var(--ok-line)}.seg.bad{background:var(--bad-line)}.seg.cur{outline:2px solid var(--accent);outline-offset:1px}
.stats{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:0 0 1.5rem}
.stats b{color:var(--text);font-weight:500}
.card{background:var(--card);border-radius:12px;padding:1.25rem 1.5rem}
.qnum{font-size:13px;color:var(--muted);margin:0 0 .25rem}
.qtext{font-size:18px;font-weight:500;margin:0 0 1rem;line-height:1.5}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.7rem 1rem;margin:0 0 8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.opt.ok .k,.opt.bad .k{border-color:currentColor;color:inherit}
.opt.dim{opacity:.55}
.fb{margin:1rem 0 0;padding:.75rem 1rem;border-left:3px solid;border-radius:0;background:var(--bg);font-size:15px}
.fb.ok{border-color:var(--ok-line)}.fb.bad{border-color:var(--bad-line)}
.fb strong{display:block;margin-bottom:2px}
.fb.ok strong{color:var(--ok)}.fb.bad strong{color:var(--bad)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:8px;flex-wrap:wrap}
button.btn{font:inherit;font-size:15px;padding:.5rem 1.1rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.btn.primary{color:#042c53}}
button.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.big{font-size:40px;font-weight:500;margin:0}
.grade{font-size:18px;margin:.25rem 0 1rem}
.review{margin:1rem 0 0;padding:0;list-style:none}
.review li{padding:.6rem 0;border-top:1px solid var(--border);font-size:15px}
.review .ans{color:var(--ok);font-size:14px}
</style>

<body>
<nav><a href="https://github.com/valdonolvak/Operatsioonis-steemi-ja-k-berturbe-alused/blob/main/peatykid/04-arhitektuur.md">← Peatükk 4</a> · <a href="04-arhitektuur.html">Interaktiivne leht</a></nav>
<h1>Test: Windowsi arhitektuur</h1>
<p class="sub">Vali vastus ja näed kohe, kas see oli õige ning miks. Klaviatuuriga: <code>1</code>–<code>4</code> valib, <code>Enter</code> viib edasi.</p>

<div class="bar" id="bar" aria-label="Edenemine"></div>
<div class="stats"><span>Küsimus <b id="pos">1</b> / <b id="tot">0</b></span><span>Õigeid <b id="okc">0</b> · Valesid <b id="badc">0</b></span></div>

<div class="card" id="card" aria-live="polite"></div>

<script>
/* Küsimused: q = küsimus (HTML), o = vastusevariandid, c = õige variandi indeks (0-põhine), e = selgitus */
const KYSIMUSED=[
{"q": "Milline neist EI olnud Windows NT disainieesmärk?", "o": ["Laiendatavus", "Kaasaskantavus", "Töökindlus ja robustsus", "Täielik ühilduvus DOS-i reaalrežiimi draiveritega"], "c": 3, "e": "NT eesmärgid olid laiendatavus, kaasaskantavus, töökindlus, ühilduvus (Windowsi rakendustega), jõudlus ja turvalisus. DOS-i reaalrežiimi draiverid NT-s ei töötanud."},
{"q": "Mida tähendab NT disainieesmärk „kaasaskantavus“?", "o": ["Windows töötab ainult sülearvutites", "Suurem osa koodist on C-s ja riistvarast sõltuv osa on eraldatud, nii et Windows töötab eri protsessoriarhitektuuridel (täna x64 ja ARM64)", "Windowsi saab kopeerida USB-pulgale", "Rakendused töötavad nii Windowsis kui ka Linuxis"], "c": 1, "e": "Riistvarast sõltuv kood on eraldatud HAL-i ja arhitektuuripõhistesse osadesse."},
{"q": "Millise turvataseme nõuete järgi Windows NT algselt kavandati?", "o": ["USA kaitseministeeriumi C2-tase", "ISO 27001", "E-ITS", "PCI DSS"], "c": 0, "e": "C2 nõudis näiteks kohustuslikku sisselogimist, pääsuloenditega õigusi ja turvalogi."},
{"q": "Millises failis asuvad Windowsi tuum ja käivitav süsteem?", "o": ["hal.dll", "win32k.sys", "ntoskrnl.exe", "csrss.exe"], "c": 2, "e": "ntoskrnl.exe sisaldab nii käivitavat süsteemi (executive) kui ka tuuma. hal.dll on HAL ja win32k.sys graafiline alamsüsteem."},
{"q": "Millises režiimis töötavad alamsüsteemi DLL-id (kernel32.dll, ntdll.dll)?", "o": ["Kasutajarežiimis", "Tuumarežiimis", "VTL 1-s", "Hüperviisoris"], "c": 0, "e": "DLL-id laaditakse rakenduse protsessi. ntdll.dll on viimane kasutajarežiimi kiht enne süsteemikutset."},
{"q": "Mis on käivitava süsteemi (executive) ja tuuma peamine erinevus?", "o": ["Executive töötab kasutajarežiimis, tuum tuumarežiimis", "Vahet pole", "Tuum otsustab, kellel on õigus faili avada", "Executive otsustab poliitika (nt õigused) ja haldab ressursse, tuum teeb madala taseme tööd: planeerimine, katkestused, sünkroniseerimine"], "c": 3, "e": "Mõlemad töötavad tuumarežiimis ja asuvad ntoskrnl.exe-s. Rusikareegel: poliitika on executive’i, mehhanism tuuma töö."},
{"q": "Milline neist ei kuulu käivitava süsteemi halduritest?", "o": ["Mäluhaldur", "Objektihaldur", "Desktop Window Manager (dwm.exe)", "Konfiguratsioonihaldur"], "c": 2, "e": "dwm.exe on kasutajarežiimi protsess, mis koostab ekraanipildi. Executive’i kuuluvad protsessi-, mälu-, S/V-, PnP-, toite-, vahemälu-, objekti- ja konfiguratsioonihaldur, SRM ning ALPC."},
{"q": "Mis on ALPC?", "o": ["Kiire protsessidevaheline sõnumivahetus", "Graafikadraiver", "Failisüsteem", "Viirusetõrje"], "c": 0, "e": "ALPC (Advanced Local Procedure Call) on käivitava süsteemi teenus, mida kasutavad näiteks teenused ja lsass.exe."},
{"q": "Milleks on HAL?", "o": ["Kasutajate autentimiseks", "Emaplaadi erinevuste peitmiseks: katkestuskontrollerid, taimerid, protsessoritevahelised katkestused", "Failide krüpteerimiseks", "Akende joonistamiseks"], "c": 1, "e": "Tänu HAL-ile ei pea tuum teadma iga kiibistiku eripära. ACPI ja UEFI standardite tõttu on HAL täna väiksem kui 1990. aastatel."},
{"q": "Mis on tuumarežiimi ühise aadressiruumi eelis ja puudus?", "o": ["Eelis on turvalisus, puudus aeglus", "Eeliseid pole", "Eelis on kiirus (pole režiimivahetust komponentide vahel), puudus on see, et vigane draiver pääseb ligi kogu tuumamälule", "Puudus on see, et draiverid ei saa omavahel suhelda"], "c": 2, "e": "Seetõttu on draiverite kvaliteet kriitiline. 64-bitine Windows nõuab draiveritelt Microsofti allkirja."},
{"q": "Miks nõuab 64-bitine Windows tuumadraiveritelt Microsofti allkirja?", "o": ["Et takistada pahatahtlikku või kontrollimata koodi tuumarežiimi laadimist", "Et draiverid töötaksid kiiremini", "Et vähendada draiveri faili suurust", "Allkirja ei nõuta"], "c": 0, "e": "Tuumarežiimi kood näeb kogu süsteemi. Allkiri näitab, kust draiver pärineb, ja aitab vältida pahavara peitmist draiveri kujul."},
{"q": "Mis kaitseb tuuma jooksva muutmise eest?", "o": ["UAC", "SmartScreen", "BitLocker", "PatchGuard (kernel patch protection)"], "c": 3, "e": "PatchGuard jälgib tuuma olulisi struktuure ja peatab süsteemi, kui neid lubamatult muudetakse."},
{"q": "Mis eelis on UMDF-draiveril KMDF-draiveri ees?", "o": ["UMDF-draiver on alati kiirem", "UMDF-draiver töötab kasutajarežiimis, nii et selle viga ei jooksuta kogu süsteemi kokku", "UMDF-draiver ei vaja allkirja", "UMDF-draiver töötab ainult Linuxis"], "c": 1, "e": "KMDF on tuumarežiimi raamistik. UMDF on turvalisem, kuid kõik seadmed ei saa kasutajarežiimis töötada."},
{"q": "Milline draiverite liik on viirusetõrje, mis kontrollib faile enne nende avamist?", "o": ["Seadmedraiver", "Võrgudraiver", "Filtridraiver", "Graafikadraiver"], "c": 2, "e": "Filtridraiver istub näiteks failisüsteemi draiveri peal ja näeb kõiki failioperatsioone."},
{"q": "Mis on win32k.sys?", "o": ["Graafilise alamsüsteemi tuumarežiimi osa", "Viirusetõrje", "Kasutajarežiimi teek", "Hüperviisor"], "c": 0, "e": "win32k.sys on olnud sage turvaauk. Selle osi on Rustis ümber kirjutatud (win32kbase_rs.sys)."},
{"q": "Mis teeb Desktop Window Manager (dwm.exe)?", "o": ["Haldab teenuseid", "Koostab DirectX-i abil kõigi akende pildi üheks ekraanipildiks", "Kontrollib paroole", "Käivitab seansse"], "c": 1, "e": "dwm.exe töötab kasutajarežiimis. Kaasaegsed rakendused joonistavad DirectX-i kaudu."},
{"q": "Milline protsess vastutab autentimise ja turvapoliitika eest?", "o": ["smss.exe", "dwm.exe", "explorer.exe", "lsass.exe"], "c": 3, "e": "lsass.exe on kohalik turva-autoriteet. Kuna selle mälus võivad olla parooliräsid, ründavad pahalased seda sageli."},
{"q": "Mis on services.exe ülesanne?", "o": ["Teenusehaldur (SCM): käivitab ja peatab Windowsi teenuseid", "Seansihaldur", "Graafiline kest", "Registri andmete hoidmine"], "c": 0, "e": "services.exe käivitab teenused, mis töötavad enamasti svchost.exe protsessides."},
{"q": "Mis on protsess System (PID 4)?", "o": ["Kasutaja graafiline kest", "Viirusetõrje", "Tuumalõimede konteiner", "Teenusehaldur"], "c": 2, "e": "Selles töötavad tuuma ja draiverite enda lõimed. See ei ole tavaline programm kettal."},
{"q": "Milline protsess käivitab services.exe ja lsass.exe?", "o": ["explorer.exe", "wininit.exe", "winlogon.exe", "dwm.exe"], "c": 1, "e": "smss.exe käivitab seansis 0 wininit.exe, mis käivitab omakorda teenusehalduri ja turva-autoriteedi."},
{"q": "Mis töötab VTL 1-s?", "o": ["Turvatuum (securekernel.exe) ja isoleeritud kasutajarežiimi protsessid, nt LsaIso.exe", "Kõik kasutajarakendused", "Kõik draiverid", "explorer.exe"], "c": 0, "e": "VTL 1 mälu ei näe ka tavaline tuum. Seda eraldust tagab hüperviisor."},
{"q": "Mida teeb mälu terviklikkus (HVCI)?", "o": ["Krüpteerib kõvaketta", "Suurendab RAM-i mahtu", "Kontrollib paroolide tugevust", "Kontrollib VTL 1-st, et tuumas käivitatakse ainult allkirjastatud ja kontrollitud koodi"], "c": 3, "e": "HVCI (hypervisor-protected code integrity) muudab draiveripõhised rünnakud palju raskemaks."},
{"q": "Ründajal on tööjaamas administraatoriõigused ja Credential Guard on sees. Miks ei saa ta lsass.exe mälust domeenikasutaja räsi kätte?", "o": ["Räsid kustutatakse kohe pärast sisselogimist", "Saladused on LsaIso.exe-s VTL 1-s ja hüperviisor ei lase VTL 0 koodil, ka administraatoril ja tuumal, seda mälu lugeda", "Administraatoril pole kunagi õigust lsass.exe mälu lugeda", "Räsid on krüpteeritud kasutaja parooliga"], "c": 1, "e": "lsass.exe küsib LsaIso.exe-lt ainult tulemust (nt Kerberose vastust), mitte räsi ennast. Ilma Credential Guardita saaks administraator räsi kätte ja kasutada seda pass-the-hash rünnakus."},
{"q": "Milline tuuma tüüp on Linuxil?", "o": ["Mikrotuum", "Hübriid", "Monoliitne tuum laaditavate moodulitega", "Eksotuum"], "c": 2, "e": "Windows NT ja macOS-i XNU on hübriidtuumad. Monoliitse tuuma puhul võib vigane moodul jooksutada kokku kogu süsteemi (kernel panic)."},
{"q": "Millises suunas on macOS ja Windows viimastel aastatel draiveritega liikunud?", "o": ["Draiverid viiakse rohkem kasutajaruumi (macOS DriverKit, Windows UMDF), et nende vead ei jooksutaks süsteemi kokku", "Kõik draiverid viiakse tuuma sisse", "Draiverid kaotatakse täielikult", "Draiverid kirjutatakse ainult assembleris"], "c": 0, "e": "macOS-i tuumalaiendused (kext) on aegunud. Windowsis kasutatakse UMDF-i ja viirusetõrjet viiakse tuumast välja (ptk 19.3)."}
];

const $=id=>document.getElementById(id);
let order=[],state=[],cur=0,shuffled=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(indexes){
  order=indexes;cur=0;
  state=order.map(()=>({picked:null,ok:null}));
  shuffled=order.map(i=>shuffle(KYSIMUSED[i].o.map((t,k)=>({t,k}))));
  $('tot').textContent=order.length;
  renderBar();render();
}
function renderBar(){
  const bar=$('bar');bar.innerHTML='';
  order.forEach((_,n)=>{const s=document.createElement('button');s.className='seg'+(state[n].ok===true?' ok':state[n].ok===false?' bad':'')+(n===cur?' cur':'');
    s.title='Küsimus '+(n+1);s.setAttribute('aria-label','Küsimus '+(n+1));s.onclick=()=>{cur=n;render();renderBar()};bar.appendChild(s)});
  $('okc').textContent=state.filter(s=>s.ok===true).length;
  $('badc').textContent=state.filter(s=>s.ok===false).length;
}
function render(){
  if(cur>=order.length)return renderEnd();
  $('pos').textContent=cur+1;
  const Q=KYSIMUSED[order[cur]],st=state[cur],opts=shuffled[cur],L='ABCD';
  let h='<p class="qnum">Küsimus '+(cur+1)+'</p><p class="qtext">'+Q.q+'</p>';
  opts.forEach((o,n)=>{
    let cls='opt';
    if(st.picked!==null){if(o.k===Q.c)cls+=' ok';else if(n===st.picked)cls+=' bad';else cls+=' dim'}
    h+='<button class="'+cls+'" data-n="'+n+'"'+(st.picked!==null?' disabled':'')+'><span class="k">'+L[n]+'</span><span>'+o.t+'</span></button>';
  });
  if(st.picked!==null){
    h+='<div class="fb '+(st.ok?'ok':'bad')+'"><strong>'+(st.ok?'Õige!':'Vale. Õige vastus: '+L[opts.findIndex(o=>o.k===Q.c)])+'</strong>'+Q.e+'</div>';
  }
  const answered=state.filter(s=>s.picked!==null).length;
  h+='<div class="actions"><button class="btn" id="prev"'+(cur===0?' disabled':'')+'>← Eelmine</button>';
  h+='<span class="hint">'+(st.picked===null?'Vali üks vastus':'')+'</span>';
  h+='<button class="btn primary" id="next"'+(st.picked===null?' disabled':'')+'>'+(answered===order.length?'Vaata tulemust':'Järgmine →')+'</button></div>';
  $('card').innerHTML=h;
  $('card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  $('prev').onclick=()=>{cur--;render();renderBar()};
  $('next').onclick=next;
}
function pick(n){
  const st=state[cur];if(st.picked!==null)return;
  st.picked=n;st.ok=shuffled[cur][n].k===KYSIMUSED[order[cur]].c;
  render();renderBar();$('next').focus();
}
function next(){
  if(state.every(s=>s.picked!==null)){cur=order.length;renderBar();return render()}
  let n=cur+1;while(n<order.length&&state[n].picked!==null)n++;
  if(n>=order.length)n=state.findIndex(s=>s.picked===null);
  cur=n;render();renderBar();
}
function renderEnd(){
  $('pos').textContent=order.length;
  const ok=state.filter(s=>s.ok).length,tot=order.length,pct=Math.round(ok/tot*100);
  const grade=pct>=90?'Suurepärane! Peatüki põhimõisted on selged.':pct>=70?'Hea tulemus. Vaata valesti vastatud küsimused üle.':pct>=50?'Arvestatav, aga loe vastavad alapeatükid uuesti läbi.':'Loe peatükk uuesti läbi ja proovi siis veel kord.';
  const wrong=order.map((q,n)=>({q,n})).filter(x=>state[x.n].ok===false);
  let h='<p class="qnum">Tulemus</p><p class="big">'+ok+' / '+tot+'</p><p class="grade">'+pct+'% · '+grade+'</p>';
  if(wrong.length){
    h+='<p class="qnum" style="margin-top:1rem">Valesti vastatud</p><ul class="review">';
    wrong.forEach(x=>{const Q=KYSIMUSED[x.q];h+='<li>'+Q.q+'<br><span class="ans">Õige: '+Q.o[Q.c]+'</span></li>'});
    h+='</ul>';
  }
  h+='<div class="actions"><button class="btn" id="again">Alusta uuesti</button>'+(wrong.length?'<button class="btn primary" id="retry">Korda valesid ('+wrong.length+')</button>':'')+'</div>';
  $('card').innerHTML=h;
  $('again').onclick=()=>start(KYSIMUSED.map((_,i)=>i));
  if(wrong.length)$('retry').onclick=()=>start(wrong.map(x=>x.q));
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(cur<order.length&&state[cur].picked===null&&['1','2','3','4'].includes(e.key))pick(+e.key-1);
  else if(e.key==='Enter'&&cur<order.length&&state[cur].picked!==null){e.preventDefault();next()}
});
start(KYSIMUSED.map((_,i)=>i));
</script>
