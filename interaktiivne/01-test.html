<h1>Test: Windowsi ajalugu</h1>
<p class="sub">Vali vastus ja näed kohe, kas see oli õige ning miks. Klaviatuuriga: <code>1</code>–<code>4</code> valib, <code>Enter</code> viib edasi.</p>

<script>

{"q": "Milline Windows 2000 uuendus on tänini enamiku organisatsioonide identiteedihalduse alus?", "o": ["Windows Installer", "Active Directory", "Task Manager", "Luna kasutajaliides"], "c": 1, "e": "Active Directory hoiab kasutajaid, arvuteid, gruppe ja printereid hierarhilises andmebaasis. Koos sellega tulid grupipoliitika ja Kerberos autentimine."},

{"q": "Mis tõi Windows XP SP2 (2004) turvalisuses kaasa?", "o": ["BitLockeri", "UAC", "Windows Firewall lülitati vaikimisi sisse ja tuli Security Center", "TPM 2.0 nõude"], "c": 2, "e": "Pärast Blasteri ja Sasseri ussirünnakuid muudeti tulemüür vaikimisi sisselülitatuks. Sellest algas Microsofti „vaikimisi turvaline“ mõtteviis."},
{"q": "Millist turvapõhimõtet rakendab Vistas tulnud UAC?", "o": ["Kaitset sügavuti (defense in depth) krüpteerimise abil", "Vähima õiguse põhimõtet: ka administraator töötab vaikimisi tavaõigustega", "Kahefaktorilist autentimist", "Andmete varundamist"], "c": 1, "e": "XP-s töötas enamik kasutajaid administraatoriõigustega, nii et ka pahavara sai kõik õigused. UAC nõuab süsteemi muutmiseks eraldi kinnitust."},
{"q": "Miks muudeti Windows 7-s UAC seadistatavaks ja vähem pealetükkivaks?", "o": ["Microsoft loobus UAC-st", "UAC oli liiga aeglane", "UAC ei töötanud 64-bitises Windowsis", "Kasutajad hakkasid sagedasi kinnituskaste pimesi kinnitama või lülitasid UAC välja"], "c": 3, "e": "Turvameede, mis segab liiga palju, jääb kasutamata. Hea turve peab olema ka kasutatav."},
{"q": "Mille eest kaitseb UEFI Secure Boot (Windows 8)?", "o": ["Pahavara eest, mis üritab käivituda enne operatsioonisüsteemi (bootkit)", "Andmepüügi e-kirjade eest", "Paroolide äraarvamise eest", "Võrguühenduse pealtkuulamise eest"], "c": 0, "e": "Secure Boot kontrollib, et alglaadur ja tuum oleksid digitaalselt allkirjastatud. Muudetud või võõrast alglaadurit ei käivitata. Windows 11 nõuab Secure Booti kohustuslikult."},
{"q": "Mida tähendab „Windows as a Service“ (Windows 10)?", "o": ["Windowsi saab kasutada ainult pilves", "Windowsi eest tuleb maksta kuutasu", "Uut Windowsi ei tule iga paari aasta tagant, vaid süsteem uueneb pidevalt igakuiste ja regulaarsete funktsiooniuuendustega", "Windows töötab ainult serveris"], "c": 2, "e": "IT-haldurile tähendab see pidevat uuenduste testimist ja juhtimist, näiteks Windows Update for Businessi või Intune’i abil."},
{"q": "Kuidas kaitseb Credential Guard paroolide räsisid ja Kerberose pileteid?", "o": ["Kustutab need pärast sisselogimist", "Hoiab neid virtualiseerimispõhise turbe (VBS) abil mälualas, mida isegi OS-i tuum ei näe", "Saadab need pilve", "Krüpteerib need kasutaja parooliga"], "c": 1, "e": "Hüperviisor eraldab osa mälust. Isegi administraatoriõigustega pahavara ei saa sealt räsisid varastada, mistõttu pass-the-hash rünnak on raskem."},
{"q": "Miks nõuab Windows 11 TPM 2.0-d ja Secure Booti?", "o": ["Et arvuti töötaks kiiremini", "Et toetada vanu mänge", "Et vähendada voolutarbimist", "Riistvaraline turve on baasnõue: TPM hoiab võtmeid (BitLocker, Windows Hello) ja Secure Boot kaitseb käivitust"], "c": 3, "e": "Windows 10-s olid need valikulised. Seetõttu ei saa paljudele vanematele arvutitele Windows 11 ametlikult paigaldada."},
{"q": "Mitu funktsiooniuuendust aastas saab Windows 11 ja kui kaua toetatakse Home/Pro versiooni?", "o": ["Kaks korda aastas, 18 kuud", "Üks kord aastas, 24 kuud", "Üks kord kahe aasta tagant, 10 aastat", "Igal kuul, 6 kuud"], "c": 1, "e": "Home ja Pro saavad igale versioonile 24 kuud tuge, Enterprise ja Education 36 kuud. Seetõttu tuleb versiooni uuendada ka siis, kui uusi funktsioone pole vaja."},
{"q": "Mida tähendab Windows 11 25H2 ja 26H2 puhul „lubamispakett“ (enablement package)?", "o": ["Uus kood on arvutis juba igakuiste uuendustega olemas ja väike pakett lülitab selle sisse ning muudab versiooninumbri", "Iga uuendus paigaldab Windowsi täielikult uuesti", "Pakett lubab paigaldada Windowsi ilma litsentsita", "Pakett lülitab välja kõik turvafunktsioonid"], "c": 0, "e": "24H2, 25H2 ja 26H2 on sama koodibaas. 26H2 lubamispakett on x64-arvutil vaid umbes 174 KB ja paigaldus võtab mõne minuti."},
{"q": "Mida eemaldati Windows 11 25H2-st ja mida see administraatorile tähendab?", "o": ["Start-menüü; tuleb kasutada käsurida", "Active Directory; tuleb kasutada Entra ID-d", "PowerShell 2.0 ja WMIC; vanad skriptid tuleb üle vaadata ja kasutada PowerShelli CIM-käske", "BitLocker; ketaste krüpteerimiseks tuleb kasutada muud tarkvara"], "c": 2, "e": "PowerShell 2.0 mootorit kasutati ründajate poolt turvapiirangutest mööda hiilimiseks. Näiteks <code>wmic bios get serialnumber</code> asemel tuleb kasutada <code>Get-CimInstance</code>."},
{"q": "Miks kirjutati osa Windows 11 24H2 tuumast ümber Rust-keelde?", "o": ["Rust-kood töötab ainult ARM-protsessoritel", "Rust väldib terveid mäluvigade klasse, nt puhvri ületäitumist", "Rust on kiirem kui assembler", "Rust-kood ei vaja kompileerimist"], "c": 1, "e": "Suur osa Windowsi turvaaukudest on tekkinud mäluvigadest C- ja C++-koodis. Rusti kompilaator ei luba selliseid vigu teha."},
{"q": "2026. aasta novembris on koolis Windows 10 arvuti, mida pole ESU programmi alla viidud. Mida tuleb teha?", "o": ["Mitte midagi, Windows 10 saab endiselt turvauuendusi", "Lülitada välja automaatsed uuendused", "Paigaldada Windows ME", "Uuendada Windows 11-le, kui riistvara lubab, või viia organisatsiooni ESU alla või välja vahetada; ilma uuendusteta arvutit ei tohi võrku lubada"], "c": 3, "e": "Windows 10 tasuta tugi lõppes 14.10.2025 ja tarbija-ESU 13.10.2026. Organisatsioonid saavad ESU-d osta kuni oktoobrini 2028."}
];

const $=id=>document.getElementById(id);
let order=[],state=[],cur=0,shuffled=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(indexes){
  order=indexes;cur=0;
  state=order.map(()=>({picked:null,ok:null}));
  shuffled=order.map(i=>shuffle(KYSIMUSED[i].o.map((t,k)=>({t,k}))));
  $('tot').textContent=order.length;
  renderBar();render();
}
function renderBar(){
  const bar=$('bar');bar.innerHTML='';
  order.forEach((_,n)=>{const s=document.createElement('button');s.className='seg'+(state[n].ok===true?' ok':state[n].ok===false?' bad':'')+(n===cur?' cur':'');
    s.title='Küsimus '+(n+1);s.setAttribute('aria-label','Küsimus '+(n+1));s.onclick=()=>{cur=n;render();renderBar()};bar.appendChild(s)});
  $('okc').textContent=state.filter(s=>s.ok===true).length;
  $('badc').textContent=state.filter(s=>s.ok===false).length;
}
function render(){
  if(cur>=order.length)return renderEnd();
  $('pos').textContent=cur+1;
  const Q=KYSIMUSED[order[cur]],st=state[cur],opts=shuffled[cur],L='ABCD';
  let h='<p class="qnum">Küsimus '+(cur+1)+'</p><p class="qtext">'+Q.q+'</p>';
  opts.forEach((o,n)=>{
    let cls='opt';
    if(st.picked!==null){if(o.k===Q.c)cls+=' ok';else if(n===st.picked)cls+=' bad';else cls+=' dim'}
    h+='<button class="'+cls+'" data-n="'+n+'"'+(st.picked!==null?' disabled':'')+'><span class="k">'+L[n]+'</span><span>'+o.t+'</span></button>';
  });
  if(st.picked!==null){
    h+='<div class="fb '+(st.ok?'ok':'bad')+'"><strong>'+(st.ok?'Õige!':'Vale. Õige vastus: '+L[opts.findIndex(o=>o.k===Q.c)])+'</strong>'+Q.e+'</div>';
  }
  const answered=state.filter(s=>s.picked!==null).length;
  h+='<div class="actions"><button class="btn" id="prev"'+(cur===0?' disabled':'')+'>← Eelmine</button>';
  h+='<span class="hint">'+(st.picked===null?'Vali üks vastus':'')+'</span>';
  h+='<button class="btn primary" id="next"'+(st.picked===null?' disabled':'')+'>'+(answered===order.length?'Vaata tulemust':'Järgmine →')+'</button></div>';
  $('card').innerHTML=h;
  $('card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  $('prev').onclick=()=>{cur--;render();renderBar()};
  $('next').onclick=next;
}
function pick(n){
  const st=state[cur];if(st.picked!==null)return;
  st.picked=n;st.ok=shuffled[cur][n].k===KYSIMUSED[order[cur]].c;
  render();renderBar();$('next').focus();
}
function next(){
  if(state.every(s=>s.picked!==null)){cur=order.length;renderBar();return render()}
  let n=cur+1;while(n<order.length&&state[n].picked!==null)n++;
  if(n>=order.length)n=state.findIndex(s=>s.picked===null);
  cur=n;render();renderBar();
}
function renderEnd(){
  $('pos').textContent=order.length;
  const ok=state.filter(s=>s.ok).length,tot=order.length,pct=Math.round(ok/tot*100);
  const grade=pct>=90?'Suurepärane! Peatüki põhimõisted on selged.':pct>=70?'Hea tulemus. Vaata valesti vastatud küsimused üle.':pct>=50?'Arvestatav, aga loe vastavad alapeatükid uuesti läbi.':'Loe peatükk uuesti läbi ja proovi siis veel kord.';
  const wrong=order.map((q,n)=>({q,n})).filter(x=>state[x.n].ok===false);
  let h='<p class="qnum">Tulemus</p><p class="big">'+ok+' / '+tot+'</p><p class="grade">'+pct+'% · '+grade+'</p>';
  if(wrong.length){
    h+='<p class="qnum" style="margin-top:1rem">Valesti vastatud</p><ul class="review">';
    wrong.forEach(x=>{const Q=KYSIMUSED[x.q];h+='<li>'+Q.q+'<br><span class="ans">Õige: '+Q.o[Q.c]+'</span></li>'});
    h+='</ul>';
  }
  h+='<div class="actions"><button class="btn" id="again">Alusta uuesti</button>'+(wrong.length?'<button class="btn primary" id="retry">Korda valesid ('+wrong.length+')</button>':'')+'</div>';
  $('card').innerHTML=h;
  $('again').onclick=()=>start(KYSIMUSED.map((_,i)=>i));
  if(wrong.length)$('retry').onclick=()=>start(wrong.map(x=>x.q));
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(cur<order.length&&state[cur].picked===null&&['1','2','3','4'].includes(e.key))pick(+e.key-1);
  else if(e.key==='Enter'&&cur<order.length&&state[cur].picked!==null){e.preventDefault();next()}
});
start(KYSIMUSED.map((_,i)=>i));
</script>
