<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>Peatükk 2 – test: operatsioonisüsteemi ülesanded</title>
<style>
:root{--bg:#fff;--card:#f6f5f1;--text:#1f1f1d;--muted:#6b6a65;--border:#d6d4cc;--accent:#185fa5;--accent-bg:#e6f1fb;
--ok:#3b6d11;--ok-bg:#eaf3de;--ok-line:#639922;--bad:#a32d2d;--bad-bg:#fcebeb;--bad-line:#e24b4a;--todo:#e4e2da;
--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--card:#262624;--text:#ecebe6;--muted:#a3a29c;--border:#44443f;--accent:#85b7eb;--accent-bg:#0c447c;
--ok:#c0dd97;--ok-bg:#27500a;--ok-line:#97c459;--bad:#f7c1c1;--bad-bg:#791f1f;--bad-line:#f09595;--todo:#3a3a37}}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);max-width:760px;margin:2rem auto;padding:0 1rem;line-height:1.6}
h1{font-size:22px;font-weight:500;margin:0 0 .25rem}
.sub{color:var(--muted);font-size:14px;margin:0 0 1.5rem}
nav a{color:var(--accent);font-size:14px}
code{font-family:var(--mono);font-size:.9em;background:var(--card);padding:0 4px;border-radius:4px}
.bar{display:flex;gap:3px;margin:0 0 .5rem}
.seg{flex:1;height:8px;border-radius:2px;background:var(--todo);border:0;padding:0;cursor:pointer}
.seg.ok{background:var(--ok-line)}.seg.bad{background:var(--bad-line)}.seg.cur{outline:2px solid var(--accent);outline-offset:1px}
.stats{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:0 0 1.5rem}
.stats b{color:var(--text);font-weight:500}
.card{background:var(--card);border-radius:12px;padding:1.25rem 1.5rem}
.qnum{font-size:13px;color:var(--muted);margin:0 0 .25rem}
.qtext{font-size:18px;font-weight:500;margin:0 0 1rem;line-height:1.5}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.7rem 1rem;margin:0 0 8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.opt.ok .k,.opt.bad .k{border-color:currentColor;color:inherit}
.opt.dim{opacity:.55}
.fb{margin:1rem 0 0;padding:.75rem 1rem;border-left:3px solid;border-radius:0;background:var(--bg);font-size:15px}
.fb.ok{border-color:var(--ok-line)}.fb.bad{border-color:var(--bad-line)}
.fb strong{display:block;margin-bottom:2px}
.fb.ok strong{color:var(--ok)}.fb.bad strong{color:var(--bad)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:8px;flex-wrap:wrap}
button.btn{font:inherit;font-size:15px;padding:.5rem 1.1rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.btn.primary{color:#042c53}}
button.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.big{font-size:40px;font-weight:500;margin:0}
.grade{font-size:18px;margin:.25rem 0 1rem}
.review{margin:1rem 0 0;padding:0;list-style:none}
.review li{padding:.6rem 0;border-top:1px solid var(--border);font-size:15px}
.review .ans{color:var(--ok);font-size:14px}
</style>

<body>
<nav><a href="https://github.com/valdonolvak/Operatsioonis-steemi-ja-k-berturbe-alused/blob/main/peatykid/02-os-i-ulesanded.md">← Peatükk 2</a> · <a href="02-os-ulesanded.html">Interaktiivne leht</a></nav>
<h1>Test: operatsioonisüsteemi ülesanded</h1>
<p class="sub">Vali vastus ja näed kohe, kas see oli õige ning miks. Klaviatuuriga: <code>1</code>–<code>4</code> valib, <code>Enter</code> viib edasi.</p>

<div class="bar" id="bar" aria-label="Edenemine"></div>
<div class="stats"><span>Küsimus <b id="pos">1</b> / <b id="tot">0</b></span><span>Õigeid <b id="okc">0</b> · Valesid <b id="badc">0</b></span></div>

<div class="card" id="card" aria-live="polite"></div>

<script>
/* Küsimused: q = küsimus (HTML), o = vastusevariandid, c = õige variandi indeks (0-põhine), e = selgitus */
const KYSIMUSED=[
{"q": "Milline on operatsioonisüsteemi põhiroll?", "o": ["Ta on vahendaja rakenduste ja riistvara vahel: jagab ressursse, kaitseb programme üksteise eest ja pakub ühtset liidest", "Ta on ainult graafiline kasutajaliides", "Ta on programm dokumentide koostamiseks", "Ta kiirendab internetiühendust"], "c": 0, "e": "Kasutajaliides on vaid üks OS-i ülesannetest. OS jagab protsessoriaega, mälu, kettaid ja võrku ning isoleerib programme üksteisest."},
{"q": "Milline neist on süsteemitarkvara?", "o": ["Veebibrauser", "Tabelarvutus", "Seadmedraiver", "Mäng"], "c": 2, "e": "Süsteemitarkvara on madala taseme programmid: operatsioonisüsteem, draiverid, kompilaatorid ja haldustööriistad. Brauser, tabelarvutus ja mäng on rakendustarkvara."},
{"q": "Milline neist on rakendustarkvara?", "o": ["Kompilaator", "Tekstitöötlusprogramm", "UEFI püsivara", "Kettahaldur"], "c": 1, "e": "Rakendustarkvara on mõeldud lõppkasutaja tööks või meelelahutuseks. Kompilaator, püsivara ja kettahaldur on süsteemitarkvara."},
{"q": "Mis iseloomustab von Neumanni arhitektuuri?", "o": ["Programmi käsud ja andmed asuvad eraldi mäludes", "Protsessoril puudub mälu", "Arvuti töötab ainult analoogsignaalidega", "Programmi käsud ja andmed asuvad samas mälus; protsessor loeb käsu, dekodeerib ja täidab selle"], "c": 3, "e": "Von Neumanni arhitektuur koosneb protsessorist, põhimälust, sisend-väljundseadmetest ja siinidest. Arhitektuuri, kus käsud ja andmed on eraldi mäludes, nimetatakse Harvardi arhitektuuriks."},
{"q": "Mida tähendab hübriidprotsessoris P- ja E-tuumade jaotus?", "o": ["P-tuumad on jõudluse tuumad, E-tuumad säästlikud tuumad; OS-i planeerija otsustab, milline töö kuhu läheb", "P-tuumad on graafika jaoks, E-tuumad võrgu jaoks", "P-tuumad on füüsilised, E-tuumad ainult emuleeritud", "P-tuumad töötavad Windowsis, E-tuumad Linuxis"], "c": 0, "e": "Raske töö (nt mäng) läheb P-tuumadele ja taustatöö (nt indekseerimine) E-tuumadele. Hea tulemus sõltub sellest, kui hästi OS-i planeerija tuumad ära jaotab."},
{"q": "Mis on NPU peamine ülesanne?", "o": ["Graafika renderdamine", "Võrguliikluse krüpteerimine", "Tehisintellekti mudelite säästlik käitamine", "Andmete pikaajaline salvestamine"], "c": 2, "e": "NPU (neurotöötlusseade) käitab AI-mudeleid palju väiksema energiakuluga kui CPU või GPU. Näiteks Copilot+ arvutite kohalikud funktsioonid vajavad NPU-d."},
{"q": "Milleks on arvutis TPM 2.0 või Microsoft Pluton?", "o": ["Graafika kiirendamiseks", "Krüptovõtmete turvaliseks hoidmiseks ja käivitusahela mõõtmiseks", "Mälu laiendamiseks", "Võrguühenduse loomiseks"], "c": 1, "e": "Turvaprotsessor hoiab näiteks BitLockeri ja Windows Hello võtmeid nii, et neid ei saa kettalt lihtsalt kopeerida. Pluton on protsessorisse integreeritud turvaprotsessor."},
{"q": "Mis asendas BIOS-i?", "o": ["TPM", "ACPI", "NVMe", "UEFI"], "c": 3, "e": "UEFI püsivara käivitab arvuti ja võimaldab Secure Booti, mis kontrollib alglaaduri digiallkirja. Windows 11 nõuab UEFI-t ja Secure Booti."},
{"q": "Miks on NVMe-SSD kiirem kui vanem SATA-ketas?", "o": ["See on ühendatud otse PCIe-siinile ja suudab käsitleda palju päringuid paralleelselt", "Sellel on suurem pöörlemiskiirus", "See kasutab magnetlinti", "See ei vaja draiverit"], "c": 0, "e": "SATA-liides oli kunagi loodud pöörlevate ketaste jaoks. NVMe kasutab PCIe-siini ja paljusid paralleelseid käsujärjekordi."},
{"q": "Milline OS-i ülesanne loob ja lõpetab protsesse ning jagab protsessoriaega?", "o": ["Mäluhaldus", "Protsesside haldus", "Failide haldus", "Võrk"], "c": 1, "e": "Protsessihaldur loob ja lõpetab protsesse ning planeerija (scheduler) jagab protsessoriaega lõimede vahel."},
{"q": "Arvutis on 8 GB RAM-i, aga avatud programmid vajavad 10 GB. Mis lubab arvutil edasi töötada?", "o": ["Planeerija", "Turvaviitemonitor", "Virtuaalmälu: mäluhaldur viib vähem kasutatud andmed kettale saalefaili", "NTFS-i logimine"], "c": 2, "e": "Virtuaalmälu kasutab ketast mälu laiendusena. Arvuti muutub aeglasemaks, sest ketas on palju aeglasem kui RAM, kuid ei jookse kokku."},
{"q": "Milline Windowsi komponent kontrollib, kas kasutajal on õigus faili avada?", "o": ["Vahemäluhaldur", "Toitehaldur", "PnP-haldur", "Turvaviitemonitor (SRM)"], "c": 3, "e": "SRM võrdleb kasutaja pääsulubade loendit faili pääsuloendiga (ACL). LSASS tegeleb sisselogimise ja autentimisega."},
{"q": "Millised on Windowsi failisüsteemid?", "o": ["NTFS ja ReFS", "ext4 ja XFS", "APFS ja HFS+", "TCP ja UDP"], "c": 0, "e": "NTFS on Windowsi põhiline failisüsteem. ReFS on mõeldud eelkõige serveritele ja suurtele andmemahtudele. ext4 ja XFS on Linuxi, APFS macOS-i failisüsteemid. TCP ja UDP on võrguprotokollid."},
{"q": "Milline OS-i ülesanne tuvastab uue USB-seadme ja laadib selle draiveri?", "o": ["Võrk", "Sisend ja väljund (PnP- ja S/V-haldur)", "Mäluhaldus", "Kasutajaliides"], "c": 1, "e": "Plug and Play haldur tuvastab seadme ja S/V-haldur laadib draiveri. Toitehaldur kuulub samuti sisendi ja väljundi halduse alla."},
{"q": "Mis on Windowsis LSASS-i roll?", "o": ["Ta joonistab akende sisu", "Ta haldab printerijärjekorda", "Ta tegeleb sisselogimise ja autentimisega ning hoiab mälus sisselogimisandmeid", "Ta pakib faile kokku"], "c": 2, "e": "LSASS (Local Security Authority Subsystem Service) on turvalisuse seisukohalt oluline protsess. Seetõttu üritavad ründajad sealt paroolide räsisid varastada ja seda kaitsevad LSA kaitse ning Credential Guard."},
{"q": "Milline neist kuulub OS-i kasutajaliidese ülesande alla?", "o": ["TCP/IP pinu", "Mäluhaldur", "NTFS", "Explorer, PowerShell ja Windows Terminal"], "c": 3, "e": "Kasutajaliides võib olla graafiline kest (Explorer) või käsurealõikesüsteem (PowerShell, cmd). Windows Terminal on aken, milles käsureaprogramme kasutatakse."},
{"q": "Mida tähendab vaade, et OS on „laiendatud masin“?", "o": ["OS lisab arvutile füüsilist mälu", "OS peidab riistvara keerukuse: rakendus kutsub välja „ava fail“ ega tea, kas fail on SSD-l, USB-pulgal või võrgukettal", "OS töötab ainult virtuaalmasinas", "OS jagab protsessoriaega programmide vahel"], "c": 1, "e": "Laiendatud masin pakub programmeerijale lihtsamaid abstraktsioone (fail, protsess, sokkel) kui riistvara ise. Protsessoriaja jagamine kuulub ressursihalduri vaate alla."},
{"q": "Mida tähendab vaade, et OS on „ressursihaldur“?", "o": ["OS otsustab, kes ja millal ressurssi kasutab, nii et süsteem oleks õiglane, tõhus ja turvaline", "OS ostab arvutile uut riistvara", "OS varundab kõik failid pilve", "OS peidab riistvara rakenduste eest"], "c": 0, "e": "Ressursid on protsessoriaeg, mälu, kettad, võrk ja sülearvutis ka aku. Riistvara peitmine kuulub laiendatud masina vaate alla."},
{"q": "Wordis Ctrl+S vajutamisel saab Word kohe edasi töötada, kuigi andmed pole veel kettale kirjutatud. Mis seda võimaldab?", "o": ["Draiver", "Turvaviitemonitor", "Vahemälu: andmed võetakse mällu vastu ja kirjutatakse kettale veidi hiljem", "Planeerija"], "c": 2, "e": "Vahemäluhaldur kogub kirjutused mällu ja kirjutab need kettale sobival ajal. Seetõttu tuleb USB-pulk enne eemaldamist turvaliselt väljutada, muidu võivad osa andmeid kaduma minna."},
{"q": "Ctrl+S näites saadab käsu SSD kontrollerile:", "o": ["Word ise", "Failisüsteem otse", "Kasutaja", "Seadme draiver"], "c": 3, "e": "Draiver tõlgib OS-i üldise käsu konkreetse seadme keelde. Rakendus ei pöördu kunagi otse riistvara poole."},
{"q": "Mis juhtub Ctrl+S näites, kui kasutajal pole õigust sellesse kausta kirjutada?", "o": ["Fail kirjutatakse ikkagi, aga peidetult", "OS keeldub ja Word saab vea „Juurdepääs keelatud“; ketta poole ei pöördutagi", "Word salvestab faili teise kasutaja nimel", "Arvuti taaskäivitub"], "c": 1, "e": "Õiguste kontroll toimub enne kirjutamist. See on OS-i turvalisuse ülesanne."},
{"q": "Miks ei tohi rakendus pöörduda otse riistvara poole?", "o": ["Riistvara ei mõista rakenduse keelt", "Siis töötaks arvuti liiga kiiresti", "Siis ei saaks OS ressursse jagada ega programme üksteise eest kaitsta ning iga programm peaks iga seadet ise tundma", "Rakendus pöördub alati otse riistvara poole"], "c": 2, "e": "MS-DOS-is pöördusid programmid otse riistvara poole ja üks vigane programm võis kogu süsteemi kokku jooksutada."},
{"q": "Millised kaks ootust on lisandunud tänapäeva OS-ile?", "o": ["Töökindlus ja taastumine ning energiatõhusus", "Ainult graafika ja helid", "Ainult võrgukiirus", "Värvilisus ja animatsioonid"], "c": 0, "e": "Süsteem peab vigadest ise taastuma (vt ptk 19) ning sülearvutis ja telefonis on aku sama oluline ressurss kui protsessoriaeg."},
{"q": "Milline PowerShelli käsk näitab protsessori nime ning tuumade ja loogiliste protsessorite arvu?", "o": ["Get-Tpm", "Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors", "Get-CimInstance Win32_PhysicalMemory", "Get-Process"], "c": 1, "e": "Get-Tpm näitab TPM-i olekut, Win32_PhysicalMemory mälumooduleid ja Get-Process töötavaid protsesse. Loogilisi protsessoreid võib olla rohkem kui tuumi, kui protsessor kasutab hüperlõimimist."},
{"q": "Kahe programmi korraga töötamisel ilma OS-ita kirjutavad mõlemad otse samale kettale. Mis on kõige tõenäolisem tagajärg?", "o": ["Kettale mahub rohkem andmeid", "Kirjutamine on kiirem", "Midagi ei juhtu, kettad on selleks tehtud", "Programmid kirjutavad teineteise andmed üle ja failisüsteem läheb katki"], "c": 3, "e": "Failide ja salvestuse haldus koordineerib kettale kirjutamist: lukustab faile, jälgib vaba ruumi ja hoiab tabelid järjepidevad."}
];

const $=id=>document.getElementById(id);
let order=[],state=[],cur=0,shuffled=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(indexes){
  order=indexes;cur=0;
  state=order.map(()=>({picked:null,ok:null}));
  shuffled=order.map(i=>shuffle(KYSIMUSED[i].o.map((t,k)=>({t,k}))));
  $('tot').textContent=order.length;
  renderBar();render();
}
function renderBar(){
  const bar=$('bar');bar.innerHTML='';
  order.forEach((_,n)=>{const s=document.createElement('button');s.className='seg'+(state[n].ok===true?' ok':state[n].ok===false?' bad':'')+(n===cur?' cur':'');
    s.title='Küsimus '+(n+1);s.setAttribute('aria-label','Küsimus '+(n+1));s.onclick=()=>{cur=n;render();renderBar()};bar.appendChild(s)});
  $('okc').textContent=state.filter(s=>s.ok===true).length;
  $('badc').textContent=state.filter(s=>s.ok===false).length;
}
function render(){
  if(cur>=order.length)return renderEnd();
  $('pos').textContent=cur+1;
  const Q=KYSIMUSED[order[cur]],st=state[cur],opts=shuffled[cur],L='ABCD';
  let h='<p class="qnum">Küsimus '+(cur+1)+'</p><p class="qtext">'+Q.q+'</p>';
  opts.forEach((o,n)=>{
    let cls='opt';
    if(st.picked!==null){if(o.k===Q.c)cls+=' ok';else if(n===st.picked)cls+=' bad';else cls+=' dim'}
    h+='<button class="'+cls+'" data-n="'+n+'"'+(st.picked!==null?' disabled':'')+'><span class="k">'+L[n]+'</span><span>'+o.t+'</span></button>';
  });
  if(st.picked!==null){
    h+='<div class="fb '+(st.ok?'ok':'bad')+'"><strong>'+(st.ok?'Õige!':'Vale. Õige vastus: '+L[opts.findIndex(o=>o.k===Q.c)])+'</strong>'+Q.e+'</div>';
  }
  const answered=state.filter(s=>s.picked!==null).length;
  h+='<div class="actions"><button class="btn" id="prev"'+(cur===0?' disabled':'')+'>← Eelmine</button>';
  h+='<span class="hint">'+(st.picked===null?'Vali üks vastus':'')+'</span>';
  h+='<button class="btn primary" id="next"'+(st.picked===null?' disabled':'')+'>'+(answered===order.length?'Vaata tulemust':'Järgmine →')+'</button></div>';
  $('card').innerHTML=h;
  $('card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  $('prev').onclick=()=>{cur--;render();renderBar()};
  $('next').onclick=next;
}
function pick(n){
  const st=state[cur];if(st.picked!==null)return;
  st.picked=n;st.ok=shuffled[cur][n].k===KYSIMUSED[order[cur]].c;
  render();renderBar();$('next').focus();
}
function next(){
  if(state.every(s=>s.picked!==null)){cur=order.length;renderBar();return render()}
  let n=cur+1;while(n<order.length&&state[n].picked!==null)n++;
  if(n>=order.length)n=state.findIndex(s=>s.picked===null);
  cur=n;render();renderBar();
}
function renderEnd(){
  $('pos').textContent=order.length;
  const ok=state.filter(s=>s.ok).length,tot=order.length,pct=Math.round(ok/tot*100);
  const grade=pct>=90?'Suurepärane! Peatüki põhimõisted on selged.':pct>=70?'Hea tulemus. Vaata valesti vastatud küsimused üle.':pct>=50?'Arvestatav, aga loe vastavad alapeatükid uuesti läbi.':'Loe peatükk uuesti läbi ja proovi siis veel kord.';
  const wrong=order.map((q,n)=>({q,n})).filter(x=>state[x.n].ok===false);
  let h='<p class="qnum">Tulemus</p><p class="big">'+ok+' / '+tot+'</p><p class="grade">'+pct+'% · '+grade+'</p>';
  if(wrong.length){
    h+='<p class="qnum" style="margin-top:1rem">Valesti vastatud</p><ul class="review">';
    wrong.forEach(x=>{const Q=KYSIMUSED[x.q];h+='<li>'+Q.q+'<br><span class="ans">Õige: '+Q.o[Q.c]+'</span></li>'});
    h+='</ul>';
  }
  h+='<div class="actions"><button class="btn" id="again">Alusta uuesti</button>'+(wrong.length?'<button class="btn primary" id="retry">Korda valesid ('+wrong.length+')</button>':'')+'</div>';
  $('card').innerHTML=h;
  $('again').onclick=()=>start(KYSIMUSED.map((_,i)=>i));
  if(wrong.length)$('retry').onclick=()=>start(wrong.map(x=>x.q));
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(cur<order.length&&state[cur].picked===null&&['1','2','3','4'].includes(e.key))pick(+e.key-1);
  else if(e.key==='Enter'&&cur<order.length&&state[cur].picked!==null){e.preventDefault();next()}
});
start(KYSIMUSED.map((_,i)=>i));
</script>
