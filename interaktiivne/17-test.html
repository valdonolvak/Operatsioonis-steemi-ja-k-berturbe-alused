<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peatükk 17 – test: võrk Windowsis</title>
<style>
:root{--bg:#fff;--card:#f6f5f1;--text:#1f1f1d;--muted:#6b6a65;--border:#d6d4cc;--accent:#185fa5;--accent-bg:#e6f1fb;
--ok:#3b6d11;--ok-bg:#eaf3de;--ok-line:#639922;--bad:#a32d2d;--bad-bg:#fcebeb;--bad-line:#e24b4a;--todo:#e4e2da;
--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--card:#262624;--text:#ecebe6;--muted:#a3a29c;--border:#44443f;--accent:#85b7eb;--accent-bg:#0c447c;
--ok:#c0dd97;--ok-bg:#27500a;--ok-line:#97c459;--bad:#f7c1c1;--bad-bg:#791f1f;--bad-line:#f09595;--todo:#3a3a37}}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);max-width:760px;margin:2rem auto;padding:0 1rem;line-height:1.6}
h1{font-size:22px;font-weight:500;margin:0 0 .25rem}
.sub{color:var(--muted);font-size:14px;margin:0 0 1.5rem}
nav a{color:var(--accent);font-size:14px}
code{font-family:var(--mono);font-size:.9em;background:var(--card);padding:0 4px;border-radius:4px}
.bar{display:flex;gap:3px;margin:0 0 .5rem}
.seg{flex:1;height:8px;border-radius:2px;background:var(--todo);border:0;padding:0;cursor:pointer}
.seg.ok{background:var(--ok-line)}.seg.bad{background:var(--bad-line)}.seg.cur{outline:2px solid var(--accent);outline-offset:1px}
.stats{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:0 0 1.5rem}
.stats b{color:var(--text);font-weight:500}
.card{background:var(--card);border-radius:12px;padding:1.25rem 1.5rem}
.qnum{font-size:13px;color:var(--muted);margin:0 0 .25rem}
.qtext{font-size:18px;font-weight:500;margin:0 0 1rem;line-height:1.5}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.7rem 1rem;margin:0 0 8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.opt.ok .k,.opt.bad .k{border-color:currentColor;color:inherit}
.opt.dim{opacity:.55}
.fb{margin:1rem 0 0;padding:.75rem 1rem;border-left:3px solid;border-radius:0;background:var(--bg);font-size:15px}
.fb.ok{border-color:var(--ok-line)}.fb.bad{border-color:var(--bad-line)}
.fb strong{display:block;margin-bottom:2px}
.fb.ok strong{color:var(--ok)}.fb.bad strong{color:var(--bad)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:8px;flex-wrap:wrap}
button.btn{font:inherit;font-size:15px;padding:.5rem 1.1rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.btn.primary{color:#042c53}}
button.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.big{font-size:40px;font-weight:500;margin:0}
.grade{font-size:18px;margin:.25rem 0 1rem}
.review{margin:1rem 0 0;padding:0;list-style:none}
.review li{padding:.6rem 0;border-top:1px solid var(--border);font-size:15px}
.review .ans{color:var(--ok);font-size:14px}
</style>
</head>
<body>
<nav><a href="https://github.com/valdonolvak/Operatsioonis-steemi-ja-k-berturbe-alused/blob/main/peatykid/17-vork.md">← Peatükk 17</a> · <a href="17-vork.html">Interaktiivne õpileht</a></nav>
<h1>Test: võrk Windowsis</h1>
<p class="sub">Vali vastus ja näed kohe, kas see oli õige ning miks. Klaviatuuriga: <code>1</code>–<code>4</code> valib, <code>Enter</code> viib edasi.</p>

<div class="bar" id="bar" aria-label="Edenemine"></div>
<div class="stats"><span>Küsimus <b id="pos">1</b> / <b id="tot">0</b></span><span>Õigeid <b id="okc">0</b> · Valesid <b id="badc">0</b></span></div>

<div class="card" id="card" aria-live="polite"></div>

<script>
/* Küsimused: q = küsimus (HTML), o = vastusevariandid, c = õige variandi indeks (0-põhine), e = selgitus */
const KYSIMUSED=[
{"q": "Mis on kapseldamine?", "o": ["Andmete krüpteerimine", "Andmete tihendamine", "Paketi kustutamine tulemüüris", "Iga kiht lisab saatmisel andmetele oma päise"], "c": 3, "e": "Rakenduse andmed → TCP-segment → IP-pakett → Ethernet-kaader. Vastuvõtja eemaldab päised vastupidises järjekorras."},
{"q": "Millist päist vaatab ruuter, et otsustada, kuhu pakett saata?", "o": ["TLS-päist", "Faili nime", "IP-päist", "HTTP-päist"], "c": 2, "e": "Ruuter töötab võrgukihis (kiht 3) ja vaatab sihtaadressi."},
{"q": "Mida näeb kohviku Wi-Fi naaber, kui avad HTTPS-lehe?", "o": ["Ainult sinu MAC-aadressi", "Serveri IP-aadressi ja nime (SNI), kuid mitte lehe sisu ega küpsist", "Kõike, ka paroole", "Mitte midagi"], "c": 1, "e": "TLS krüpteerib HTTP-päringu. Ilma HTTPS-ita oleks kõik nähtav."},
{"q": "Mida tähendab IP-aadressi juures /24?", "o": ["Esimesed 24 bitti on võrgu osa (mask 255.255.255.0)", "Võrgus on 24 arvutit", "Aadress kehtib 24 tundi", "Ruuteri number on 24"], "c": 0, "e": "/24 võrgus on 254 arvuti aadressi."},
{"q": "Kas 192.168.1.57/24 ja 192.168.2.10/24 on samas alamvõrgus?", "o": ["Jah", "Ainult IPv6 korral", "Ainult siis, kui DNS töötab", "Ei – pakett peab minema läbi vaikelüüsi"], "c": 3, "e": "Võrgu osad on 192.168.1 ja 192.168.2 – need on eri võrgud."},
{"q": "Mida tähendab, kui arvuti IP-aadress on 169.254.x.x?", "o": ["DNS ei tööta", "Arvuti on domeenikontroller", "DHCP-server ei vastanud ja Windows andis endale APIPA-aadressi", "Arvuti on internetis"], "c": 2, "e": "APIPA-aadressiga pole lüüsi ega DNS-i – internet ei tööta."},
{"q": "Milline neist on privaatne IP-aadress?", "o": ["1.1.1.1", "10.20.30.40", "8.8.8.8", "185.31.240.10"], "c": 1, "e": "Privaatsed vahemikud on 10.x.x.x, 172.16–31.x.x ja 192.168.x.x."},
{"q": "Mis on vaikelüüs?", "o": ["Ruuter, kuhu saadetakse paketid, mis lähevad teise võrku", "DNS-server", "DHCP-server", "Tulemüüri reegel"], "c": 0, "e": "Vale lüüs tähendab, et kohalik võrk töötab, kuid internet mitte."},
{"q": "Milline on DHCP sammude õige järjekord?", "o": ["Request, Offer, Discover, Acknowledge", "Offer, Discover, Acknowledge, Request", "Discover, Request, Offer, Acknowledge", "Discover, Offer, Request, Acknowledge"], "c": 3, "e": "DORA: arvuti otsib, server pakub, arvuti võtab, server kinnitab."},
{"q": "Kust otsib Windows nime IP-aadressi kõigepealt?", "o": [".ee serverilt", "Ruuterilt", "DNS-kliendi vahemälust", "Juurserverilt"], "c": 2, "e": "Järjekord: vahemälu → hosts-fail → DNS-server (kes vajadusel küsib edasi)."},
{"q": "Miks on hosts-faili muutmine pahavara jaoks kasulik?", "o": ["See kustutab DNS-vahemälu", "Hosts-fail on DNS-serverist eespool, nii et kasutaja saab suunata võltslehele", "See kiirendab internetti", "See keelab tulemüüri"], "c": 1, "e": "Kontrolli faili C:\\Windows\\System32\\drivers\\etc\\hosts, kui kahtlustad ümbersuunamist."},
{"q": "Milline on TCP kolmesammuline käepigistus?", "o": ["SYN, SYN-ACK, ACK", "SYN, ACK, FIN", "GET, POST, OK", "Discover, Offer, ACK"], "c": 0, "e": "Alles pärast käepigistust saab andmeid saata."},
{"q": "Server vastab SYN-ile RST-ga. Mida see tähendab?", "o": ["Tulemüür blokeerib", "Ühendus õnnestus", "DNS ei tööta", "Port on suletud – server on olemas, kuid teenus ei kuula"], "c": 3, "e": "Kui vastust ei tule üldse, on tõenäoliselt tulemüür vahel."},
{"q": "Mis vahe on TCP-l ja UDP-l?", "o": ["TCP on ainult IPv6 jaoks", "Vahet pole", "TCP loob ühenduse ja saadab kadunud andmed uuesti, UDP mitte", "UDP on alati krüpteeritud"], "c": 2, "e": "UDP-d kasutavad DNS, DHCP, video ja mängud – seal on kiirus olulisem kui iga pakett."},
{"q": "Mis on QUIC?", "o": ["DNS-i laiendus", "UDP-l põhinev transpordiprotokoll, kus TLS 1.3 on sisse ehitatud", "Windowsi tulemüür", "Uus IP-versioon"], "c": 1, "e": "QUIC-it kasutavad HTTP/3 ja SMB over QUIC."},
{"q": "Millist porti kasutab SMB failijagamine?", "o": ["445", "443", "3389", "53"], "c": 0, "e": "Porti 445 ei tohi kunagi otse internetti avada."},
{"q": "Millist porti kasutab kaugtöölaud (RDP)?", "o": ["22", "445", "5985", "3389"], "c": 3, "e": "Internetist tohib RDP-le pääseda ainult VPN-i või RD Gateway kaudu."},
{"q": "Mis on Windows Filtering Platform (WFP)?", "o": ["DNS-klient", "HTTP-server", "Raamistik, millele toetuvad tulemüür, VPN-id ja EDR-id liikluse filtreerimiseks", "Võrgukaardi draiver"], "c": 2, "e": "WFP kontrollib iga ühendust enne, kui NDIS-draiverid selle võrgukaardile annavad."},
{"q": "Mis on NDIS miniport-draiver?", "o": ["Veebibrauser", "Võrgukaardi draiver", "Tulemüüri reegel", "DNS-server"], "c": 1, "e": "Protokollidraiver (TCP/IP) on üleval, filtridraiverid vahel."},
{"q": "Mis on Kerberose TGT?", "o": ["Pilet, mille kasutaja saab sisselogimisel ja millega küsib teenusepileteid", "Parool krüpteeritud kujul", "Tulemüüri reegel", "DNS-kirje"], "c": 0, "e": "TGT kehtib vaikimisi 10 tundi; parooli võrgus ei saadeta."},
{"q": "Miks ei saa ründaja Kerberose teenusepiletit teisele serverile edasi anda?", "o": ["Pilet on liiga suur", "Kerberos ei kasuta võrku", "Ründajal pole IP-aadressi", "Pilet on krüpteeritud konkreetse teenuse võtmega ja kehtib ainult sellele"], "c": 3, "e": "NTLM-i vastus ei ole seotud kindla serveriga – seepärast on NTLM relee suhtes haavatav."},
{"q": "Miks peavad domeeni arvutite kellad olema sünkroonis?", "o": ["DHCP nõuab seda", "Et brauser töötaks", "Kerberose piletid sisaldavad ajatemplit ja lubatud erinevus on vaikimisi 5 minutit", "Et logid oleksid ilusad"], "c": 2, "e": "Vale kellaga arvuti ei saa domeenis sisse logida."},
{"q": "Kuidas töötab LLMNR-i mürgitamine?", "o": ["Ründaja keelab DHCP", "Kui DNS nime ei leia, vastab ründaja kohalikus võrgus „mina olen!“ ja saab NTLM-autentimise", "Ründaja muudab DNS-serveri kirjeid", "Ründaja varastab võrgukaabli"], "c": 1, "e": "Kaitse: lülita domeenis LLMNR ja NetBIOS rühmapoliitikaga välja."},
{"q": "Lüüs ja 1.1.1.1 vastavad, kuid Resolve-DnsName ebaõnnestub. Kus on viga?", "o": ["DNS-serveris või DNS-i seadistuses", "Võrgukaablis", "DHCP-serveris", "Tulemüüris pordil 443"], "c": 0, "e": "Võrk töötab IP-aadresside järgi, ainult nimed ei lahene."},
{"q": "Millise käsuga näeb Windowsis, millised programmid hoiavad TCP-ühendusi?", "o": ["Get-NetAdapter", "ipconfig /flushdns", "Resolve-DnsName", "Get-NetTCPConnection (veerg OwningProcess)"], "c": 3, "e": "Linuxis on sarnane käsk ss -tunap."}
];

const $=id=>document.getElementById(id);
let order=[],state=[],cur=0,shuffled=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(indexes){
  order=indexes;cur=0;
  state=order.map(()=>({picked:null,ok:null}));
  shuffled=order.map(i=>shuffle(KYSIMUSED[i].o.map((t,k)=>({t,k}))));
  $('tot').textContent=order.length;
  renderBar();render();
}
function renderBar(){
  const bar=$('bar');bar.innerHTML='';
  order.forEach((_,n)=>{const s=document.createElement('button');s.className='seg'+(state[n].ok===true?' ok':state[n].ok===false?' bad':'')+(n===cur?' cur':'');
    s.title='Küsimus '+(n+1);s.setAttribute('aria-label','Küsimus '+(n+1));s.onclick=()=>{cur=n;render();renderBar()};bar.appendChild(s)});
  $('okc').textContent=state.filter(s=>s.ok===true).length;
  $('badc').textContent=state.filter(s=>s.ok===false).length;
}
function render(){
  if(cur>=order.length)return renderEnd();
  $('pos').textContent=cur+1;
  const Q=KYSIMUSED[order[cur]],st=state[cur],opts=shuffled[cur],L='ABCD';
  let h='<p class="qnum">Küsimus '+(cur+1)+'</p><p class="qtext">'+Q.q+'</p>';
  opts.forEach((o,n)=>{
    let cls='opt';
    if(st.picked!==null){if(o.k===Q.c)cls+=' ok';else if(n===st.picked)cls+=' bad';else cls+=' dim'}
    h+='<button class="'+cls+'" data-n="'+n+'"'+(st.picked!==null?' disabled':'')+'><span class="k">'+L[n]+'</span><span>'+o.t+'</span></button>';
  });
  if(st.picked!==null){
    h+='<div class="fb '+(st.ok?'ok':'bad')+'"><strong>'+(st.ok?'Õige!':'Vale. Õige vastus: '+L[opts.findIndex(o=>o.k===Q.c)])+'</strong>'+Q.e+'</div>';
  }
  const answered=state.filter(s=>s.picked!==null).length;
  h+='<div class="actions"><button class="btn" id="prev"'+(cur===0?' disabled':'')+'>← Eelmine</button>';
  h+='<span class="hint">'+(st.picked===null?'Vali üks vastus':'')+'</span>';
  h+='<button class="btn primary" id="next"'+(st.picked===null?' disabled':'')+'>'+(answered===order.length?'Vaata tulemust':'Järgmine →')+'</button></div>';
  $('card').innerHTML=h;
  $('card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  $('prev').onclick=()=>{cur--;render();renderBar()};
  $('next').onclick=next;
}
function pick(n){
  const st=state[cur];if(st.picked!==null)return;
  st.picked=n;st.ok=shuffled[cur][n].k===KYSIMUSED[order[cur]].c;
  render();renderBar();$('next').focus();
}
function next(){
  if(state.every(s=>s.picked!==null)){cur=order.length;renderBar();return render()}
  let n=cur+1;while(n<order.length&&state[n].picked!==null)n++;
  if(n>=order.length)n=state.findIndex(s=>s.picked===null);
  cur=n;render();renderBar();
}
function renderEnd(){
  $('pos').textContent=order.length;
  const ok=state.filter(s=>s.ok).length,tot=order.length,pct=Math.round(ok/tot*100);
  const grade=pct>=90?'Suurepärane! Peatüki põhimõisted on selged.':pct>=70?'Hea tulemus. Vaata valesti vastatud küsimused üle.':pct>=50?'Arvestatav, aga loe vastavad alapeatükid uuesti läbi.':'Loe peatükk uuesti läbi ja proovi siis veel kord.';
  const wrong=order.map((q,n)=>({q,n})).filter(x=>state[x.n].ok===false);
  let h='<p class="qnum">Tulemus</p><p class="big">'+ok+' / '+tot+'</p><p class="grade">'+pct+'% · '+grade+'</p>';
  if(wrong.length){
    h+='<p class="qnum" style="margin-top:1rem">Valesti vastatud</p><ul class="review">';
    wrong.forEach(x=>{const Q=KYSIMUSED[x.q];h+='<li>'+Q.q+'<br><span class="ans">Õige: '+Q.o[Q.c]+'</span></li>'});
    h+='</ul>';
  }
  h+='<div class="actions"><button class="btn" id="again">Alusta uuesti</button>'+(wrong.length?'<button class="btn primary" id="retry">Korda valesid ('+wrong.length+')</button>':'')+'</div>';
  $('card').innerHTML=h;
  $('again').onclick=()=>start(KYSIMUSED.map((_,i)=>i));
  if(wrong.length)$('retry').onclick=()=>start(wrong.map(x=>x.q));
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(cur<order.length&&state[cur].picked===null&&['1','2','3','4'].includes(e.key))pick(+e.key-1);
  else if(e.key==='Enter'&&cur<order.length&&state[cur].picked!==null){e.preventDefault();next()}
});
start(KYSIMUSED.map((_,i)=>i));
</script>
</body>
</html>
