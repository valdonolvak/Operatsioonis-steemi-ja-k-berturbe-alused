<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peatükk 15 – test: failisüsteemid</title>
<style>
:root{--bg:#fff;--card:#f6f5f1;--text:#1f1f1d;--muted:#6b6a65;--border:#d6d4cc;--accent:#185fa5;--accent-bg:#e6f1fb;
--ok:#3b6d11;--ok-bg:#eaf3de;--ok-line:#639922;--bad:#a32d2d;--bad-bg:#fcebeb;--bad-line:#e24b4a;--todo:#e4e2da;
--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--card:#262624;--text:#ecebe6;--muted:#a3a29c;--border:#44443f;--accent:#85b7eb;--accent-bg:#0c447c;
--ok:#c0dd97;--ok-bg:#27500a;--ok-line:#97c459;--bad:#f7c1c1;--bad-bg:#791f1f;--bad-line:#f09595;--todo:#3a3a37}}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);max-width:760px;margin:2rem auto;padding:0 1rem;line-height:1.6}
h1{font-size:22px;font-weight:500;margin:0 0 .25rem}
.sub{color:var(--muted);font-size:14px;margin:0 0 1.5rem}
nav a{color:var(--accent);font-size:14px}
code{font-family:var(--mono);font-size:.9em;background:var(--card);padding:0 4px;border-radius:4px}
.bar{display:flex;gap:3px;margin:0 0 .5rem}
.seg{flex:1;height:8px;border-radius:2px;background:var(--todo);border:0;padding:0;cursor:pointer}
.seg.ok{background:var(--ok-line)}.seg.bad{background:var(--bad-line)}.seg.cur{outline:2px solid var(--accent);outline-offset:1px}
.stats{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:0 0 1.5rem}
.stats b{color:var(--text);font-weight:500}
.card{background:var(--card);border-radius:12px;padding:1.25rem 1.5rem}
.qnum{font-size:13px;color:var(--muted);margin:0 0 .25rem}
.qtext{font-size:18px;font-weight:500;margin:0 0 1rem;line-height:1.5}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.7rem 1rem;margin:0 0 8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.opt.ok .k,.opt.bad .k{border-color:currentColor;color:inherit}
.opt.dim{opacity:.55}
.fb{margin:1rem 0 0;padding:.75rem 1rem;border-left:3px solid;border-radius:0;background:var(--bg);font-size:15px}
.fb.ok{border-color:var(--ok-line)}.fb.bad{border-color:var(--bad-line)}
.fb strong{display:block;margin-bottom:2px}
.fb.ok strong{color:var(--ok)}.fb.bad strong{color:var(--bad)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:8px;flex-wrap:wrap}
button.btn{font:inherit;font-size:15px;padding:.5rem 1.1rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.btn.primary{color:#042c53}}
button.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.big{font-size:40px;font-weight:500;margin:0}
.grade{font-size:18px;margin:.25rem 0 1rem}
.review{margin:1rem 0 0;padding:0;list-style:none}
.review li{padding:.6rem 0;border-top:1px solid var(--border);font-size:15px}
.review .ans{color:var(--ok);font-size:14px}
</style>
</head>
<body>
<nav><a href="https://github.com/valdonolvak/Operatsioonis-steemi-ja-k-berturbe-alused/blob/main/peatykid/15-failisusteemid.md">← Peatükk 15</a> · <a href="15-failisusteemid.html">Interaktiivne õpileht</a></nav>
<h1>Test: failisüsteemid</h1>
<p class="sub">Vali vastus ja näed kohe, kas see oli õige ning miks. Klaviatuuriga: <code>1</code>–<code>4</code> valib, <code>Enter</code> viib edasi.</p>

<div class="bar" id="bar" aria-label="Edenemine"></div>
<div class="stats"><span>Küsimus <b id="pos">1</b> / <b id="tot">0</b></span><span>Õigeid <b id="okc">0</b> · Valesid <b id="badc">0</b></span></div>

<div class="card" id="card" aria-live="polite"></div>

<script>
/* Küsimused: q = küsimus (HTML), o = vastusevariandid, c = õige variandi indeks (0-põhine), e = selgitus */
const KYSIMUSED=[
{"q": "Mis on failisüsteemi peamine ülesanne?", "o": ["Juhtida ekraani", "Pidada meeles, millistes plokkides fail asub, mis on tema nimi, omanik ja õigused", "Kiirendada protsessorit", "Hallata võrguühendusi"], "c": 1, "e": "Ketas teab ainult nummerdatud plokke; failisüsteem on nagu raamatukogu kataloog."},
{"q": "Miks võtab 1-baidine fail kettal 4 KB ruumi?", "o": ["Failisüsteem annab failile ruumi terve klastri kaupa", "Failinimi võtab 4 KB", "Windows lisab igale failile varukoopia", "Ketas ei saa väiksemaid faile salvestada"], "c": 0, "e": "Klaster on väikseim ühik, mille failisüsteem failile annab. Raisatud osa on sisemine killustumine."},
{"q": "Mida näitab FAT-tabeli lahter?", "o": ["Faili nime", "Faili omanikku", "Faili loomise aega", "Milline klaster tuleb failis järgmisena"], "c": 3, "e": "Fail on ahel: FAT[5] = 8, FAT[8] = 9, FAT[9] = EOF."},
{"q": "Mis juhtub FAT-is faili kustutamisel?", "o": ["Fail teisaldatakse pilve", "Ketas vormindatakse", "Kaustakirje märgitakse kustutatuks ja klastrid vabaks, kuid andmed jäävad kettale", "Andmed kirjutatakse nullidega üle"], "c": 2, "e": "Seepärast saavad taastetööriistad kustutatud faile sageli tagasi tuua, kui klastreid pole üle kirjutatud."},
{"q": "Mis on FAT32 ühe faili maksimumsuurus?", "o": ["2 TB", "4 GB", "2 GB", "16 GB"], "c": 1, "e": "6 GB video ei mahu FAT32-pulgale. Lahendus on exFAT."},
{"q": "Miks sobib exFAT USB-pulgale, mida kasutatakse Windowsis, macOS-is ja Linuxis?", "o": ["Kõik kolm loevad ja kirjutavad seda ning see lubab üle 4 GB faile", "Sellel on kõige paremad õigused", "See on krüpteeritud", "See on kõige uuem"], "c": 0, "e": "NTFS-ile macOS vaikimisi ei kirjuta, FAT32 ei luba suuri faile."},
{"q": "Mis on NTFS-i MFT?", "o": ["Muudatuste päevik", "Varikoopiate loend", "Kettakvootide tabel", "Tabel, kus on kirje iga faili ja kausta kohta"], "c": 3, "e": "MFT kirjes on nimi, ajad, õigused ja viited klastritele; väikeste failide sisu mahub otse kirjesse."},
{"q": "Mida teeb NTFS-i logi ($LogFile)?", "o": ["Hoiab kustutatud faile", "Logib võrguliiklust", "Kirjutab metaandmete muudatuse kavatsuse enne muudatust, et krahhi järel ühtlane olek taastada", "Salvestab kasutajate sisselogimised"], "c": 2, "e": "Seepärast ei vaja NTFS pärast iga krahhi chkdsk-i."},
{"q": "Mis on alternatiivne andmevoog Zone.Identifier?", "o": ["Faili pisipilt", "Märge („Mark of the Web“), et fail tuli internetist", "Faili varukoopia", "Krüpteerimisvõti"], "c": 1, "e": "Selle alusel avab Word faili kaitstud vaates ja SmartScreen hoiatab. FAT32-le kopeerides voog kaob."},
{"q": "Mis juhtub Windowsis, kui kustutad faili tavalise Delete-klahviga?", "o": ["Fail teisaldatakse kausta $Recycle.Bin ja nimetatakse ümber $R…-failiks", "MFT kirje kustutatakse kohe", "Andmed kirjutatakse nullidega üle", "Fail laaditakse OneDrive’i"], "c": 0, "e": "Andmeid ei muudeta – seepärast on prügikasti kustutamine hetkeline ka suure faili korral."},
{"q": "Miks saab HDD-lt „jäädavalt“ kustutatud faili sageli taastada, SSD-lt aga tavaliselt mitte?", "o": ["SSD-l pole failisüsteemi", "HDD-l on prügikast riistvaras", "SSD krüpteerib alati kõik", "SSD-le saadetakse TRIM-käsk ja SSD kustutab vabad plokid ise"], "c": 3, "e": "HDD-l jääb vana sisu alles, kuni see üle kirjutatakse."},
{"q": "Kuidas kaitsta kustutatud andmeid taastamise eest, kui arvuti antakse ära?", "o": ["Kustutada failid Shift+Delete-ga", "Nimetada failid ümber", "Kasutada ketta krüpteerimist (nt BitLocker) või ketas turvaliselt tühjendada", "Tühjendada prügikast"], "c": 2, "e": "Krüpteeritud kettalt taastatud plokid on ilma võtmeta loetamatud. cipher /w kirjutab vaba ruumi üle."},
{"q": "Mis on ReFS-i terviklikkusvoogude eesmärk?", "o": ["Jälgida kvoote", "Tuvastada kontrollsummadega vaikne andmeriknemine", "Krüpteerida faile", "Tihendada faile"], "c": 1, "e": "Storage Spaces peegliga parandatakse riknenud andmed automaatselt."},
{"q": "Miks ei tehta SSD-l killustatuse eemaldamist?", "o": ["SSD pöördumisaeg ei sõltu andmete asukohast", "SSD ei saa killustuda", "Windows ei toeta SSD-sid", "Killustatuse eemaldamine kustutab andmed"], "c": 0, "e": "SSD-le saadetakse ainult TRIM-käske."},
{"q": "Mis on Linuxi inode?", "o": ["Kataloogi nimi", "Ketta partitsioon", "Protsessi number", "Kirje, mis hoiab faili metaandmeid (omanik, õigused, suurus, plokid), kuid mitte nime"], "c": 3, "e": "Nimi on ainult kataloogis, mis seob nime inode’i numbriga."},
{"q": "Mida teeb Linuxis käsk rm?", "o": ["Kirjutab faili nullidega üle", "Krüpteerib faili", "Eemaldab nime kataloogist; fail kaob, kui ühtegi nime pole ja keegi seda lahti ei hoia", "Teisaldab faili prügikasti"], "c": 2, "e": "rm ei kasuta prügikasti. Prügikasti kasutavad ainult graafilised töölauad (~/.local/share/Trash)."},
{"q": "Linuxi serveris kustutati 20 GB logifail, kuid df näitab ikka täis ketast. Mis on tõenäoline põhjus?", "o": ["Fail läks prügikasti", "Mõni protsess hoiab faili endiselt lahti, nii et inode ja plokid on alles", "rm ei tööta suurte failidega", "Ketas on rikkis"], "c": 1, "e": "lsof +L1 näitab kustutatud, kuid avatud faile. Ruum vabaneb, kui protsess faili sulgeb."},
{"q": "Mida tähendab ext4-s kõvaviide (ln fail teine)?", "o": ["Samale inode’ile lisatakse teine nimi; mõlemad nimed on võrdsed", "Faili koopia uutes plokkides", "Otsetee, mis lakkab töötamast, kui originaal kustutatakse", "Faili krüpteeritud versioon"], "c": 0, "e": "Inode’i viidete arv suureneb. Fail kaob alles siis, kui viimane nimi on kustutatud."},
{"q": "Mida tähendab chmod 640 aruanne.txt?", "o": ["Kõik saavad kõike teha", "Ainult omanik saab käivitada", "Fail on peidetud", "Omanik saab lugeda ja muuta, grupp lugeda, teised mitte midagi"], "c": 3, "e": "6 = r(4) + w(2), 4 = r, 0 = mitte midagi. ls -l näitab -rw-r-----."},
{"q": "Miks on chmod 777 ohtlik?", "o": ["Fail muutub nähtamatuks", "Fail krüpteeritakse", "Kõik süsteemi kasutajad saavad faili lugeda, muuta ja käivitada", "Fail kustutatakse"], "c": 2, "e": "„Tee 777, siis töötab“ on levinud turvaviga. Anna ainult vajalikud õigused."},
{"q": "Kas Linuxis saavad failid Kiri.txt ja kiri.txt olla samas kaustas?", "o": ["Ainult FAT32-l", "Jah, Linux eristab suur- ja väiketähti", "Ei, see on sama nimi", "Ainult juurkasutaja saab nii teha"], "c": 1, "e": "Windows ja macOS ei erista vaikimisi suur- ja väiketähti – kopeerimisel kirjutaks üks teise üle."},
{"q": "Mis on APFS-i kloon?", "o": ["Faili koopia, mis viitab samadele plokkidele ega võta kohe lisaruumi", "Varukoopia pilves", "Faili krüpteeritud versioon", "Peidetud süsteemifail"], "c": 0, "e": "Kui kloone muudetakse, kirjutatakse ainult muudetud plokid uude kohta (kirjutamisel kopeerimine)."},
{"q": "Miks ei pruugi Macis suure faili kustutamine vaba ruumi suurendada?", "o": ["macOS ei kustuta faile kunagi", "Prügikast on alati täis", "APFS ei toeta kustutamist", "Faili plokke võib hoida Time Machine’i kohalik hetktõmmis või kloon"], "c": 3, "e": "macOS näitab sellist ruumi „vabastatavana“ (purgeable). Sama juhtub Windowsis varikoopiatega."},
{"q": "Mis on macOS-is com.apple.quarantine?", "o": ["Prügikasti nimi", "Krüpteerimisvõti", "Laiendatud atribuut, mis märgib internetist alla laaditud faili; Gatekeeper kontrollib seda", "Viirusetõrje karantiinikaust"], "c": 2, "e": "See on Windowsi Mark of the Webi (Zone.Identifier) vaste. Vaadata saab käsuga xattr -l."},
{"q": "Mis on macOS-i Signed System Volume?", "o": ["Time Machine’i varukoopia", "Ainult lugemiseks süsteemiköide, mille terviklikkust kontrollitakse Apple’i allkirjaga", "Kasutaja andmete köide", "USB-pulga vorming"], "c": 1, "e": "Pahavara ei saa süsteemifaile märkamatult muuta; muudetud andmeid süsteem ei loe."}
];

const $=id=>document.getElementById(id);
let order=[],state=[],cur=0,shuffled=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(indexes){
  order=indexes;cur=0;
  state=order.map(()=>({picked:null,ok:null}));
  shuffled=order.map(i=>shuffle(KYSIMUSED[i].o.map((t,k)=>({t,k}))));
  $('tot').textContent=order.length;
  renderBar();render();
}
function renderBar(){
  const bar=$('bar');bar.innerHTML='';
  order.forEach((_,n)=>{const s=document.createElement('button');s.className='seg'+(state[n].ok===true?' ok':state[n].ok===false?' bad':'')+(n===cur?' cur':'');
    s.title='Küsimus '+(n+1);s.setAttribute('aria-label','Küsimus '+(n+1));s.onclick=()=>{cur=n;render();renderBar()};bar.appendChild(s)});
  $('okc').textContent=state.filter(s=>s.ok===true).length;
  $('badc').textContent=state.filter(s=>s.ok===false).length;
}
function render(){
  if(cur>=order.length)return renderEnd();
  $('pos').textContent=cur+1;
  const Q=KYSIMUSED[order[cur]],st=state[cur],opts=shuffled[cur],L='ABCD';
  let h='<p class="qnum">Küsimus '+(cur+1)+'</p><p class="qtext">'+Q.q+'</p>';
  opts.forEach((o,n)=>{
    let cls='opt';
    if(st.picked!==null){if(o.k===Q.c)cls+=' ok';else if(n===st.picked)cls+=' bad';else cls+=' dim'}
    h+='<button class="'+cls+'" data-n="'+n+'"'+(st.picked!==null?' disabled':'')+'><span class="k">'+L[n]+'</span><span>'+o.t+'</span></button>';
  });
  if(st.picked!==null){
    h+='<div class="fb '+(st.ok?'ok':'bad')+'"><strong>'+(st.ok?'Õige!':'Vale. Õige vastus: '+L[opts.findIndex(o=>o.k===Q.c)])+'</strong>'+Q.e+'</div>';
  }
  const answered=state.filter(s=>s.picked!==null).length;
  h+='<div class="actions"><button class="btn" id="prev"'+(cur===0?' disabled':'')+'>← Eelmine</button>';
  h+='<span class="hint">'+(st.picked===null?'Vali üks vastus':'')+'</span>';
  h+='<button class="btn primary" id="next"'+(st.picked===null?' disabled':'')+'>'+(answered===order.length?'Vaata tulemust':'Järgmine →')+'</button></div>';
  $('card').innerHTML=h;
  $('card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  $('prev').onclick=()=>{cur--;render();renderBar()};
  $('next').onclick=next;
}
function pick(n){
  const st=state[cur];if(st.picked!==null)return;
  st.picked=n;st.ok=shuffled[cur][n].k===KYSIMUSED[order[cur]].c;
  render();renderBar();$('next').focus();
}
function next(){
  if(state.every(s=>s.picked!==null)){cur=order.length;renderBar();return render()}
  let n=cur+1;while(n<order.length&&state[n].picked!==null)n++;
  if(n>=order.length)n=state.findIndex(s=>s.picked===null);
  cur=n;render();renderBar();
}
function renderEnd(){
  $('pos').textContent=order.length;
  const ok=state.filter(s=>s.ok).length,tot=order.length,pct=Math.round(ok/tot*100);
  const grade=pct>=90?'Suurepärane! Peatüki põhimõisted on selged.':pct>=70?'Hea tulemus. Vaata valesti vastatud küsimused üle.':pct>=50?'Arvestatav, aga loe vastavad alapeatükid uuesti läbi.':'Loe peatükk uuesti läbi ja proovi siis veel kord.';
  const wrong=order.map((q,n)=>({q,n})).filter(x=>state[x.n].ok===false);
  let h='<p class="qnum">Tulemus</p><p class="big">'+ok+' / '+tot+'</p><p class="grade">'+pct+'% · '+grade+'</p>';
  if(wrong.length){
    h+='<p class="qnum" style="margin-top:1rem">Valesti vastatud</p><ul class="review">';
    wrong.forEach(x=>{const Q=KYSIMUSED[x.q];h+='<li>'+Q.q+'<br><span class="ans">Õige: '+Q.o[Q.c]+'</span></li>'});
    h+='</ul>';
  }
  h+='<div class="actions"><button class="btn" id="again">Alusta uuesti</button>'+(wrong.length?'<button class="btn primary" id="retry">Korda valesid ('+wrong.length+')</button>':'')+'</div>';
  $('card').innerHTML=h;
  $('again').onclick=()=>start(KYSIMUSED.map((_,i)=>i));
  if(wrong.length)$('retry').onclick=()=>start(wrong.map(x=>x.q));
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(cur<order.length&&state[cur].picked===null&&['1','2','3','4'].includes(e.key))pick(+e.key-1);
  else if(e.key==='Enter'&&cur<order.length&&state[cur].picked!==null){e.preventDefault();next()}
});
start(KYSIMUSED.map((_,i)=>i));
</script>
</body>
</html>
