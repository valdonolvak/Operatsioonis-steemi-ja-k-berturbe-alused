<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peatükk 12 – test: mäluhaldus</title>
<style>
:root{--bg:#fff;--card:#f6f5f1;--text:#1f1f1d;--muted:#6b6a65;--border:#d6d4cc;--accent:#185fa5;--accent-bg:#e6f1fb;
--ok:#3b6d11;--ok-bg:#eaf3de;--ok-line:#639922;--bad:#a32d2d;--bad-bg:#fcebeb;--bad-line:#e24b4a;--todo:#e4e2da;
--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--card:#262624;--text:#ecebe6;--muted:#a3a29c;--border:#44443f;--accent:#85b7eb;--accent-bg:#0c447c;
--ok:#c0dd97;--ok-bg:#27500a;--ok-line:#97c459;--bad:#f7c1c1;--bad-bg:#791f1f;--bad-line:#f09595;--todo:#3a3a37}}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);max-width:760px;margin:2rem auto;padding:0 1rem;line-height:1.6}
h1{font-size:22px;font-weight:500;margin:0 0 .25rem}
.sub{color:var(--muted);font-size:14px;margin:0 0 1.5rem}
nav a{color:var(--accent);font-size:14px}
code{font-family:var(--mono);font-size:.9em;background:var(--card);padding:0 4px;border-radius:4px}
.bar{display:flex;gap:3px;margin:0 0 .5rem}
.seg{flex:1;height:8px;border-radius:2px;background:var(--todo);border:0;padding:0;cursor:pointer}
.seg.ok{background:var(--ok-line)}.seg.bad{background:var(--bad-line)}.seg.cur{outline:2px solid var(--accent);outline-offset:1px}
.stats{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:0 0 1.5rem}
.stats b{color:var(--text);font-weight:500}
.card{background:var(--card);border-radius:12px;padding:1.25rem 1.5rem}
.qnum{font-size:13px;color:var(--muted);margin:0 0 .25rem}
.qtext{font-size:18px;font-weight:500;margin:0 0 1rem;line-height:1.5}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.7rem 1rem;margin:0 0 8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.opt.ok .k,.opt.bad .k{border-color:currentColor;color:inherit}
.opt.dim{opacity:.55}
.fb{margin:1rem 0 0;padding:.75rem 1rem;border-left:3px solid;border-radius:0;background:var(--bg);font-size:15px}
.fb.ok{border-color:var(--ok-line)}.fb.bad{border-color:var(--bad-line)}
.fb strong{display:block;margin-bottom:2px}
.fb.ok strong{color:var(--ok)}.fb.bad strong{color:var(--bad)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:8px;flex-wrap:wrap}
button.btn{font:inherit;font-size:15px;padding:.5rem 1.1rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.btn.primary{color:#042c53}}
button.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.big{font-size:40px;font-weight:500;margin:0}
.grade{font-size:18px;margin:.25rem 0 1rem}
.review{margin:1rem 0 0;padding:0;list-style:none}
.review li{padding:.6rem 0;border-top:1px solid var(--border);font-size:15px}
.review .ans{color:var(--ok);font-size:14px}
</style>
</head>
<body>
<nav><a href="https://github.com/valdonolvak/Operatsioonis-steemi-ja-k-berturbe-alused/blob/main/peatykid/12-maluhaldus.md">← Peatükk 12</a> · <a href="12-maluhaldus.html">Interaktiivne õpileht</a></nav>
<h1>Test: mäluhaldus</h1>
<p class="sub">Vali vastus ja näed kohe, kas see oli õige ning miks. Klaviatuuriga: <code>1</code>–<code>4</code> valib, <code>Enter</code> viib edasi.</p>

<div class="bar" id="bar" aria-label="Edenemine"></div>
<div class="stats"><span>Küsimus <b id="pos">1</b> / <b id="tot">0</b></span><span>Õigeid <b id="okc">0</b> · Valesid <b id="badc">0</b></span></div>

<div class="card" id="card" aria-live="polite"></div>

<script>
/* Küsimused: q = küsimus (HTML), o = vastusevariandid, c = õige variandi indeks (0-põhine), e = selgitus */
const KYSIMUSED=[
{"q": "Milline neist ei ole mäluhalduse põhieesmärk?", "o": ["Protsesside eraldamine ja kaitse", "Iga programm näeb oma pidevat aadressiruumi", "Võimalus kasutada rohkem mälu, kui on RAM-i", "Failide krüpteerimine kettal"], "c": 3, "e": "Mäluhaldus eraldab protsessid, lihtsustab programmeerimist ja laseb kasutada lehefaili. Failide krüpteerimine on failisüsteemi (nt BitLocker, EFS) ülesanne."},
{"q": "Mis vahe on saalimisel ja lehekülgedeks jaotamisel?", "o": ["Lehekülgedeks jaotamine kasutab ainult RAM-i", "Vahet pole", "Saalimine viib kettale terve protsessi, lehekülgedeks jaotamine üksikuid lehti", "Saalimine on uuem ja kiirem"], "c": 2, "e": "Terve protsessi kirjutamine on aeglane, sest liigutatakse ka osi, mida ei kasutata. Kaasaegne OS viib kettale ainult kasutamata lehti."},
{"q": "Mälus on vabad tükid 12 KB, 8 KB ja 10 KB, kuid 20 KB programm ei mahu. Mis see on?", "o": ["Mäluleke", "Väline killustumine", "Sisemine killustumine", "Leheviga"], "c": 1, "e": "Vaba mälu on kokku 30 KB, kuid see on laiali väikeste tükkidena. Lehekülgedeks jaotamine kaotab selle probleemi."},
{"q": "Programm vajab 9 KB ja saab kolm 4 KB lehte. Kuidas nimetatakse kasutamata 3 KB-d?", "o": ["Sisemine killustumine", "Väline killustumine", "Tööhulk", "Ootenimekiri"], "c": 0, "e": "Mälu on programmile antud, kuid jääb viimases lehes kasutamata."},
{"q": "Miks kaotab lehekülgedeks jaotamine välise killustumise?", "o": ["Lehed on alati 1 MB suurused", "Lehekülgedeks jaotamisel ei kasutata RAM-i", "OS tihendab kõik lehed", "Iga leht võib asuda suvalises vabas raamis, pidevat ala pole vaja"], "c": 3, "e": "Lehetabel seob RAM-is laiali olevad raamid üheks pidevaks virtuaalseks alaks."},
{"q": "Lehe suurus on 4 KB. Virtuaalaadress on 0x2A7F ja lehetabelis on leht 2 → raam 5. Mis on füüsiline aadress?", "o": ["0x7A7F", "0x5000", "0x5A7F", "0x2A75"], "c": 2, "e": "Lehe number (2) asendatakse raami numbriga (5), nihe 0xA7F jääb samaks."},
{"q": "Mis on MMU?", "o": ["Lehefaili nimi", "Protsessori mäluhaldusüksus, mis tõlgib virtuaalaadresse füüsilisteks", "Windowsi mälutihendaja", "Kõvaketta kontroller"], "c": 1, "e": "MMU (Memory Management Unit) kasutab tõlkimiseks lehetabeleid ja TLB-d."},
{"q": "Miks kasutab x64 mitmetasemelisi lehetabeleid?", "o": ["Ühetasemeline tabel 48-bitise aadressiruumi jaoks oleks liiga suur", "Et aadressid oleksid juhuslikud", "Et kasutada vähem protsessori tuumi", "Et lehefaili poleks vaja"], "c": 0, "e": "Ühetasemeline tabel võtaks iga protsessi kohta sadu gigabaite. Mitmetasemeline puu luuakse ainult kasutatud piirkondade jaoks."},
{"q": "Mitmeks osaks jaguneb x64 48-bitine virtuaalaadress 4 KB lehtede korral?", "o": ["Kaks 24-bitist osa", "Kolm 16-bitist osa", "Üks 36-bitine lehe number ja 12-bitine nihe ühes tabelis", "Neli 9-bitist indeksit ja 12-bitine nihe"], "c": 3, "e": "PML4, PDPT, PD ja PT indeksid (igaüks 9 bitti) ning 12-bitine nihe lehe sees."},
{"q": "Mis on TLB?", "o": ["Lehefail", "Tuumapinu", "Protsessoris olev viimaste aadressitõlgete vahemälu", "Failisüsteemi tabel"], "c": 2, "e": "TLB tabamuse korral ei pea protsessor lehetabeleid mälust lugema."},
{"q": "Mälupöördumine võtab 100 ns, TLB kontroll 1 ns ja tabeleid on 4. Kui kaua võtab TLB möödalask?", "o": ["105 ns", "501 ns", "101 ns", "401 ns"], "c": 1, "e": "1 ns (TLB) + 4 × 100 ns (neli tabelit) + 100 ns (andmed) = 501 ns. Tabamuse korral 101 ns."},
{"q": "Miks kasutavad andmebaasid ja hüperviisorid suuri lehti (2 MB)?", "o": ["Sama arvu TLB kirjetega kaetakse palju rohkem mälu ja TLB möödalaskmisi on vähem", "Suured lehed on turvalisemad", "Suured lehed ei vaja RAM-i", "Suured lehed kaotavad sisemise killustumise"], "c": 0, "e": "1536 kirjega TLB katab 4 KB lehtedega 6 MB, 2 MB lehtedega 3 GB."},
{"q": "Mis vahe on pehmel ja kõval leheveal?", "o": ["Pehme leheviga lõpetab programmi, kõva mitte", "Kõva leheviga tekib ainult HDD-l", "Vahet pole", "Pehme leheviga lahendatakse mälust, kõva leheviga nõuab kettalt lugemist"], "c": 3, "e": "Pehme leheviga: leht on nt ootenimekirjas. Kõva: leht loetakse lehefailist või EXE/DLL-failist, mis on tuhandeid kordi aeglasem."},
{"q": "Programm pöördub NULL-viida kaudu aadressile, mida pole eraldatud. Mis juhtub?", "o": ["OS annab programmile tühja lehe", "Arvuti taaskäivitub", "Mäluhaldur tuvastab lubamatu aadressi ja programm saab vea access violation", "Leht loetakse lehefailist"], "c": 2, "e": "Leheviga tekib, kuid mäluhaldur leiab, et aadress pole protsessile lubatud. Tavaliselt lõpetatakse programm."},
{"q": "Milline lehtede asendamise algoritm viib välja lehe, mida pole kõige kauem kasutatud?", "o": ["Juhuslik", "LRU", "FIFO", "Optimaalne"], "c": 1, "e": "LRU (least recently used) põhineb lokaalsusel. FIFO viib välja kõige varem tulnud lehe."},
{"q": "Miks ei saa optimaalset asendusalgoritmi päriselt kasutada?", "o": ["See vajab teadmist, milliseid lehti tulevikus vajatakse", "See on liiga aeglane", "See töötab ainult 3 raamiga", "See on patenditud"], "c": 0, "e": "Optimaalset algoritmi kasutatakse võrdlusalusena teiste algoritmide hindamiseks."},
{"q": "Mida teeb kella-algoritm (teise võimaluse algoritm) lehega, mille Accessed-bitt on 1?", "o": ["Viib lehe kohe välja", "Kirjutab lehe kohe lehefaili", "Tihendab lehe", "Nullib biti ja jätab lehe mällu (teine võimalus)"], "c": 3, "e": "Välja viiakse esimene leht, mille bitt on 0. Nii on kell LRU odav lähend."},
{"q": "Mis on Belady anomaalia?", "o": ["TLB tabamusmäär langeb suurte lehtedega", "Lehefail kasvab lõputult", "FIFO puhul võib rohkem raamidega tekkida rohkem lehevigu", "LRU on alati halvem kui FIFO"], "c": 2, "e": "Järjekord 1 2 3 4 1 2 5 1 2 3 4 5 annab FIFO-ga 3 raamiga 9 ja 4 raamiga 10 leheviga."},
{"q": "Mis on ülekoormus (thrashing)?", "o": ["Kõvaketta täitumine", "Olukord, kus aktiivsed lehed ei mahu RAM-i ja arvuti tegeleb peamiselt lehtede liigutamisega", "Protsessori ülekuumenemine", "Liiga paljude lõimede loomine"], "c": 1, "e": "OS viib välja lehe, mida kohe uuesti vaja on. Lahendus on vähem korraga töötavaid programme või rohkem RAM-i."},
{"q": "Mis vahe on mälu reserveerimisel ja eraldamisel (commit)?", "o": ["Reserveerimine võtab ainult aadressiruumi, eraldamine kasutab eraldatud mälu limiiti", "Reserveerimine võtab kohe RAM-i, eraldamine mitte", "Eraldamine on ainult 32-bitistes programmides", "Vahet pole"], "c": 0, "e": "Eraldamisel lubab OS, et mälu on olemas RAM-is või lehefailis. RAM-i võetakse alles siis, kui lehte esimest korda kasutatakse."},
{"q": "Millest koosneb Windowsi eraldatud mälu limiit (commit limit)?", "o": ["Ainult RAM", "Kõvaketta suurus", "128 TB", "RAM + lehefailid"], "c": 3, "e": "Kui eraldatud mälu (commit charge) jõuaks limiidini, ei anna Windows uut mälu ja rakendus saab vea. Seepärast ei tohi lehefaili keelata."},
{"q": "Mis on protsessi tööhulk (working set)?", "o": ["Lehefaili suurus", "Protsessi lõimede arv", "Protsessi lehed, mis on parajasti füüsilises mälus", "Protsessi kõik reserveeritud aadressid"], "c": 2, "e": "Mälupuuduses vähendab tööhulga haldur tööhulki ja eemaldatud lehed lähevad ootele või muudetud nimekirja."},
{"q": "Ressursimonitor näitab, et vaba mälu on vaid 200 MB, kuid ootel (standby) on 5 GB. Kas see on probleem?", "o": ["Jah, tuleb keelata SysMain", "Ei – ootel olev mälu on vahemälu, mida saab kohe vabastada", "Jah, arvuti jookseb kohe kokku", "Jah, lehefail tuleb kustutada"], "c": 1, "e": "Windowsi põhimõte on: kasutamata RAM on raisatud RAM. Ootenimekirjast saab lehti kiiresti teistele anda."},
{"q": "Miks tihendab Windows lehti mälus enne lehefaili kirjutamist?", "o": ["Tihendatud lehe lahtipakkimine RAM-ist on palju kiirem kui kettalt lugemine", "Et lehefail oleks krüpteeritud", "Et TLB oleks suurem", "Et protsessor kasutaks vähem voolu"], "c": 0, "e": "Tihendatud lehti hoiab protsess Memory Compression. Tavaliselt mahub 3–4 lehte ühe asemele."},
{"q": "Mille vastu kaitseb DEP (NX)?", "o": ["Moodulite ennustatavate aadresside vastu", "Mälulekete vastu", "Lehefaili varguse vastu", "Pinusse või kuhja kirjutatud koodi käivitamise vastu"], "c": 3, "e": "Andmelehed märgitakse mittekäivitatavaks. Ennustatavate aadresside vastu aitab ASLR."}
];

const $=id=>document.getElementById(id);
let order=[],state=[],cur=0,shuffled=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(indexes){
  order=indexes;cur=0;
  state=order.map(()=>({picked:null,ok:null}));
  shuffled=order.map(i=>shuffle(KYSIMUSED[i].o.map((t,k)=>({t,k}))));
  $('tot').textContent=order.length;
  renderBar();render();
}
function renderBar(){
  const bar=$('bar');bar.innerHTML='';
  order.forEach((_,n)=>{const s=document.createElement('button');s.className='seg'+(state[n].ok===true?' ok':state[n].ok===false?' bad':'')+(n===cur?' cur':'');
    s.title='Küsimus '+(n+1);s.setAttribute('aria-label','Küsimus '+(n+1));s.onclick=()=>{cur=n;render();renderBar()};bar.appendChild(s)});
  $('okc').textContent=state.filter(s=>s.ok===true).length;
  $('badc').textContent=state.filter(s=>s.ok===false).length;
}
function render(){
  if(cur>=order.length)return renderEnd();
  $('pos').textContent=cur+1;
  const Q=KYSIMUSED[order[cur]],st=state[cur],opts=shuffled[cur],L='ABCD';
  let h='<p class="qnum">Küsimus '+(cur+1)+'</p><p class="qtext">'+Q.q+'</p>';
  opts.forEach((o,n)=>{
    let cls='opt';
    if(st.picked!==null){if(o.k===Q.c)cls+=' ok';else if(n===st.picked)cls+=' bad';else cls+=' dim'}
    h+='<button class="'+cls+'" data-n="'+n+'"'+(st.picked!==null?' disabled':'')+'><span class="k">'+L[n]+'</span><span>'+o.t+'</span></button>';
  });
  if(st.picked!==null){
    h+='<div class="fb '+(st.ok?'ok':'bad')+'"><strong>'+(st.ok?'Õige!':'Vale. Õige vastus: '+L[opts.findIndex(o=>o.k===Q.c)])+'</strong>'+Q.e+'</div>';
  }
  const answered=state.filter(s=>s.picked!==null).length;
  h+='<div class="actions"><button class="btn" id="prev"'+(cur===0?' disabled':'')+'>← Eelmine</button>';
  h+='<span class="hint">'+(st.picked===null?'Vali üks vastus':'')+'</span>';
  h+='<button class="btn primary" id="next"'+(st.picked===null?' disabled':'')+'>'+(answered===order.length?'Vaata tulemust':'Järgmine →')+'</button></div>';
  $('card').innerHTML=h;
  $('card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  $('prev').onclick=()=>{cur--;render();renderBar()};
  $('next').onclick=next;
}
function pick(n){
  const st=state[cur];if(st.picked!==null)return;
  st.picked=n;st.ok=shuffled[cur][n].k===KYSIMUSED[order[cur]].c;
  render();renderBar();$('next').focus();
}
function next(){
  if(state.every(s=>s.picked!==null)){cur=order.length;renderBar();return render()}
  let n=cur+1;while(n<order.length&&state[n].picked!==null)n++;
  if(n>=order.length)n=state.findIndex(s=>s.picked===null);
  cur=n;render();renderBar();
}
function renderEnd(){
  $('pos').textContent=order.length;
  const ok=state.filter(s=>s.ok).length,tot=order.length,pct=Math.round(ok/tot*100);
  const grade=pct>=90?'Suurepärane! Peatüki põhimõisted on selged.':pct>=70?'Hea tulemus. Vaata valesti vastatud küsimused üle.':pct>=50?'Arvestatav, aga loe vastavad alapeatükid uuesti läbi.':'Loe peatükk uuesti läbi ja proovi siis veel kord.';
  const wrong=order.map((q,n)=>({q,n})).filter(x=>state[x.n].ok===false);
  let h='<p class="qnum">Tulemus</p><p class="big">'+ok+' / '+tot+'</p><p class="grade">'+pct+'% · '+grade+'</p>';
  if(wrong.length){
    h+='<p class="qnum" style="margin-top:1rem">Valesti vastatud</p><ul class="review">';
    wrong.forEach(x=>{const Q=KYSIMUSED[x.q];h+='<li>'+Q.q+'<br><span class="ans">Õige: '+Q.o[Q.c]+'</span></li>'});
    h+='</ul>';
  }
  h+='<div class="actions"><button class="btn" id="again">Alusta uuesti</button>'+(wrong.length?'<button class="btn primary" id="retry">Korda valesid ('+wrong.length+')</button>':'')+'</div>';
  $('card').innerHTML=h;
  $('again').onclick=()=>start(KYSIMUSED.map((_,i)=>i));
  if(wrong.length)$('retry').onclick=()=>start(wrong.map(x=>x.q));
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(cur<order.length&&state[cur].picked===null&&['1','2','3','4'].includes(e.key))pick(+e.key-1);
  else if(e.key==='Enter'&&cur<order.length&&state[cur].picked!==null){e.preventDefault();next()}
});
start(KYSIMUSED.map((_,i)=>i));
</script>
</body>
