<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">

<title>Peatükk 19 – test: kui Windows jookseb kokku</title>
<style>
:root{--bg:#fff;--card:#f6f5f1;--text:#1f1f1d;--muted:#6b6a65;--border:#d6d4cc;--accent:#185fa5;--accent-bg:#e6f1fb;
--ok:#3b6d11;--ok-bg:#eaf3de;--ok-line:#639922;--bad:#a32d2d;--bad-bg:#fcebeb;--bad-line:#e24b4a;--todo:#e4e2da;
--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--card:#262624;--text:#ecebe6;--muted:#a3a29c;--border:#44443f;--accent:#85b7eb;--accent-bg:#0c447c;
--ok:#c0dd97;--ok-bg:#27500a;--ok-line:#97c459;--bad:#f7c1c1;--bad-bg:#791f1f;--bad-line:#f09595;--todo:#3a3a37}}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);max-width:760px;margin:2rem auto;padding:0 1rem;line-height:1.6}
h1{font-size:22px;font-weight:500;margin:0 0 .25rem}
.sub{color:var(--muted);font-size:14px;margin:0 0 1.5rem}
nav a{color:var(--accent);font-size:14px}
code{font-family:var(--mono);font-size:.9em;background:var(--card);padding:0 4px;border-radius:4px}
.bar{display:flex;gap:3px;margin:0 0 .5rem}
.seg{flex:1;height:8px;border-radius:2px;background:var(--todo);border:0;padding:0;cursor:pointer}
.seg.ok{background:var(--ok-line)}.seg.bad{background:var(--bad-line)}.seg.cur{outline:2px solid var(--accent);outline-offset:1px}
.stats{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:0 0 1.5rem}
.stats b{color:var(--text);font-weight:500}
.card{background:var(--card);border-radius:12px;padding:1.25rem 1.5rem}
.qnum{font-size:13px;color:var(--muted);margin:0 0 .25rem}
.qtext{font-size:18px;font-weight:500;margin:0 0 1rem;line-height:1.5}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.7rem 1rem;margin:0 0 8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.opt.ok .k,.opt.bad .k{border-color:currentColor;color:inherit}
.opt.dim{opacity:.55}
.fb{margin:1rem 0 0;padding:.75rem 1rem;border-left:3px solid;border-radius:0;background:var(--bg);font-size:15px}
.fb.ok{border-color:var(--ok-line)}.fb.bad{border-color:var(--bad-line)}
.fb strong{display:block;margin-bottom:2px}
.fb.ok strong{color:var(--ok)}.fb.bad strong{color:var(--bad)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:8px;flex-wrap:wrap}
button.btn{font:inherit;font-size:15px;padding:.5rem 1.1rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.btn.primary{color:#042c53}}
button.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.big{font-size:40px;font-weight:500;margin:0}
.grade{font-size:18px;margin:.25rem 0 1rem}
.review{margin:1rem 0 0;padding:0;list-style:none}
.review li{padding:.6rem 0;border-top:1px solid var(--border);font-size:15px}
.review .ans{color:var(--ok);font-size:14px}
</style>

<body>
<nav><a href="https://github.com/valdonolvak/Operatsioonis-steemi-ja-k-berturbe-alused/blob/main/peatykid/19-krahhid.md">← Peatükk 19</a> · <a href="19-krahhid.html">Interaktiivne õpileht</a></nav>
<h1>Test: kui Windows jookseb kokku</h1>
<p class="sub">Vali vastus ja näed kohe, kas see oli õige ning miks. Klaviatuuriga: <code>1</code>–<code>4</code> valib, <code>Enter</code> viib edasi.</p>

<div class="bar" id="bar" aria-label="Edenemine"></div>
<div class="stats"><span>Küsimus <b id="pos">1</b> / <b id="tot">0</b></span><span>Õigeid <b id="okc">0</b> · Valesid <b id="badc">0</b></span></div>

<div class="card" id="card" aria-live="polite"></div>

<script>
/* Küsimused: q = küsimus (HTML), o = vastusevariandid, c = õige variandi indeks (0-põhine), e = selgitus */
const KYSIMUSED=[{"q": "Mis on bugcheck?", "o": ["Planeeritud taaskäivitus", "Windowsi peatumine tuumaviga tõttu, mida ei saa ohutult parandada", "Rakenduse sulgemine", "Viirusetõrje skannimine"], "c": 1, "e": "Bugcheck (rahvakeeles sinine/must ekraan) peatab kogu süsteemi, kui tuumas tekib viga, mis ohustab andmeid või turvet."}, {"q": "Miks ei jätka Windows tööd pärast tuumaviga?", "o": ["Rikutud tuumamälu võib kahjustada kettal olevaid andmeid või avada turvaaugu", "Windows tahab kasutajat karistada", "Litsents nõuab seda", "Et säästa voolu"], "c": 0, "e": "Peatamine on väiksem kahju kui rikutud olekus jätkamine."}, {"q": "Excel sulgub ootamatult, kuid Windows töötab edasi. Milline sündmus logis seda kirjeldab?", "o": ["1001 BugCheck", "41 Kernel-Power", "1074", "1000 Application Error"], "c": 3, "e": "Rakenduse krahh lõpetab ainult selle protsessi ja logitakse Application-logisse sündmusena 1000."}, {"q": "Mida ütleb peatuskood?", "o": ["Kasutaja nime", "Krahhi kellaaja", "Vea liigi", "Täpse süüdlase faili"], "c": 2, "e": "Kood ütleb vea tüübi (nt draiver pöördus vale mälu poole). Süüdlase leiad tõmmisest (IMAGE_NAME)."}, {"q": "Millele viitab 0xD1 DRIVER_IRQL_NOT_LESS_OR_EQUAL?", "o": ["Kasutaja vajutas Ctrl+Scroll Lock", "Draiver pöördus vale mälu poole liiga kõrgel IRQL-il", "Kõvaketas on täis", "Protsessor on üle kuumenenud"], "c": 1, "e": "Kõrgel IRQL-il ei tohi kasutada lehefaili. Peaaegu alati draiveri programmeerimisviga."}, {"q": "Millele viitab 0x124 WHEA_UNCORRECTABLE_ERROR?", "o": ["Riistvara teatas parandamatust veast", "Vigane Wi-Fi draiver", "Windowsi uuendus", "Viirus"], "c": 0, "e": "WHEA = Windows Hardware Error Architecture. Kontrolli protsessorit, RAM-i, temperatuure ja kiirendamist."}, {"q": "Mis on 0xE2 MANUALLY_INITIATED_CRASH?", "o": ["Kasutaja kustutas süsteemifaili", "Toitekatkestus", "Mälu on täis", "Meelega tekitatud krahh (nt Ctrl + Scroll Lock ×2)"], "c": 3, "e": "CrashOnCtrlScroll registriväärtuse abil saab krahhi tekitada testimiseks või hangunud süsteemist tõmmise saamiseks."}, {"q": "Kuhu kirjutab Windows mälutõmmise krahhi ajal?", "o": ["Pilve", "USB-pulgale", "Lehefaili asukohta kettal, järgmisel käivitusel kopeeritakse MEMORY.DMP-sse", "Otse tavalise failina NTFS-i kaudu"], "c": 2, "e": "Failisüsteem võib olla rikutud, seepärast kasutatakse eraldi dump-draiverit, mis kirjutab ette teada lehefaili sektoritesse."}, {"q": "Süsteemikettal pole lehefaili. Mis juhtub krahhi korral?", "o": ["Windows loob lehefaili krahhi ajal", "Tõmmist ei teki (kui pole seadistatud DedicatedDumpFile)", "Tõmmis kirjutatakse töölauale", "Krahhi ei teki"], "c": 1, "e": "Ilma lehefailita pole kohta, kuhu tõmmis kirjutada. Sündmus 1001 tekib, kuid MEMORY.DMP puudub."}, {"q": "Milline on vaikimisi tõmmise tüüp?", "o": ["Automaatne mälutõmmis", "Täielik mälutõmmis", "Väike mälutõmmis", "Tõmmist ei salvestata"], "c": 0, "e": "Automaatne sisaldab tuumamälu ja Windows haldab lehefaili suurust ise."}, {"q": "Milline tõmmise tüüp sobib Hyper-V hostile?", "o": ["Täielik", "Ei ühtegi", "Väike, sest see on alati parim", "Aktiivne – jätab külaliste VM-ide mälu välja"], "c": 3, "e": "Täielik tõmmis sisaldaks kõigi VM-ide mälu ja oleks väga suur."}, {"q": "Miks on täielik mälutõmmis tundlik?", "o": ["See on krüpteeritud", "See kustutab andmed", "See võib sisaldada paroole, võtmeid ja dokumentide sisu", "See sisaldab viirust"], "c": 2, "e": "Tõmmis on mälu koopia. BitLocker kaitseb seda ainult kettal – mujale kopeeritud fail on loetav."}, {"q": "Milline WinDbg käsk teeb krahhi automaatse analüüsi?", "o": ["!locks", "!analyze -v", "lm", "g"], "c": 1, "e": "!analyze -v näitab BUGCHECK_CODE, parameetrid, pinu ja tõenäolise süüdlase (IMAGE_NAME)."}, {"q": "WinDbg näitab IMAGE_NAME: netwtw10.sys. Millega saad näha selle draiveri versiooni ja kuupäeva?", "o": ["lmvm netwtw10", "!irql", "k", "help"], "c": 0, "e": "lmvm (list modules verbose) näitab mooduli failitee, ajatempli, tootja ja versiooni."}, {"q": "Viis tõmmist samast arvutist: erinevad peatuskoodid ja iga kord erinev süüdlane, sh ntoskrnl.exe. Mis on kõige tõenäolisem?", "o": ["Üks vigane draiver", "Windowsi tuum on vigane", "Kasutaja viga", "Riistvara (nt vigane RAM)"], "c": 3, "e": "Juhuslik muster viitab riistvarale. ntoskrnl.exe sageli ainult avastab vea. Käivita mälutest."}, {"q": "Logis on sündmus 41 Kernel-Power, kuid pole sündmust 1001 ega tõmmist (lehefail on olemas). Mis on tõenäoline põhjus?", "o": ["Windowsi uuendus", "Rakenduse krahh", "Toitekatkestus või ülekuumenemine", "Vigane graafikadraiver"], "c": 2, "e": "Windows ei jõudnud krahhi registreerida – arvuti kustus hetkega."}, {"q": "Milline sündmus näitab planeeritud taaskäivitust (nt Windows Update)?", "o": ["6008", "1074", "41", "1001"], "c": 1, "e": "1074 kirjeldab, milline protsess ja miks taaskäivituse algatas."}, {"q": "Krahhid kaovad, kui Windows käivitatakse turvarežiimis. Mida see näitab?", "o": ["Süüdlane on tõenäoliselt kolmanda osapoole draiver või programm", "Riistvara on kindlasti vigane", "Windows tuleb uuesti paigaldada", "Ketas on täis"], "c": 0, "e": "Turvarežiim laadib ainult Microsofti põhidraiverid ja -teenused."}, {"q": "Mis on Driver Verifier?", "o": ["Draiverite allalaadimise teenus", "Viirusetõrje", "Ketta kontrollija", "Tööriist, mis kontrollib valitud draivereid rangelt ja tekitab krahhi kohe vea korral"], "c": 3, "e": "verifier.exe aitab peidetud draiveri vea kinni püüda. Lülitatakse välja käsuga verifier /reset."}, {"q": "Miks jäid CrowdStrike’i juhtumil (2024) arvutid käivitustsüklisse?", "o": ["Windows Update kustutas süsteemifailid", "Kasutajad unustasid paroolid", "Vigast sisufaili lugev tuumadraiver laaditi iga käivituse alguses uuesti", "Kõvakettad läksid rikki"], "c": 2, "e": "csagent.sys on boot-start draiver; vigane sisufail põhjustas mälust väljaspool massiivi lugemise ja krahhi (0x50) iga käivitusega."}, {"q": "Mis tegi CrowdStrike’i juhtumi parandamise eriti aeganõudvaks?", "o": ["Internet oli maas", "Iga arvuti tuli käsitsi parandada ja BitLockeri tõttu oli vaja iga arvuti taastevõtit", "Parandust ei olnud olemas", "Arvutid tuli välja vahetada"], "c": 1, "e": "Turvarežiimis või Windows RE-s vigase faili kustutamiseks oli vaja BitLockeri taastevõtit."}, {"q": "Millal avaneb Windows RE automaatselt?", "o": ["Pärast kahte järjestikust ebaõnnestunud käivitust", "Iga käivitusega", "Ainult BIOS-ist", "Kord kuus"], "c": 0, "e": "Käsitsi: Shift + Taaskäivita, shutdown /r /o /t 0 või Sätted → Taaste."}, {"q": "Mis on kiire masinataaste (QMR)?", "o": ["BIOS-i lähtestamine", "Ketta kloonimine", "Mälu tihendamine", "Windows RE loob võrguühenduse ja laadib Windows Update’ist sihitud paranduse"], "c": 3, "e": "QMR loodi pärast CrowdStrike’i juhtumit, et laialdasi käivitusprobleeme saaks parandada kaugelt."}, {"q": "Milline on QMR-i vaikimisi olek domeeniga liidetud ettevõtte arvutis?", "o": ["Ei ole saadaval", "Sees ainult nädalavahetusel", "Väljas, kuni IT selle lubab (Intune, reagentc)", "Alati sees"], "c": 2, "e": "Home ja haldamata Pro arvutites on QMR vaikimisi sees, ettevõtte hallatud arvutites tuleb see lubada."}, {"q": "Mis on Linuxis kdump?", "o": ["Paketihaldur", "Mehhanism, mis tuuma paanika korral käivitab teise tuuma ja salvestab mälu", "Ketta defragmentija", "Tulemüür"], "c": 1, "e": "Sama idee mis Windowsi eraldi dump-draiveril: rikutud tuuma ei usaldata mälu salvestamisel."}];

const $=id=>document.getElementById(id);
let order=[],state=[],cur=0,shuffled=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(indexes){
  order=indexes;cur=0;
  state=order.map(()=>({picked:null,ok:null}));
  shuffled=order.map(i=>shuffle(KYSIMUSED[i].o.map((t,k)=>({t,k}))));
  $('tot').textContent=order.length;
  renderBar();render();
}
function renderBar(){
  const bar=$('bar');bar.innerHTML='';
  order.forEach((_,n)=>{const s=document.createElement('button');s.className='seg'+(state[n].ok===true?' ok':state[n].ok===false?' bad':'')+(n===cur?' cur':'');
    s.title='Küsimus '+(n+1);s.setAttribute('aria-label','Küsimus '+(n+1));s.onclick=()=>{cur=n;render();renderBar()};bar.appendChild(s)});
  $('okc').textContent=state.filter(s=>s.ok===true).length;
  $('badc').textContent=state.filter(s=>s.ok===false).length;
}
function render(){
  if(cur>=order.length)return renderEnd();
  $('pos').textContent=cur+1;
  const Q=KYSIMUSED[order[cur]],st=state[cur],opts=shuffled[cur],L='ABCD';
  let h='<p class="qnum">Küsimus '+(cur+1)+'</p><p class="qtext">'+Q.q+'</p>';
  opts.forEach((o,n)=>{
    let cls='opt';
    if(st.picked!==null){if(o.k===Q.c)cls+=' ok';else if(n===st.picked)cls+=' bad';else cls+=' dim'}
    h+='<button class="'+cls+'" data-n="'+n+'"'+(st.picked!==null?' disabled':'')+'><span class="k">'+L[n]+'</span><span>'+o.t+'</span></button>';
  });
  if(st.picked!==null){
    h+='<div class="fb '+(st.ok?'ok':'bad')+'"><strong>'+(st.ok?'Õige!':'Vale. Õige vastus: '+L[opts.findIndex(o=>o.k===Q.c)])+'</strong>'+Q.e+'</div>';
  }
  const answered=state.filter(s=>s.picked!==null).length;
  h+='<div class="actions"><button class="btn" id="prev"'+(cur===0?' disabled':'')+'>← Eelmine</button>';
  h+='<span class="hint">'+(st.picked===null?'Vali üks vastus':'')+'</span>';
  h+='<button class="btn primary" id="next"'+(st.picked===null?' disabled':'')+'>'+(answered===order.length?'Vaata tulemust':'Järgmine →')+'</button></div>';
  $('card').innerHTML=h;
  $('card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  $('prev').onclick=()=>{cur--;render();renderBar()};
  $('next').onclick=next;
}
function pick(n){
  const st=state[cur];if(st.picked!==null)return;
  st.picked=n;st.ok=shuffled[cur][n].k===KYSIMUSED[order[cur]].c;
  render();renderBar();$('next').focus();
}
function next(){
  if(state.every(s=>s.picked!==null)){cur=order.length;renderBar();return render()}
  let n=cur+1;while(n<order.length&&state[n].picked!==null)n++;
  if(n>=order.length)n=state.findIndex(s=>s.picked===null);
  cur=n;render();renderBar();
}
function renderEnd(){
  $('pos').textContent=order.length;
  const ok=state.filter(s=>s.ok).length,tot=order.length,pct=Math.round(ok/tot*100);
  const grade=pct>=90?'Suurepärane! Peatüki põhimõisted on selged.':pct>=70?'Hea tulemus. Vaata valesti vastatud küsimused üle.':pct>=50?'Arvestatav, aga loe vastavad alapeatükid uuesti läbi.':'Loe peatükk uuesti läbi ja proovi siis veel kord.';
  const wrong=order.map((q,n)=>({q,n})).filter(x=>state[x.n].ok===false);
  let h='<p class="qnum">Tulemus</p><p class="big">'+ok+' / '+tot+'</p><p class="grade">'+pct+'% · '+grade+'</p>';
  if(wrong.length){
    h+='<p class="qnum" style="margin-top:1rem">Valesti vastatud</p><ul class="review">';
    wrong.forEach(x=>{const Q=KYSIMUSED[x.q];h+='<li>'+Q.q+'<br><span class="ans">Õige: '+Q.o[Q.c]+'</span></li>'});
    h+='</ul>';
  }
  h+='<div class="actions"><button class="btn" id="again">Alusta uuesti</button>'+(wrong.length?'<button class="btn primary" id="retry">Korda valesid ('+wrong.length+')</button>':'')+'</div>';
  $('card').innerHTML=h;
  $('again').onclick=()=>start(KYSIMUSED.map((_,i)=>i));
  if(wrong.length)$('retry').onclick=()=>start(wrong.map(x=>x.q));
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(cur<order.length&&state[cur].picked===null&&['1','2','3','4'].includes(e.key))pick(+e.key-1);
  else if(e.key==='Enter'&&cur<order.length&&state[cur].picked!==null){e.preventDefault();next()}
});
start(KYSIMUSED.map((_,i)=>i));
</script>
