<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.3224;0.3259;1"/><text x="244" y="198" font-size="10.5" font-weight="600" fill="#6b4bb5" text-anchor="start">L2: kompilaatori andmed</text></g>
<text x="244" y="216" font-size="10.5" font-weight="400" fill="#5b6578" text-anchor="start">oma L2-vahemälu</text>
