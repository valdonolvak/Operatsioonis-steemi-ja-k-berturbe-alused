<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" role="img" aria-label="Kuhu planeerija lõime paneb: P-tuumad, E-tuumad ja afiinsus" font-family="'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
