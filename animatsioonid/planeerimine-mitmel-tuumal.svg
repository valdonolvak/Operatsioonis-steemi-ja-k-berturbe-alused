<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7879;0.7914;0.85;0.8534;1"/><text x="436" y="198" font-size="10.5" font-weight="600" fill="#c2362b" text-anchor="start">L2: külm, andmeid tuuakse</text></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.8534;0.8569;1"/><text x="436" y="198" font-size="10.5" font-weight="600" fill="#2563a8" text-anchor="start">L2: Teamsi andmed (soe)</text></g>
<text x="436" y="216" font-size="10.5" font-weight="400" fill="#5b6578" text-anchor="start">oma L2-vahemälu</text>
<rect x="24" y="306" width="660" height="68" rx="8" fill="none" stroke="#b9c0cc" stroke-width="1.25"/>
<text x="38" y="325" font-size="10" font-weight="600" fill="#5b6578" text-anchor="start">VALMIS LÕIMED (ootavad protsessorit)</text>
<rect x="700" y="306" width="236" height="68" rx="8" fill="none" stroke="#b9c0cc" stroke-width="1.25"/>
<text x="714" y="325" font-size="10" font-weight="600" fill="#5b6578" text-anchor="start">OOTEL (ei vaja protsessorit)</text>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1293;0.1314;0.9948;0.9991;1"/><g><animateTransform attributeName="transform" type="translate" dur="58s" repeatCount="indefinite" values="110,350;110,350;110,350;88,134;88,134;818,350;818,350;88,134;88,134;818,350;818,350;472,134;472,134;472,134" keyTimes="0;0.1293;0.1552;0.1759;0.5259;0.5431;0.6034;0.6207;0.6638;0.681;0.7672;0.7879;0.9948;1"/><rect x="-32.0" y="-12" width="64" height="24" rx="5" fill="#2563a8"/><text x="0" y="4" font-size="10.5" font-weight="600" fill="#fff" text-anchor="middle">Teams</text></g></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.25;0.2521;0.9948;0.9991;1"/><g><animateTransform attributeName="transform" type="translate" dur="58s" repeatCount="indefinite" values="210,350;210,350;210,350;280,134;280,134;280,134" keyTimes="0;0.25;0.3017;0.3224;0.9948;1"/><rect x="-32.0" y="-12" width="64" height="24" rx="5" fill="#6b4bb5"/><text x="0" y="4" font-size="10.5" font-weight="600" fill="#fff" text-anchor="middle">kompil.</text></g></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3879;0.39;0.9948;0.9991;1"/><g><animateTransform attributeName="transform" type="translate" dur="58s" repeatCount="indefinite" values="310,350;310,350;310,350;660,134;660,134;660,134" keyTimes="0;0.3879;0.4224;0.4431;0.9948;1"/><rect x="-30.0" y="-12" width="60" height="24" rx="5" fill="#2e7d4f"/><text x="0" y="4" font-size="10.5" font-weight="600" fill="#fff" text-anchor="middle">OneDrive</text></g></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6897;0.6917;0.9948;0.9991;1"/><g><animateTransform attributeName="transform" type="translate" dur="58s" repeatCount="indefinite" values="110,350;110,350;110,350;88,134;88,134;88,134" keyTimes="0;0.6897;0.7069;0.7241;0.9948;1"/><rect x="-32.0" y="-12" width="64" height="24" rx="5" fill="#b26a00"/><text x="0" y="4" font-size="10.5" font-weight="600" fill="#fff" text-anchor="middle">brauser</text></g></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2655;0.2707;0.3741;0.3793;1"/><rect x="132" y="110" width="72" height="60" rx="6" fill="none" stroke="#c2362b" stroke-width="2.5" stroke-dasharray="5 4"/><text x="168" y="140" font-size="9.5" font-weight="600" fill="#c2362b" text-anchor="middle">sama tuum</text><text x="168" y="152" font-size="9.5" font-weight="600" fill="#c2362b" text-anchor="middle">kui Teams</text></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3931;0.3983;0.4172;0.4224;1"/><text x="310" y="354" font-size="10.5" font-weight="600" fill="#2e7d4f" text-anchor="middle">EcoQoS: taustatöö</text></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1345;0.1397;0.15;0.1552;1"/><text x="110" y="354" font-size="10.5" font-weight="600" fill="#2563a8" text-anchor="middle">kõrge QoS, esiplaan</text></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6207;0.6259;0.65;0.6552;1"/><rect x="40" y="78" width="176" height="162" rx="8" fill="#2e7d4f" fill-opacity="0.13" stroke="#2e7d4f" stroke-width="2.5"/></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6207;0.6259;0.65;0.6552;1"/><text x="204" y="99" font-size="10.5" font-weight="600" fill="#2e7d4f" text-anchor="end">vahemälu soe ✓</text></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7879;0.7931;0.8224;0.8276;1"/><rect x="424" y="78" width="176" height="162" rx="8" fill="#c2362b" fill-opacity="0.13" stroke="#c2362b" stroke-width="2.5"/></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.8448;0.85;1"/><rect x="700" y="110" width="64" height="60" rx="6" fill="#f4f6f9" stroke="#b9c0cc"/><text x="732" y="132" font-size="10" font-weight="600" fill="#5b6578" text-anchor="middle">pargitud</text><text x="732" y="145" font-size="9.5" font-weight="400" fill="#5b6578" text-anchor="middle">süvauni</text></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.8586;0.8638;1"/><rect x="772" y="110" width="64" height="60" rx="6" fill="#f4f6f9" stroke="#b9c0cc"/><text x="804" y="132" font-size="10" font-weight="600" fill="#5b6578" text-anchor="middle">pargitud</text><text x="804" y="145" font-size="9.5" font-weight="400" fill="#5b6578" text-anchor="middle">süvauni</text></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.8724;0.8776;1"/><rect x="844" y="110" width="64" height="60" rx="6" fill="#f4f6f9" stroke="#b9c0cc"/><text x="876" y="132" font-size="10" font-weight="600" fill="#5b6578" text-anchor="middle">pargitud</text><text x="876" y="145" font-size="9.5" font-weight="400" fill="#5b6578" text-anchor="middle">süvauni</text></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0172;0.0224;0.0569;0.0621;1"/><rect x="40" y="78" width="560" height="162" rx="8" fill="#2563a8" fill-opacity="0.13" stroke="#2563a8" stroke-width="2.5"/></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0655;0.0707;0.1086;0.1138;1"/><rect x="616" y="78" width="304" height="162" rx="8" fill="#2e7d4f" fill-opacity="0.13" stroke="#2e7d4f" stroke-width="2.5"/></g>
<rect x="24" y="388" width="912" height="94" rx="8" fill="#ffffff" stroke="#b9c0cc"/>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.1164;0.1207;1"/><text x="40" y="412" font-size="11" font-weight="600" fill="#2563a8" text-anchor="start">Samm 1/7</text><text x="112" y="412" font-size="14" font-weight="600" fill="#1d2433" text-anchor="start">Hübriidprotsessor: P-tuumad, E-tuumad ja loogilised protsessorid</text><text x="40" y="434" font-size="12.5" font-weight="400" fill="#5b6578" text-anchor="start">Kiibis on kolm kiiret P-tuuma ja neli säästlikku E-tuuma. Igal P-tuumal on SMT, seega paistab ta Windowsile</text><text x="40" y="452" font-size="12.5" font-weight="400" fill="#5b6578" text-anchor="start">kahe loogilise protsessorina (LP). Kokku näeb Windows 10 loogilist protsessorit. Planeerija valib, kuhu lõim läheb.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1207;0.125;0.2371;0.2414;1"/><text x="40" y="412" font-size="11" font-weight="600" fill="#2563a8" text-anchor="start">Samm 2/7</text><text x="112" y="412" font-size="14" font-weight="600" fill="#1d2433" text-anchor="start">Esiplaani lõim läheb P-tuumale</text><text x="40" y="434" font-size="12.5" font-weight="400" fill="#5b6578" text-anchor="start">Teamsi videotöötlus on esiplaanil ja kõrge QoS-tasemega. Planeerija annab talle P-tuuma loogilise protsessori LP 0.</text><text x="40" y="452" font-size="12.5" font-weight="400" fill="#5b6578" text-anchor="start">Lõime andmed laaditakse selle tuuma L2-vahemällu: vahemälu on nüüd „soe“.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2414;0.2457;0.375;0.3793;1"/><text x="40" y="412" font-size="11" font-weight="600" fill="#2563a8" text-anchor="start">Samm 3/7</text><text x="112" y="412" font-size="14" font-weight="600" fill="#1d2433" text-anchor="start">Teine raske lõim: eri füüsilisele tuumale</text><text x="40" y="434" font-size="12.5" font-weight="400" fill="#5b6578" text-anchor="start">Kompilaatori lõim on samuti raske. LP 1 on vaba, kuid see on sama füüsiline tuum, kus töötab Teams: kaks lõime</text><text x="40" y="452" font-size="12.5" font-weight="400" fill="#5b6578" text-anchor="start">jagaksid ühe tuuma täitmisüksusi. Planeerija eelistab vaba füüsilist tuuma ja valib LP 2.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3793;0.3836;0.5129;0.5172;1"/><text x="40" y="412" font-size="11" font-weight="600" fill="#2563a8" text-anchor="start">Samm 4/7</text><text x="112" y="412" font-size="14" font-weight="600" fill="#1d2433" text-anchor="start">Taustatöö läheb E-tuumale</text><text x="40" y="434" font-size="12.5" font-weight="400" fill="#5b6578" text-anchor="start">OneDrive sünkroonib faile taustal ja tema lõim on tähistatud EcoQoS-tasemega: kiirus ei ole oluline, energia on.</text><text x="40" y="452" font-size="12.5" font-weight="400" fill="#5b6578" text-anchor="start">Planeerija paneb ta E-tuumale, mis töötab madalamal sagedusel. Aku kestab kauem ja P-tuumad jäävad vabaks.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5172;0.5216;0.6509;0.6552;1"/><text x="40" y="412" font-size="11" font-weight="600" fill="#2563a8" text-anchor="start">Samm 5/7</text><text x="112" y="412" font-size="14" font-weight="600" fill="#1d2433" text-anchor="start">Afiinsus: ärganud lõim läheb tagasi samale tuumale</text><text x="40" y="434" font-size="12.5" font-weight="400" fill="#5b6578" text-anchor="start">Teamsi lõim jääb hetkeks ootele (ootab võrgust andmeid). Kui ta ärkab, on LP 0 endiselt vaba ja tema andmed</text><text x="40" y="452" font-size="12.5" font-weight="400" fill="#5b6578" text-anchor="start">on selle tuuma vahemälus alles. Planeerija paneb ta tagasi samale tuumale: töö jätkub kohe täiskiirusel.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6552;0.6595;0.8233;0.8276;1"/><text x="40" y="412" font-size="11" font-weight="600" fill="#2563a8" text-anchor="start">Samm 6/7</text><text x="112" y="412" font-size="14" font-weight="600" fill="#1d2433" text-anchor="start">Kui eelistatud tuum on hõivatud, liigub lõim mujale</text><text x="40" y="434" font-size="12.5" font-weight="400" fill="#5b6578" text-anchor="start">Teams jääb jälle ootele ja vahepeal võtab LP 0 brauseri lõim. Kui Teams ärkab, ei oota ta: planeerija annab talle</text><text x="40" y="452" font-size="12.5" font-weight="400" fill="#5b6578" text-anchor="start">vaba P-tuuma LP 4. Hind on külm vahemälu: andmed tuleb uuesti mälust tuua ja esimesed hetked on aeglasemad.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="58s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.8276;0.8319;1"/><text x="40" y="412" font-size="11" font-weight="600" fill="#2563a8" text-anchor="start">Samm 7/7</text><text x="112" y="412" font-size="14" font-weight="600" fill="#1d2433" text-anchor="start">Tuumade parkimine</text><text x="40" y="434" font-size="12.5" font-weight="400" fill="#5b6578" text-anchor="start">Kolmele E-tuumale ei ole tööd. Windows pargib need: tuum lülitatakse süvaunne ja talle lõimi ei anta.</text><text x="40" y="452" font-size="12.5" font-weight="400" fill="#5b6578" text-anchor="start">Kui koormus kasvab, äratatakse pargitud tuumad uuesti. Nii säästab arvuti energiat ilma kasutajat segamata.</text></g>
<rect x="24" y="494" width="912" height="5" rx="2.5" fill="#b9c0cc"/>
