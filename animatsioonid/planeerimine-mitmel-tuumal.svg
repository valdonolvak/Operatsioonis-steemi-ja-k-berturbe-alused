<text x="660" y="164" font-size="10" font-weight="600" fill="#5b6578" text-anchor="middle">LP 6</text>
<rect x="700" y="110" width="64" height="60" rx="6" fill="#ffffff" stroke="#b9c0cc" stroke-width="1.25"/>
