<rect x="772" y="110" width="64" height="60" rx="6" fill="#ffffff" stroke="#b9c0cc" stroke-width="1.25"/>
<text x="804" y="164" font-size="10" font-weight="600" fill="#5b6578" text-anchor="middle">LP 8</text>
<rect x="844" y="110" width="64" height="60" rx="6" fill="#ffffff" stroke="#b9c0cc" stroke-width="1.25"/>
<text x="876" y="164" font-size="10" font-weight="600" fill="#5b6578" text-anchor="middle">LP 9</text>
<text x="628" y="198" font-size="10.5" font-weight="400" fill="#5b6578" text-anchor="start">L2: ühine kõigile E-tuumadele</text>
<text x="628" y="216" font-size="10.5" font-weight="400" fill="#5b6578" text-anchor="start">madalam sagedus, väiksem voolutarve</text>
